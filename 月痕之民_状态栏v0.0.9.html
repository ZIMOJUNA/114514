.yh-sb .yh-d   { color: var(--p-ink3); font-size: var(--fs-1); }
.yh-sb .yh-ok  { color: var(--p-ink2); font-size: var(--fs-1); }
.yh-sb .yh-err {
  margin-top: var(--sp-2);
  padding: 5px 8px;
  background: #eee7df;                                            /* 兜底：手算的 7% 混色 */
  background: color-mix(in srgb, var(--p-urgent) 7%, var(--p-card));
  border-left: 2px solid var(--p-urgent);
  color: var(--p-urgent);
  white-space: pre-wrap;
}

/* ── 页脚（源行）也压一道冷灰带，跟徽记呼应 ── */
.yh-sb .yh-src {
  margin: 0;
  padding: 5px var(--pad-x) 6px;
  background: var(--p-sunk);
  border-top: 1px solid var(--p-line2);
}

/* ── 折叠 ── */
.yh-sb .yh-fb {
  font: inherit;
  font-size: var(--fs-1);
  line-height: 1.5;
  letter-spacing: .05em;
  color: var(--p-ink2);
  padding: 0 6px;
  background: none;
  border: 1px solid var(--p-line2);
  border-radius: 0;
  cursor: pointer;
  transition: color .16s ease, border-color .16s ease;
}
.yh-sb .yh-fb:hover { color: var(--p-ink); border-color: var(--p-ink2); }
.yh-sb .yh-fold { margin-top: 3px; padding-left: 10px; color: var(--p-ink2); font-size: var(--fs-1); }
.yh-sb .yh-fold[hidden] { display: none; }

@media (prefers-reduced-motion: reduce) {
  .yh-sb *, .yh-sb *::before, .yh-sb *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
/* ── 内容区：卡片 ＋ 池子条 ＋ 详情层（视觉重做 · 2026-09-27） ── */

/* ── 令牌补层 ── */
.yh-sb {
  
  --p-raise:  #FCFAF5;                    /* 抬升面：卡片 / 报头 / 选中页签 —— 比面板亮 ⇒ 浮起来 */
  --p-raise2: #FFFFFF;                    /* 抬升面·悬停 —— 只再亮一档，不加投影（四改的口径） */
  --p-onpool: #FFFFFF;                    /* 压在**池子填充色**上的字（条内数值）—— 色上色，不是纸上色 */
  --p-well:   color-mix(in srgb, var(--p-ink) 7%, transparent);      /* 凹槽：选中页签底 */
  --p-chip:   color-mix(in srgb, var(--p-ink) 5.5%, transparent);    /* chip 底（中性） */

  
  --r-1: 4px;  --r-2: 8px;  --r-3: 12px;  --r-pill: 999px;

  
  --c-hp-a: #B0746A;  --c-hp-b: #CBA79C;   /* HP 陶玫 */
  --c-mp-a: #7F92A6;  --c-mp-b: #A8B6C4;   /* MP 雾蓝 */
  --c-sp-a: #5F7A5A;  --c-sp-b: #9DAE93;   /* SP 瓶绿 */
  --c-exp-a:#A8894A;  --c-exp-b:#C8A357;   /* EXP 赭金 */
  --c-ok:   #5F7A5A;                        /* 增益/已解锁 —— 同 SP 色系 */
  --c-bad:  #A05C4C;                        /* 告急（＝ --p-urgent） */
  --c-spec: #A8894A;                        /* 特殊（＝ 赭金） */
  --c-main: #6B5F4A;                        /* 主色：影褐 —— 选中/指示器 */

  /* ── 分组色（2026-09-28 加） ── */
  --g-life: #A9736A;   /* 三值 —— 陶玫（生命体征） */
  --g-dim:  #C8A357;   /* 五维 —— 赭金（星） */
  --g-res:  #7F92A6;   /* 三抗 —— 雾蓝（盾） */
  --g-mind: #8E7E93;   /* 心智 —— 灰紫（眼） */
  --g-grow: #5F7A5A;   /* 成长 —— 瓶绿（升） */
  /* 2026-09-30 加两组（卡文 `1108` 三、的「八 攻」「五 质点」两行）——
     同一条判据：**矿物色、在暖米纸上降过饱和**，不与 `--p-urgent` 抢读。 */
  --g-atk:  #9A6A55;   /* 攻 —— 熟赭（剑） */
  --g-node: #6E7F86;   /* 质点 —— 青灰（钻石切面） */
}

/* ── 网格 ── */
.yh-sb .yh-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: var(--sp-3);
  row-gap: var(--sp-3);            /* 16→12：卡片自己有边有底了，不再需要大间距扛分组 */
  align-items: start;
}

.yh-sb .yh-grid > .yh-g-life { grid-column: 1 / -1; }
@media (max-width: 860px) {
  .yh-sb .yh-grid { grid-template-columns: minmax(0, 1fr); }
}

/* ── 卡 ── */
.yh-sb .yh-card {
  font: inherit;
  text-align: left;
  color: inherit;
  
  
  background: var(--p-raise);
  border: 1px solid var(--p-line2);
  border-radius: var(--r-1);
  
  
  width: 100%;
  
  box-sizing: border-box;
  min-width: 0;                     /* 网格项的老规矩：不写会被长内容撑破 */
  cursor: pointer;

  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  
  padding: var(--sp-3);
  transition: background .15s ease, border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}

.yh-sb button.yh-card:hover {
  
  background: var(--p-raise2);
  border-color: var(--p-line);
}
.yh-sb button.yh-card:focus-visible {
  outline: 2px solid var(--c-main);
  outline-offset: 1px;
}
.yh-sb div.yh-card { cursor: default; }

/* ── 分组卡：五张卡各自的色带（「状态」页专用） ── */
.yh-sb .yh-gcard {
  --g: var(--g-dim);                       /* 兜底：认不出的组走赭金，不是空白 */
  
  border-top: 3px solid var(--g);
}
.yh-sb .yh-g-life { --g: var(--g-life); }
.yh-sb .yh-g-dim  { --g: var(--g-dim);  }
.yh-sb .yh-g-res  { --g: var(--g-res);  }
.yh-sb .yh-g-mind { --g: var(--g-mind); }
.yh-sb .yh-g-grow { --g: var(--g-grow); }
.yh-sb .yh-g-atk  { --g: var(--g-atk);  }
.yh-sb .yh-g-node { --g: var(--g-node); }


.yh-sb .yh-c-h {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.yh-sb .yh-c-n {
  font-size: var(--fs-3);
  font-weight: 700;
  color: var(--p-ink);
  line-height: 1.3;
  word-break: break-word;
  min-width: 0;
}
/* 卡头的图标 —— 跟着名字走，不抢焦点 */
.yh-sb .yh-c-h .yh-i { color: var(--p-ink3); }

.yh-sb .yh-c-go { margin-left: auto; }


.yh-sb .yh-c-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  min-width: 0;
}
.yh-sb .yh-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 22px;
  padding: 2px 8px;
  border-radius: var(--r-pill);
  border: 1px solid var(--p-line3);
  background: var(--p-chip);
  color: var(--p-ink2);
  font-size: var(--fs-1);
  line-height: 1.3;
  white-space: nowrap;
  max-width: 100%;
}

.yh-sb .yh-chip-on   { border-color: color-mix(in srgb, var(--c-ok)   42%, var(--p-line3) 58%);
                       background:   color-mix(in srgb, var(--c-ok)   12%, transparent); color: var(--c-ok); }
.yh-sb .yh-chip-off  { border-color: var(--p-line3); background: var(--p-chip); color: var(--p-ink3); }
.yh-sb .yh-chip-bad  { border-color: color-mix(in srgb, var(--c-bad)  42%, var(--p-line3) 58%);
                       background:   color-mix(in srgb, var(--c-bad)  12%, transparent); color: var(--c-bad); }
.yh-sb .yh-chip-spec { border-color: color-mix(in srgb, var(--c-spec) 42%, var(--p-line3) 58%);
                       background:   color-mix(in srgb, var(--c-spec) 12%, transparent); color: var(--c-spec); }

.yh-sb .yh-c-sum {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  
  padding: 6px 9px 0;
  border-left: 2px solid color-mix(in srgb, var(--c-main) 44%, transparent);
  border-radius: 0 var(--r-1) var(--r-1) 0;
  background: color-mix(in srgb, var(--p-ink) 4%, transparent);
  color: var(--p-ink2);
  font-size: var(--fs-2);
  line-height: 1.55;
  word-break: break-word;
}


.yh-sb .yh-c-kv {
  display: grid;
  grid-template-columns: minmax(56px, auto) minmax(0, 1fr);
  gap: 3px var(--sp-3);
  align-items: baseline;
  min-width: 0;
}
.yh-sb .yh-c-kv > .yh-k {
  color: var(--p-ink3);
  font-size: var(--fs-1);
  font-weight: 600;
  white-space: nowrap;
}
.yh-sb .yh-c-kv > .yh-v {
  color: var(--p-ink);
  font-size: var(--fs-2);
  min-width: 0;
  word-break: break-word;
}

.yh-sb .yh-c-kv { row-gap: 0; column-gap: 0; }
.yh-sb .yh-c-kv > .yh-k,
.yh-sb .yh-c-kv > .yh-v {
  padding-block: 3px;
  border-bottom: 1px solid color-mix(in srgb, var(--p-ink) 9%, transparent);
}

.yh-sb .yh-c-kv > .yh-v { padding-left: var(--sp-3); }
.yh-sb .yh-c-kv > :nth-last-child(-n+2) { border-bottom: 0; }



.yh-sb .yh-no { color: var(--p-fault); font-weight: 700; }
.yh-sb .yh-d  { color: var(--p-ink3); }

/* ── 空页（还没装东西的页签 —— 现值只有地图页）──
   🔴 画的不是「错误」，是**一个留好的空位**（缺数据 / 缺图 / 缺归属，三样全在卡外）。
   🔴 全部走细线：底下**不许出现任何实心色块**（「大面积实心填充 ＝ 廉价」，与颜色无关）。
   🔴 板子**贴着内容收**（'fit-content'），不给死宽度 —— 给宽度就得跟着字号档位改，
      而刻线离字一远就从「框」变成「噪声」（260px 那版实拍就是这个下场）。 */
.yh-sb .yh-空 {
  position: relative;
  box-sizing: border-box;
  width: fit-content;
  margin-inline: auto;
  padding: 26px 44px 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 9px;
  color: var(--p-ink3);
}
.yh-sb .yh-空 > .yh-i { width: 32px; height: 32px; opacity: .68; }
.yh-sb .yh-空 > .yh-d {
  font-size: var(--fs-2);
  letter-spacing: .2em;
  text-indent: .2em;      /* 字距把整行往右推了 ⇒ 等量缩进压回视觉居中 */
}

/* 四角刻线 —— 8 条 1px 的线（最大 13×1），是**刻线不是填充** */
.yh-sb .yh-空::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  --c: color-mix(in srgb, var(--p-ink) 28%, transparent);
  background-image:
    linear-gradient(var(--c), var(--c)), linear-gradient(var(--c), var(--c)),
    linear-gradient(var(--c), var(--c)), linear-gradient(var(--c), var(--c)),
    linear-gradient(var(--c), var(--c)), linear-gradient(var(--c), var(--c)),
    linear-gradient(var(--c), var(--c)), linear-gradient(var(--c), var(--c));
  background-repeat: no-repeat;
  background-size: 1px 13px, 13px 1px, 1px 13px, 13px 1px,
                   1px 13px, 13px 1px, 1px 13px, 13px 1px;
  background-position: 0 0, 0 0, 100% 0, 100% 0,
                       0 100%, 0 100%, 100% 100%, 100% 100%;
}

/* ── 图标 ── */
.yh-sb .yh-i {
  display: inline-block;
  flex: 0 0 auto;
  width: 14px;
  height: 14px;
  background: currentColor;
  -webkit-mask: var(--i) center / contain no-repeat;
          mask: var(--i) center / contain no-repeat;
}
.yh-sb .yh-i-16 { width: 16px; height: 16px; }
.yh-sb .yh-i-18 { width: 18px; height: 18px; }

/* ── 池子条 ── */

.yh-sb .yh-pools { display: flex; flex-direction: column; gap: var(--sp-3); }

.yh-sb .yh-pool {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-width: 0;
}
.yh-sb .yh-pool-l {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: 0 0 auto;
  min-width: 52px;
}
.yh-sb .yh-pool-k {
  font-size: var(--fs-2);
  font-weight: 700;
  color: var(--p-ink2);
  letter-spacing: .08em;
  white-space: nowrap;
}

.yh-sb .yh-pool-l .yh-i { color: var(--bar-a); }

.yh-sb .yh-pool-num {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--fs-2);
  font-weight: 700;
  letter-spacing: .02em;
  line-height: 1;
  font-variant-numeric: tabular-nums;   /* 数字等宽 —— 数值变的时候字不会左右跳 */
  white-space: nowrap;
  pointer-events: none;                  /* 它压在轨道上，别把点击吃掉 */
  color: var(--p-ink2);
}
.yh-sb .yh-pool-num-w { color: var(--p-onpool); }

.yh-sb .yh-pool-t {
  position: relative;
  display: block;
  flex: 1 1 auto;
  height: 24px;
  border-radius: 999px;      /* 2026-09-28 四改：胶囊 —— 参考图的轨道是圆的 */
  overflow: hidden;          /* 上层白字靠这道裁 —— 数值层不许越出胶囊 */
  min-width: 0;
  background: var(--p-sunk);
}

.yh-sb .yh-pool-f {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  border-radius: 999px;
  background: var(--bar-a);
  transition: width .25s ease;
}
.yh-sb .yh-hp  { --bar-a: var(--c-hp-a);  --bar-b: var(--c-hp-b); }
.yh-sb .yh-mp  { --bar-a: var(--c-mp-a);  --bar-b: var(--c-mp-b); }
.yh-sb .yh-sp  { --bar-a: var(--c-sp-a);  --bar-b: var(--c-sp-b); }
.yh-sb .yh-exp { --bar-a: var(--c-exp-a); --bar-b: var(--c-exp-b); }

.yh-sb .yh-pool-na .yh-pool-f { display: none; }
.yh-sb .yh-pool-na .yh-pool-num { color: var(--p-fault); font-weight: 700; font-size: var(--fs-2); }

/* ── 统计小格 ── */

.yh-sb { overflow-wrap: normal; }
.yh-sb .yh-c-sum { overflow-wrap: anywhere; }
.yh-sb .yh-f .yh-v { overflow-wrap: anywhere; }

/* ── 统计小格 ── */
/* ── 读数格：列数按 `--格数` 均分 ／ 分格走格顶刻度线（2026-09-30 重做） ── */
.yh-sb .yh-stats {
  display: grid;
  grid-template-columns: repeat(var(--格数, 3), minmax(0, 1fr));
  gap: 2px var(--sp-3);
}
@media (max-width: 430px) {
  .yh-sb .yh-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.yh-sb .yh-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  padding: 4px 0 2px;
  border-top: 1px solid color-mix(in srgb, var(--p-ink) 13%, transparent);
}
/* ── 墓碑：`.yh-stat:last-child { grid-column-end: -1 }` ＋ `.yh-stat-w`（2026-09-28 撤） ── */

.yh-sb .yh-stat-k {
  color: var(--p-ink3);
  
  font-size: var(--fs-1);
  font-weight: 700;
  letter-spacing: .04em;
  
  overflow-wrap: normal;
  min-width: 0;
}
.yh-sb .yh-stat-v {
  color: var(--p-ink);
  
  font-size: 18px;
  font-weight: 700;
  line-height: 1.15;
  font-variant-numeric: tabular-nums;
  
  word-break: keep-all;
  overflow-wrap: normal;
  
  white-space: nowrap;
}

.yh-sb .yh-stat-row {
  flex-direction: row;
  /* 🔴 **两行都贴格顶**（2026-09-30 改，原 `flex-end`）——
     原意是"主行贴底、副行往下长"，可**带副的格是三行、不带的是两行**，
     底部对齐 ⇒ 三行那格整体上移一行 ⇒ **它的标签比别人高一行**
     （实拍「心智」：`月蚀度` 的标签比 `理智/理智稳定性/人性` 高 15px；
      「成长」的 `晋升进度` 比 `阶位/属性点` 高得更多）。
     贴顶之后：**标签一条线、值一条线**，副行挂在值下面 —— 同排读数照样对齐。 */
  align-items: baseline;
  align-content: flex-start;
  justify-content: space-between;

  flex-wrap: wrap;
  gap: 2px 6px;
}

/* 标签下限 3.6em → 2.4em（窄格不再把值折到第二行） */
/* 🔴 **标签恒占一行、值恒在下一行**（2026-09-30 改）——
   原先是 `flex: 1 1 auto` ＋ `justify-content: space-between`：**装得下就一行、
   装不下才折**。后果不是"有的格折行"，是**同组里混着单行格和双行格**
   ⇒ 同排的值落在**两条不同的基线**上：实拍「心智」那组，
   `人性 74` 是单行、`理智稳定性 85` 是双行，`74` 正好停在 `85` 旁边，读起来像"85 74"。
   `flex-basis: 100%` ⇒ 每格恒两行、标签同一条线、值同一条线。
   ⚠ 这是「宁可整格折行」那条规矩的延伸：折行可以，**但必须整组一起折**。 */
.yh-sb .yh-stat-row > .yh-stat-k { flex: 1 0 100%; min-width: 0; }
.yh-sb .yh-stat-row > .yh-stat-v { flex: 1 1 auto; min-width: 0; text-align: right; }
/* ── 值组：数值在上、**品阶/状态在下一行**（2026-09-28 加，驾驶员裁定「用命定」） ── */
/* ⚠ 上一行把标签顶成独占一行之后，值组也**必须自己占满一行** ——
   它是 flex 容器、`text-align: right` 对它不生效，而 `justify-content: space-between`
   在"一行只有一个元素"时把它**贴左**。实测：五个维度 ＋ 月蚀度 ＋ 律座 ＋ 晋升进度
   共 8 格的值右偏 44~69px（量具当场报 🔴）。`flex-basis: 100%` ⇒ 值组占满、
   内部 `align-items: flex-end` 把值送到右边。 */
.yh-sb .yh-stat-row > .yh-stat-vg {
  flex: 1 0 100%;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 1px;
}

.yh-sb .yh-stat-vs {
  font-size: var(--fs-1);
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--p-ink3);
}

@media (max-width: 430px) {
  .yh-sb .yh-stat-v { font-size: 17px; }
  .yh-sb .yh-stat { padding: 5px 7px; }
}



/* ── 组名（状态页的分组抬头） ── */
.yh-sb .yh-gcard > .yh-gn {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--p-ink);
  font-size: var(--fs-2);
  font-weight: 700;
  letter-spacing: .06em;
}

.yh-sb .yh-gcard > .yh-gn .yh-i { color: var(--g); }
.yh-sb .yh-gcard > .yh-gn::after {
  content: '';
  flex: 1 1 auto;
  min-width: 12px;
  height: 1px;
  margin-left: 3px;
  
  background: color-mix(in srgb, var(--g) 32%, transparent);
}

.yh-sb .yh-gn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--p-ink);
  font-size: var(--fs-1);
  font-weight: 700;
  letter-spacing: .02em;
}

/* 组抬头右边的副题（`组攻` 的 `主手段`）—— 小一号、二级墨，**不抢抬头**；
   长了就换行，**不截断**（截断＝静默吞数据）。 */
.yh-sb .yh-gn-sub {
  min-width: 0;
  color: var(--p-ink2);
  font-size: var(--fs-1);
  font-weight: 400;
  letter-spacing: .03em;
  word-break: break-word;
}
.yh-sb .yh-gn .yh-i { color: var(--c-main); opacity: .85; }

/* ── 状态筛：主线 / 任务两页顶上那一条（2026-09-29） ──
   🔴 这一层**没有任何实心块** —— 连页签条那条 '--psunk' 凹槽都刻意不画。
      选中的那一档靠**竖刻度 ＋ 字重**立起来；给底、给胶囊、给色块都是"常见 AI 设计"。
   🔴 记号是页签条那支竖刻度（见 '候选乙2.html' 的 '.yh-tab::before'）**小一号**：
      2×15 → 2×11。同一个「你在这」手势，低一层换尺寸就够，不另造一套语言。
   ⚠ 底下那道 1px 就是普通的弱分隔线（同数据行），不是"选中态的底"。 */
.yh-sb .yh-flt {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0 2px;
  margin: 0 0 var(--sp-3);
  padding-bottom: 6px;
  border-bottom: 1px solid var(--p-line3);
}
.yh-sb .yh-fl {
  position: relative;
  font: inherit;
  font-size: var(--fs-1);
  line-height: 1.5;
  letter-spacing: .05em;
  color: var(--p-ink3);
  background: none;
  border: 0;
  border-radius: 0;
  /* 🔴 **它是个控件，不是一行字** —— 2026-09-29 量出来只有 23.25px 高
     （`3+3` 内边距 ＋ 17.25 的行盒），量具当场报「🔴矮」。
     地板取 **32px**：那是**命定关闭键的实测值**（见 `_量分栏.mjs` 里那句
     "44 ＝ 创世明写的'主要操作'下限 · 32 ＝ 命定关闭键实测"）。
     筛不是主要操作，够不到 44；但它得按得着，23 太小了。
     ⚠ 内容靠 `inline-flex` 居中 —— 只给 `min-height` 的话字会贴着上边。 */
  display: inline-flex;
  align-items: center;
  min-height: 32px;
  padding: 3px 10px 3px 11px;
  cursor: pointer;
  transition: color .16s ease;
}
.yh-sb .yh-fl::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  width: 2px;
  height: 0;
  transform: translateY(-50%);
  background: var(--pink);
  opacity: 0;
  transition: height .18s cubic-bezier(.2, .75, .25, 1), opacity .18s ease;
}
.yh-sb .yh-fl.yh-fl-on { color: var(--pink); font-weight: 700; }
.yh-sb .yh-fl.yh-fl-on::before { height: 11px; opacity: 1; }
.yh-sb .yh-fl:hover { color: var(--p-ink2); }
.yh-sb .yh-fl:focus-visible { outline: 2px solid var(--c-main); outline-offset: -1px; }
/* 条数 —— 恒为 400 ／ 三级墨，**不吃选中态的加粗**：它是账尾，不是标签的一部分 */
.yh-sb .yh-fl-n {
  margin-left: 4px;
  font-weight: 400;
  color: var(--p-ink3);
  font-variant-numeric: tabular-nums;
}

/* ── 好感度刻度轴：卡上一行（小）／详情层一整块（大）（2026-09-29） ──
   🔴 值域 `−200…200` 是**卡文硬封**（`D71` ②「撞到两端停住」），不是这里定的。
   🔴 **通体单色、零实心填充。** 「当前在哪」一律走 `--p-ink` ——
      `--p-urgent` 那套信号色只管「告急」，好感度没有告急这一说。正负两侧靠
      **位置**分，不靠颜色分：轴本来就是为了不必上色才存在的。
   🔴 记号是页签条（`.yh-tab::before`）／状态筛（`.yh-fl::before`）那支竖记号的
      **第三处** —— 同一支笔画，不另造一套记号。
   🔴 记号与刻度靠**方向**分（记号向上穿出线，刻度一律在线下），**不靠长度分**：
      两个都从线往下长的时候，`+30` 的记号与 `0` 那根刻度只差 4px，扫一眼是一团。见 `.yh-ax-m`。
   🔴 `0` 那条刻度**加高**：它是语义铰链（左＝恶感 / 右＝好感），不是普通刻度。
      这不是装饰 —— 没有它，一枚孤零零的记号读不出在哪一侧。
   ⚠ 一套 DOM、两套布局：大档三行（签+值 / 轨 / 刻度字），小档一行（签 / 轨 / 值）。
     小档靠 `.yh-ax-s` 改 `grid-template-areas` 就够，不另造一棵子树。 */
.yh-sb .yh-ax {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  grid-template-areas: "k v v" "t t t" "n n n";
  align-items: center;
  gap: 5px 8px;
  min-width: 0;
}
.yh-sb .yh-ax-k { grid-area: k; font-size: var(--fs-1); color: var(--p-ink3); letter-spacing: .04em; }
.yh-sb .yh-ax-v {
  grid-area: v; justify-self: end;
  font-size: var(--fs-2); font-weight: 700; color: var(--p-ink);
  font-variant-numeric: tabular-nums;
}
/* 轨的容器：`position: relative` 是给刻度与记号定位用的，本身不画东西 */
.yh-sb .yh-ax-t { grid-area: t; position: relative; height: 18px; min-width: 0; }
.yh-sb .yh-ax-l { position: absolute; left: 0; right: 0; top: 8px; height: 1px; background: var(--p-line2); }
.yh-sb .yh-ax-tk { position: absolute; top: 8px; width: 1px; height: 4px; background: var(--p-line3); }
.yh-sb .yh-ax-tk.z { height: 9px; background: var(--p-ink3); }
/* 🔴 **记号要「骑在线上」，不是「挂在线下」**（2026-09-29 改）。
   原来它跟刻度一样从线**向下**长（4px vs 记号 8px），差别只有 4px——
   而 900 档实拍下面，`+30` 那枚记号与 `0` 那根刻度**只隔 60px、两根都是深色**，
   扫一眼读成"一根粗记号"（卡上更糟：`+30 / +12 / +8` 三张卡全挤在 0 附近，
   每张都是这么一团）。
   ⇒ 判据改成**方向**，不是长度：**线以上只可能是记号，线以下才是刻度。**
      记号向上穿出 7px、刻度一律在线下 —— 一个像素都不用数，扫一眼就分得开。
   ⚠ 长度差保留（记号 17px / 零刻度 9px / 普通刻度 4px），但**它不再是主要判据**。 */
.yh-sb .yh-ax-m {
  position: absolute; top: 1px; width: 2px; height: 17px;
  margin-left: -1px;                       /* 记号**骑在**刻度上，不是从它右边起 */
  border-radius: 1px;
  background: var(--p-ink);
  transition: left .22s cubic-bezier(.2, .75, .25, 1);
}
.yh-sb .yh-ax-n {
  grid-area: n; position: relative; height: 12px;
  font-size: 10px; line-height: 12px; color: var(--p-ink3);
  letter-spacing: .02em; font-variant-numeric: tabular-nums;
}
.yh-sb .yh-ax-n span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.yh-sb .yh-ax-n span:first-child { transform: none; }
.yh-sb .yh-ax-n span:last-child { transform: translateX(-100%); }

/* 小档（卡上那一行）：签 / 轨 / 值 一行放下，刻度字不画 */
.yh-sb .yh-ax-s { grid-template-areas: "k t v"; gap: 0 8px; }
.yh-sb .yh-ax-s .yh-ax-t { height: 13px; }
.yh-sb .yh-ax-s .yh-ax-l { top: 6px; }
.yh-sb .yh-ax-s .yh-ax-tk { top: 6px; height: 3px; }
.yh-sb .yh-ax-s .yh-ax-tk.z { height: 6px; }
.yh-sb .yh-ax-s .yh-ax-m { top: 2px; height: 11px; }
.yh-sb .yh-ax-s .yh-ax-n { display: none; }
.yh-sb .yh-ax-s .yh-ax-v { font-size: var(--fs-1); }

/* 读不到好感度 ⇒ **轨照画、记号不画**，值写「读不到」——
   跟池子条那条同一个口径：画一枚停在 0 的记号会被读成「好感度是 0」，那是另一个意思。 */
.yh-sb .yh-ax-na .yh-ax-v { font-weight: 400; color: var(--p-ink3); }
.yh-sb .yh-ax-na .yh-ax-l { background: var(--p-line3); }

/* ── 主线 · 节点树（2026-09-30 加）──
   竖轨 ＋ 记号：走完的＝实心点，当前＝圆环 ＋ 尾签，轨在末尾往下淡出（底下是还没走的路）。
   ⚠ 记号一律 **CSS 画**，不引图标 —— 图标答「这是什么」，这一块答「走到哪了」。 */
.yh-sb .yh-tree { margin-top: 2px; }
.yh-sb .yh-tr-h {
  display: flex; align-items: baseline; gap: 8px;
  padding-bottom: 7px; border-bottom: 1px solid var(--p-line3);
}
.yh-sb .yh-tr-hk { font-size: var(--fs-1); font-weight: 600; color: var(--p-ink2); }
.yh-sb .yh-tr-hv {
  margin-left: auto; font-size: var(--fs-1); color: var(--p-ink3);
  font-variant-numeric: tabular-nums;
}
.yh-sb .yh-tr { list-style: none; margin: 0; padding: 0; }
.yh-sb .yh-tr-n {
  position: relative; display: flex; align-items: baseline; gap: 8px;
  padding: 9px 0 9px 22px;
}
/* 竖轨 —— 贯穿本节点、接上下一个；`left:3.5px` 与 9px 记号的中心（4.5px）对齐。
   走完的那几段＝**实线**（`--p-ink3`，比线色重一档 ⇒ 一眼看出是走过的路）。 */
.yh-sb .yh-tr-n::before {
  content: ''; position: absolute; left: 3.5px; top: 18px; bottom: 0; width: 2px;
  background: var(--p-ink3);
}
/* 最后一个（＝当前节点）往下＝**虚线** —— 底下是还没走的路。
   虚线的意思是「路还在」，不是「线断了」；参考图（探索与成长手册·成就道路）
   走的正是这一套：实路 ＝ 走过，虚路 ＝ 还没走。 */
.yh-sb .yh-tr-n:last-child::before {
  background: repeating-linear-gradient(to bottom, var(--p-line2) 0 3px, transparent 3px 7px);
  bottom: 6px;
}
/* 末尾留出这一段 —— 虚线才有地方跑，「前面还有路」才看得见 */
.yh-sb .yh-tr-n:last-child { padding-bottom: 26px; }
/* 路到头了（`已完成` / `已失败`）⇒ 虚线掐掉、尾距收回。**断掉的路不许画成还能走。** */
.yh-sb .yh-tree.is-end .yh-tr-n:last-child { padding-bottom: 9px; }
.yh-sb .yh-tree.is-end .yh-tr-n:last-child::before { display: none; }
.yh-sb .yh-tr-m { position: absolute; left: 0; top: 11px; width: 9px; height: 9px; border-radius: 50%; }
.yh-sb .yh-tr-n.is-done .yh-tr-m { background: var(--p-ink3); }
.yh-sb .yh-tr-n.is-now .yh-tr-m { background: var(--p-raise); box-shadow: 0 0 0 2px var(--p-ink); }
.yh-sb .yh-tr-t { font-size: var(--fs-2); line-height: 1.55; color: var(--p-ink2); overflow-wrap: anywhere; }
.yh-sb .yh-tr-n.is-now .yh-tr-t { color: var(--p-ink); font-weight: 600; }
.yh-sb .yh-tr-g { flex: 0 0 auto; margin-left: auto; padding-left: 10px; font-size: var(--fs-1); color: var(--p-ink3); }
/* 岔口 —— 一小段四分之一圆弧从轨尾拐出去，比另起一行字更说明「这里分叉」 */
.yh-sb .yh-tr-f {
  position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr);
  gap: 3px 10px; align-items: baseline; padding: 9px 0 2px 22px;
}
.yh-sb .yh-tr-f::before {
  content: ''; position: absolute; left: 3.5px; top: -1px; width: 12.5px; height: 12.5px;
  border-left: 2px solid var(--p-ink3); border-bottom: 2px solid var(--p-ink3);
  border-bottom-left-radius: 7px;
}
.yh-sb .yh-tr-fk { font-size: var(--fs-1); font-weight: 600; color: var(--p-ink3); white-space: nowrap; }
.yh-sb .yh-tr-fv { font-size: var(--fs-2); line-height: 1.6; color: var(--p-ink2); overflow-wrap: anywhere; }

/* ── 主线 · 卡面记号轨（只卡）—— 走完的串成一串点，当前一颗圆环 ── */
.yh-sb .yh-rail { display: flex; align-items: center; gap: 5px; margin-top: 8px; }
.yh-sb .yh-rail i { position: relative; display: block; width: 7px; height: 7px; border-radius: 50%; background: var(--p-ink3); }
.yh-sb .yh-rail i:not(:last-child)::after {
  content: ''; position: absolute; left: 100%; top: 50%; width: 5px; height: 1px;
  background: var(--p-line2); transform: translateY(-50%);
}
.yh-sb .yh-rail i.is-now { width: 9px; height: 9px; background: var(--p-raise); box-shadow: 0 0 0 1.5px var(--p-ink); }
.yh-sb .yh-rail i.is-more {
  width: auto; height: auto; border-radius: 0; background: none;
  font-size: var(--fs-1); color: var(--p-ink3); font-variant-numeric: tabular-nums;
}

/* ── 详情层：**取代**内容区（不是盖在上面） ── */
.yh-sb { position: relative; }
.yh-sb .yh-pane { position: relative; }
.yh-sb .yh-pane:has(.yh-ovl) > .yh-grid,
.yh-sb .yh-pane:has(.yh-ovl) > .yh-flt { display: none; }

.yh-sb .yh-pane:has(.yh-ovl) { padding: 0; }
.yh-sb .yh-ovl { position: relative; display: flex; }
.yh-sb .yh-sheet {
  width: 100%;
  display: flex;
  flex-direction: column;
  background: var(--p-card);
  
  animation: yh-浮现 .18s ease;
  outline: none;
}
.yh-sb .yh-sh-h {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--pad-x) var(--sp-2);
}

.yh-sb .yh-sh-x {
  font: inherit;
  font-size: var(--fs-1);
  line-height: 1.5;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  
  min-height: 44px;
  margin-left: -10px;
  background: color-mix(in srgb, var(--p-ink) 5%, transparent);
  border: 1px solid var(--p-line3);
  border-radius: var(--r-pill);
  color: var(--p-ink2);
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s ease, border-color .15s ease;
}
.yh-sb .yh-sh-x:hover,
.yh-sb .yh-sh-x:focus-visible { background: color-mix(in srgb, var(--p-ink) 9%, transparent); border-color: var(--p-line2); color: var(--p-ink); }

.yh-sb .yh-sh-x:focus-visible,
.yh-sb .yh-sh-tab:focus-visible {
  outline: 2px solid var(--c-main);
  outline-offset: 1px;
}
.yh-sb .yh-sh-t {
  font-size: var(--fs-3);
  font-weight: 700;
  color: var(--p-ink);
  line-height: 1.3;
  min-width: 0;
  word-break: break-word;
}
/* ── 详情层的子页签条（2026-09-28 加 · 任务 #14「详情里再分子页签」） ── */
.yh-sb .yh-sh-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  padding: 0;
  margin: 0 var(--pad-x) var(--sp-2);
  border: 0;
  border-bottom: 1px solid var(--p-line3);
  background: none;
  border-radius: 0;
}
.yh-sb .yh-sh-tab {
  font: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex: 1 1 0;
  min-width: 0;
  max-width: none;
  min-height: 44px;
  padding: 4px 10px;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--p-ink3);
  font-size: var(--fs-2);
  font-weight: 600;
  line-height: 1.25;
  text-align: center;
  word-break: break-word;
  cursor: pointer;
  transition: background .15s ease, color .15s ease, box-shadow .15s ease;
}
.yh-sb .yh-sh-tab:hover,
.yh-sb .yh-sh-tab:focus-visible {
  background: color-mix(in srgb, var(--p-ink) 6%, transparent);
  color: var(--p-ink2);
}
.yh-sb .yh-sh-tab-on {
  color: var(--p-ink);
  box-shadow: inset 0 -2px 0 var(--p-ink);
}
.yh-sb .yh-sh-b {
  overflow-y: auto;
  overscroll-behavior: contain;   /* 万一超长要内部滚，别把聊天页带着一起滚 */
  
  scrollbar-width: thin;
  scrollbar-color: color-mix(in srgb, var(--p-ink) 22%, transparent) transparent;
  padding: 0 var(--pad-x) var(--sp-3);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}
.yh-sb .yh-sh-b::-webkit-scrollbar { width: 6px; height: 6px; }
.yh-sb .yh-sh-b::-webkit-scrollbar-track { background: transparent; }
.yh-sb .yh-sh-b::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--p-ink) 22%, transparent);
  border-radius: 3px;
}

.yh-sb .yh-f {
  display: grid;
  grid-template-columns: minmax(56px, auto) minmax(0, 1fr);
  gap: 3px var(--sp-3);
  align-items: baseline;
}
.yh-sb .yh-f .yh-v { white-space: pre-wrap; }
.yh-sb .yh-f .yh-v { color: var(--p-ink); font-size: var(--fs-2); word-break: break-word; }
.yh-sb .yh-f .yh-k { color: var(--p-ink3); font-size: var(--fs-1); font-weight: 600; white-space: nowrap; }


.yh-sb .yh-body { display: flex; flex-direction: column; gap: var(--sp-3); }
.yh-sb .yh-meta {
  display: flex;
  flex-wrap: wrap;
  
  gap: var(--sp-1);
  padding-bottom: var(--sp-3);
  border-bottom: 1px solid var(--p-line3);
}

.yh-sb .yh-meta > .yh-f {
  flex: 0 0 auto;
  min-width: 0;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 24px;
  padding: 3px 10px;
  border: 1px solid color-mix(in srgb, var(--p-ink) 14%, transparent);
  border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--p-ink) 4%, transparent);
}
.yh-sb .yh-meta > .yh-f > .yh-k {
  color: var(--p-ink3);
  font-size: var(--fs-1);
  font-weight: 400;
  letter-spacing: .04em;
}
.yh-sb .yh-meta > .yh-f > .yh-v {
  color: var(--p-ink);
  font-size: var(--fs-2);
  font-weight: 700;
}


/* ── 签里的散文 ＋ 名录块（2026-09-30 加）────────────────────────────────
   「相貌 / 来历 / 性格 / 持有」四签的正文。改前每一签只有一段裸散文 —— 一整屏
   只有三五行字，所以驾驶员的原话是「人物这三个里面内容我记得还是太少了」。
   现在每签 ＝ 一段散文（主角）＋ 一到三片名录（旁证）。 */

/* 散文 —— 就是 `.yh-f > .yh-v` 那一档字，但**没有标签列** ⇒ 独占整幅。
   `max-width` 走 `62ch`：一行超过大约 60 个汉字，眼睛回行会找错行
   （中文比西文更吃这个 —— 没有词间空格当"路标"）。 */
.yh-sb .yh-prose {
  max-width: 62ch;
  color: var(--p-ink);
  font-size: var(--fs-2);
  line-height: 1.75;
  white-space: pre-wrap;
  word-break: break-word;
}

.yh-sb .yh-rec { display: flex; flex-direction: column; }

/* ── 详情层里那份「图 ＋ 身份」：**裸的**（2026-09-29） ──

   🔴 为什么要并排：并排之前，132×176 的立绘孤零零挂在左边，

     而媒体查询在文件更后面 ⇒ 它会连"裸的"那套 padding 一起盖掉，头盒在窄档悄悄长出内边距。
     同特异度下**靠位置赢**，所以这里不是重复，是拿回本属于自己的那条。 */

/* ── 窄屏：分组点击展开 / 收起（2026-10-01 驾驶员工单） ──────────────────────
   窄屏下分组卡塌成一列，「状态」页拖成一根长条 ⇒ 组抬头可点、组内容默认收起，
   抬头本身就是索引。**零 JS**：开关是一个视觉隐藏的复选框，显隐全交给 `:has()`。
   ⚠ `.yh-sr` 与 `.yh-ar` 的基础规则**必须在媒体查询外面** ——
     复选框在任何宽度都存在，基础规则漏在外面它会在宽档露出来；
     箭是空的 `<i>`，不给 `display:none` 它会吃掉 `.yh-gn` 那 7px 的 `gap`，宽档布局会挪。 */
.yh-sb .yh-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);

}
.yh-sb .yh-gn > .yh-ar { display: none; }

@media (max-width: 640px) {
  .yh-sb .yh-gcard:has(> .yh-cl) > .yh-gn {
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .yh-sb .yh-gcard > .yh-gn > .yh-ar {
    display: block;
    flex: none;
    width: 0;
    height: 0;
    margin-left: 2px;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;

  }
  .yh-sb .yh-gcard:has(> .yh-cl:not(:checked)) > .yh-gn > .yh-ar { transform: rotate(-90deg); }
  .yh-sb .yh-gcard:has(> .yh-cl:not(:checked)) > *:not(.yh-cl):not(.yh-gn) { display: none; }
  /* 键盘可达 —— 复选框视觉隐藏了，焦点环得画在抬头这一行上，不然 Tab 过去什么都看不见 */
  .yh-sb .yh-gcard > .yh-cl:focus-visible + .yh-gn { outline: 2px solid var(--c-main); outline-offset: 2px; }
}

<body>
<div class="yh-sb"><span class="yh-d">楼层状态栏 · 正在读…</span></div>
<script type="module">
/* ══════════════════════════════════════════════════════════════════════════
   骨架 v0.0.9 · 阶段 1·续（样式层加厚 —— 见头注释那一段）
   ══════════════════════════════════════════════════════════════════════════ */
const 版本 = 'v0.0.9';
const 单例键 = '__yuehenStatusBar__';

/* ── 页表 ────────────────────────────────────────────────────────────────
   6 页照 `_小手机与楼层状态栏方案.md` §3.6；**未建的写「未开放」**。
   ⚠ 「未开放」是**要长期保留的真实状态**（地图页就是这种 —— **未排期**，不是因为不做；§3.6.1），
     不是临时占位。 */
const 页表 = ['状态', '在场', '主线', '任务', '连携', '地图'];
const 已建 = { 状态: true, 在场: true, 主线: true, 任务: true, 连携: true };
let 当前页 = '状态';
let 最后行 = null;   // 🔴 切页重画用它 —— **不重读快照**（重读会多打一次 MVU 接口）
// 🔴 **展开状态保持**（轮 1-8）—— `画()` 是整框重建，不记就会「点开一刷新就弹回去」。
//    存的是**连携名**（字典的键），不是下标 —— 重排之后下标会串位，名字不会。
//    ⚠ 与 1-4 的 `当前页` 同构：模块级一份、跨重画活着；**页签**那一半归轮 1-10。
const 展开的 = new Set();

/* ── 0. 小工具 ─────────────────────────────────────────────────────────── */

// 取一个全局：先看自己这一层，再看上一层。
// ⚠ 酒馆助手把 API 注入**消息楼层 iframe**（C1 §3）；但版本差异下未必都在本层 ⇒ 往上找一层。
function 取全局(名) {
  try { const v = window[名]; if (typeof v !== 'undefined' && v !== null) return v; } catch (_) {}
  try { const v = window.parent[名]; if (typeof v !== 'undefined' && v !== null) return v; } catch (_) {}
  return undefined;
}
const 睡 = (毫秒) => new Promise((r) => setTimeout(r, 毫秒));

/* ── 1. 去重（照 C2 §5.6 的思路：**优先保自己**）────────────────────────
   swipe / edit 会再注入一个 iframe；不处理就是同一楼两个框。
   只删**同一楼里带 .yh-sb 的同类 iframe**，不碰别的东西。

   🔴 **必须等 `.yh-sb` 画出来之后再调**。它不在壳里、在托管那份真身里 ——
      壳一跑就调去重，此刻 iframe 里只有一段 `<script>`、`.yh-sb` 还不存在，
      同类框数永远是 0 ⇒ **去重静默失效、一个框都不删**（看着像"没触发"，其实是从没生效）。
      ⇒ 由 `画()` 末尾触发（画完必调），另外挂两个延时兜底。 */
function 去重() {
  try {
    const 我 = window.frameElement;
    if (!我 || !我.closest) return;
    const 楼 = 我.closest('.mes');
    if (!楼) return;
    const 同类 = [];
    const 全部 = 楼.querySelectorAll('iframe');
    for (let i = 0; i < 全部.length; i++) {
      try {
        const d = 全部[i].contentDocument;
        if (d && d.querySelector('.yh-sb')) 同类.push(全部[i]);
      } catch (_) { /* 跨源读不到就跳过 */ }
    }
    if (同类.length <= 1) return;
    const 留 = 同类.indexOf(我) >= 0 ? 我 : 同类[同类.length - 1];
    for (const x of 同类) if (x !== 留) x.remove();
  } catch (_) {}
}

/* ── 2. 等 Mvu 就绪 ─────────────────────────────────────────────────────── */
async function 等Mvu(毫秒) {
  if (取全局('Mvu')) return true;
  const 等 = 取全局('waitGlobalInitialized');
  if (typeof 等 === 'function') {
    try { await Promise.race([等('Mvu'), 睡(毫秒)]); } catch (_) {}
  }
  return !!取全局('Mvu');
}

/* ── 3. 取本楼楼号 ──────────────────────────────────────────────────────── */
function 取楼号() {
  const f = 取全局('getCurrentMessageId');
  if (typeof f !== 'function') return { 楼: null, 报: '这一层没有 getCurrentMessageId' };
  try {
    const n = f();
    if (typeof n !== 'number' || !isFinite(n)) return { 楼: null, 报: 'getCurrentMessageId 返回的不是数字：' + String(n) };
    return { 楼: n, 报: null };
  } catch (e) {
    return { 楼: null, 报: 'getCurrentMessageId 抛错：' + (e && e.message ? e.message : e) };
  }
}

/* ── 4. 读那一楼自己的快照（只有两条路，第三档是报错）─────────────────── */
function 读快照(楼) {
  const 报 = [];
  const 选 = { type: 'message', message_id: 楼 };   // 🔴 楼号必带 —— 这是全部的重点

  const M = 取全局('Mvu');
  if (M && typeof M.getMvuData === 'function') {
    try {
      const d = M.getMvuData(选);
      if (d && typeof d === 'object') return { 路: 'Mvu.getMvuData', 数据: d, 报 };
      报.push('Mvu.getMvuData 返回的不是对象');
    } catch (e) { 报.push('Mvu.getMvuData 抛错：' + (e && e.message ? e.message : e)); }
  } else {
    报.push('这一层没有 Mvu');
  }

  const G = 取全局('getVariables');
  if (typeof G === 'function') {
    try {
      const d = G(选);
      if (d && typeof d === 'object') return { 路: 'getVariables', 数据: d, 报 };
      报.push('getVariables 返回的不是对象');
    } catch (e) { 报.push('getVariables 抛错：' + (e && e.message ? e.message : e)); }
  } else {
    报.push('这一层没有 getVariables');
  }

  return { 路: null, 数据: null, 报 };
}

/* ── 5. 取值 —— 逐层防御 ─────────────────────────────────────────────────
   🔴 这里防的是「**形状没验过**」，不是「内容会不会错」。
      轮 1-2 只验到 `数据.stat_data` 有 6 个顶层键 —— 那是**本地假 shim 造的形状**
      （`_435干跑.mjs`）；真机上 `Mvu.getMvuData` 到底回什么，**没验过**（方案 §5 头号风险）。
      ⇒ 只判**类型/结构**，任何一层不对就返回 undefined，**绝不抛错**。
   ⚠ **不判取值范围、不判枚举** —— 那是 zod 的活（schema 里全是 clamp/catch），
      在这儿再判一遍是重复投入，还会把 zod 已经修好的值误报成「读不到」。 */
function 取(对象, 路) {
  let 当 = 对象;
  for (const 段 of 路) {
    if (当 === null || typeof 当 !== 'object') return undefined;
    当 = 当[段];
  }
  return 当;
}
const 是串 = (v) => typeof v === 'string';
// `是数` 允许小数 —— 三值/三抗/理智/理智稳定性/人性/月蚀度/晋升进度/进度满值 在 schema 里都是 `数`
const 是数 = (v) => typeof v === 'number' && isFinite(v);
const 是整 = (v) => 是数(v) && Math.trunc(v) === v;

// 给失败路径用：把读到的对象缩成一小段能看的字（免得画出 "object Object"）
function 摘要(v) {
  try {
    const s = JSON.stringify(v);
    if (typeof s !== 'string') return String(v);
    return s.length > 200 ? s.slice(0, 200) + '…' : s;
  } catch (_) { return String(v); }
}

/* ── 6. 四个格子（顶部常驻条，轮 1-3 的东西，一个字没改）─────────────────
   每格自己负责「不对就说读不到」—— **一格坏不塌整条**（C2 §7.2）。
   返回 { 类: '好'|'未定'|'坏' }，怎么显示由 画() 定。 */
const 好 = (文) => ({ 类: '好', 文 });
const 坏 = () => ({ 类: '坏', 文: '读不到' });
/* 好对(签, 值, 副) —— 跟 好() 唯一的差别是**多带两个字段**：
   `文` 仍然是拼好的整串（**文本层一个字不变**），`签`/`值` 只给渲染层用。
   🔴 字段名**不能叫 `名`** —— 本文件 `行.sort(... a.名 ...)` 那批条目对象上已经有了
   （⚠ 原文写的是"第 644 行"，我自己加了三行就把它顶歪了 ⇒ 改成指认写法，不再写行号）。
   🔴 `副`（2026-09-28 加）＝ 值的**品阶/状态**。依据 ＝ 命定 `StatusTab.module.scss`
   `.heroTitleRow` 的成法：`heroLevel`(26px/800) 在上、`heroTier`(15px/700) 在**下一行** ——
   **数值和它的品阶是上下两行，不挤在一行**。月痕「月蚀度 66（蚀刻）」走这条。
   ⚠ `文` 照旧拼成 `签 值（副）`，一个字不变 —— 它是**文本层的兜底**，
     渲染层只有在 `值 == null` 时才回落到它。 */
const 好对 = (签, 值, 副) => ({ 类: '好', 文: 签 + ' ' + 值 + (副 == null ? '' : '（' + 副 + '）'), 签, 值, 副 });

/* 装格(盒, g) —— 5 个渲染点共用的**唯一一处**格子渲染逻辑。
   有 `签`/`值` ⇒ 拆成两个 span（CSS 才能分别调字号与颜色）；
   没有 ⇒ 落兜底，`textContent = g.文`，**与重构前逐字相同**（时刻/地点/字典键那批走这条）。 */
const 装格 = (盒, g) => {
  if (g.签 != null && g.值 != null) {
    const a = document.createElement('span'); a.className = 'yh-k'; a.textContent = g.签;
    const b = document.createElement('span'); b.className = 'yh-v'; b.textContent = g.值;
    // 🔴 中间那个空格**不是排版用的，是给文本层的** —— 直接 `append(a, b)` 会让
    //    textContent 从 `HP 412/500` 变成 `HP412/500`，屏幕阅读器会念成一串
    //    （第 1092-1094 行已经专门记过这个坑）。空格同时充当名值之间的间隙。
    盒.append(a, ' ', b);
  } else {
    盒.textContent = g.文;
  }
  return 盒;
};

// 历法 —— 卡文（世界书 `1090` 历法系统）：新月历 · 元年 1 月 1 日 ＝ 星期一 · 每月固定 30 天。
// 🔴 卡文点名「换日时必须同时改 `星期`……这是本卡最容易犯的错」⇒ 四个格子**都要画出来**，
//    画全了驾驶员一眼就能看出「日改了星期没改」。
function 格历法(世) {
  const 历 = 取(世, ['历法']);
  if (历 === null || typeof 历 !== 'object') return 坏();
  const 年 = 取(历, ['年']), 月 = 取(历, ['月']), 日 = 取(历, ['日']), 星 = 取(历, ['星期']);
  if (!是整(年) || !是整(月) || !是整(日) || !是串(星)) return 坏();
  return 好对('新月历', 年 + '年' + 月 + '月' + 日 + '日 · ' + 星);
}

// 时刻 —— 卡文（`9900044`）：「24 个标准魔导时（对应 60 分/3600 秒）」；
// 🔴「**账本上只记数字**」＋「清晨/傍晚是**叙事用语**……**别写进这一格**」
//    ⇒ 条上照钟点画，不画时段词（钟点才是对原文最贴的读法，方案 §2 注）。
// 补零两位：这一行每回合都要扫，不该因位数变化而跳字（口径 ②）。
function 格时刻(世) {
  const 时 = 取(世, ['时刻']);
  if (!是整(时)) return 坏();
  return 好((时 < 10 ? '0' : '') + 时 + ':00');
}

// 地点 —— 卡文：层级 **大区 → 地点** 两层；`大区` 空串 ＝ 不在任何已生成大区内。
// 🔴 空串**有含义**，不是「没数据」⇒ 大区空就只画地点（口径 ③）；
//    两个都空才画「未定」—— **不许静默留白**，留白分不清「没设」和「坏了」（口径 ④）。
function 格地点(世) {
  const 大 = 取(世, ['大区']), 地 = 取(世, ['地点']);
  if (!是串(大) && !是串(地)) return 坏();
  const 大串 = (是串(大) ? 大 : '').trim();
  const 地串 = (是串(地) ? 地 : '').trim();
  if (!大串 && !地串) return { 类: '未定', 文: '未定' };
  return 好(大串 && 地串 ? 大串 + ' · ' + 地串 : (大串 || 地串));
}

// 危机 —— 卡文：只写 无/低/中/高/致命 之一，「**这一刻世界有多紧张**」的刻度
//        （遭遇难度读它），**不是剧情、不是任务进度**。
// ⚠ **本轮纯文字不上色**：「危险该是什么颜色」是审美判断，归轮 1-10（口径 ⑤）。
function 格危机(世) {
  const 危 = 取(世, ['危机']);
  if (!是串(危) || !危) return 坏();
  return 好对('危机', 危);
}

/* ── 7. 「状态」页 —— 5 组 15 格（轮 1-4 新增）──────────────────────────
   全部取自 `zod_schema.js` 的 `主角`，**没有新变量**。
   取值根 ＝ `stat_data.主角`。每格自己判、自己降级；**一格坏不塌一组，一组坏不塌一页**。 */

// 一组 ＝ 一个标签 ＋ 若干格。**容器不是对象 ⇒ 整组一格「读不到」**（不逐格刷四遍"读不到"）。
function 组(标签, 容器, 造格) {
  if (容器 === null || typeof 容器 !== 'object') return { 标签, 格: [坏()] };
  try { return { 标签, 格: 造格(容器) }; }
  catch (_) { return { 标签, 格: [坏()] }; }   // 🔴 造格自己抛错也只塌这一组
}

// 三值 —— 格式照卡文 `254984` 五、2 的 `<battle_status>` 原文：`HP <x>/<y>`
// 🔴 **两个都要是数才画**：只画 `HP 88` 会让人以为上限不重要，而它恰恰是必读的一半
//    —— 依据 `D135` ③「**宁可空着，不许猜**」。
const 值对 = (三, 名) => {
  const 当前 = 取(三, [名, '当前']), 上限 = 取(三, [名, '上限']);
  if (!是数(当前) || !是数(上限)) return 坏();
  return 好对(名, 当前 + '/' + 上限);
};
const 组三值 = (主) => 组('三值', 取(主, ['三值']),
  (c) => [值对(c, 'HP'), 值对(c, 'MP'), 值对(c, 'SP')]);

// 五维 —— 🔴 **2026-09-30 补调整值副行**：卡文 `1108` 三、**六 五维**写的原文是
//        `力 12(+1) / 敏 10(0) / 体 14(+2) / 智 10(0) / 魅 11(0)` —— **调整值就在同一个格里**，
//        而前端先前只画前半截（`力 12`）⇒ 面板比卡自己的规格少一半。
//        ⚠ 走 `副` 而不是拼进值串（同 `月蚀度`）：`12 (+1)` 拼一串在 900 档那格会折行。
const 组五维 = (主) => 组('五维', 取(主, ['五维']), (c) => {
  const 调 = 取(主, ['调整值']);
  const 取调 = (k) => {
    const v = 取(调, [k]);
    return 是整(v) ? (v > 0 ? '+' : '') + v : '';
  };
  return ['力', '敏', '体', '智', '魅'].map((k) => {
    const v = 取(c, [k]);
    if (!是整(v)) return 坏();
    const 副 = 取调(k);
    return 好对(k, String(v), 副 || null);
  });
});

// 三抗 —— 卡文 `9900031` 四、「三抗性各按它的构造定，**落 0%~100%**」⇒ **带 `%`**
const 组三抗 = (主) => 组('三抗', 取(主, ['三抗']),
  (c) => ['物理', '魔法', '污染'].map((k) => (是数(取(c, [k])) ? 好对(k, 取(c, [k]) + '%') : 坏())));

// 心智 —— 🔴 `理智上限` 是**字符串枚举** `'100'|'90'|'70'|'40'`，**不是数**！
//         拿「是数字吗」判它 ⇒ 永远判不过 ⇒ 那格永远「读不到」，**还不报错**。
//         `理智稳定性` 照 `254984` 二、2 的原词（⚠ `调整值` 底下那个叫 `稳定性`，**是另一格**，别混）。
const 组心智 = (主) => 组('心智', 取(主, ['心智']), (c) => {
  const 理智 = 取(c, ['理智']), 上限 = 取(c, ['理智上限']);
  const 稳定 = 取(c, ['理智稳定性']), 人性 = 取(c, ['人性']);
  const 月蚀 = 取(c, ['月蚀度']), 阶段 = 取(c, ['月蚀度阶段']);
  return [
    (是数(理智) && 是串(上限) && 上限) ? 好对('理智', 理智 + '/' + 上限) : 坏(),
    是数(稳定) ? 好对('理智稳定性', String(稳定)) : 坏(),
    是数(人性) ? 好对('人性', String(人性)) : 坏(),
    // 🔴 **2026-09-28 改：阶段从「值串里」挪成「副行」**（驾驶员裁定「用命定」）。
    //    原文是 `好对('月蚀度', 月蚀 + '（' + 阶段 + '）')`，量出来一格要 136.09px、
    //    而 900 档那格只有 104px ⇒ 整串折行、格子高一倍、右半边三分之二全空。
    //    病根是**全角括号**：`（蚀刻）` 这 4 个字符每个都是 18px 满宽 ＝ 72px，
    //    占了 104px 格宽的 **69%** —— 而真正的数字 `66` 只占 20px。
    //    ⇒ 照命定 `.heroTitleRow`（数值上、品阶下）拆成两行后：格需 71.3px，余 33px。
    //    ⚠ 判据 `(是数(月蚀) && 是串(阶段) && 阶段)` **一个字没动** —— 这次只改呈现，
    //      不改"什么算读得出"。缺阶段仍然整格判坏，跟以前一样。
    (是数(月蚀) && 是串(阶段) && 阶段) ? 好对('月蚀度', String(月蚀), 阶段) : 坏(),
  ];
});

/* 精神类 —— 🔴 **2026-09-30 新增的第六组**（`幸运值` / `感知`，各 −100…100）。
   卡文 `9900029` 明说装备词条可写「精神类点数（理智・稳定性・人性・**感知・幸运**）」，
   而前端先前这两格**一个字都没有** ⇒ 装备能改、面板表示不了（`D83` ④ 原话）。

   ⚠ **为什么单开一组、不并进「心智」** —— 两条，第二条是本轮实测出来的：
     ① **形状**：`精神类` 在 schema 里是 `主角` 的**同级字段**，不是 `心智` 的子键
        （`心智` 自己的子键是 理智/理智稳定性/人性/月蚀度/月蚀度阶段/理智上限）；
     ② **量具**：并进「心智」后那一组变 6 格，而 `.yh-stats` 的列数是
        `repeat(var(--格数), …)` —— **格数＝列数、不换行** ⇒ 列宽从 `内86` 掉到 `内54`，
        当场报出 3 格「放不下」（`理智 需82.84` / `理智稳定性 需76.05` / `月蚀度 需65.81`）。
        拆出来之后「心智」回到 4 格 ＝ **改前的宽度，一格不差**。
   ⚠ 有符号（−100…100）⇒ 正数带 `+`，同 `写好感` / `先攻`。 */
const 组精神 = (主) => 组('精神类', 主, (c) => {
  const 精 = 取(c, ['精神类']);
  const 号 = (v) => (是整(v) ? (v > 0 ? '+' : '') + v : null);
  const 幸 = 号(取(精, ['幸运值'])), 感 = 号(取(精, ['感知']));
  return [
    幸 == null ? 坏() : 好对('幸运值', 幸),
    感 == null ? 坏() : 好对('感知', 感),
  ];
});

// 成长 —— 格式照卡文 `9900037` 七、字段化**原文**：`初次写全: 阶位 2 · 晋升进度 40% / 200%`
//        ⚠ `进度满值` **我不算**（卡文 `9900044` 五、：「`进度满值` 是**只读的**」）⇒ 直接读变量。
const 组成长 = (主) => 组('成长', 主, (c) => {
  const 阶 = 取(c, ['阶位']), 进 = 取(c, ['晋升进度']);
  const 满 = 取(c, ['进度满值']), 点 = 取(c, ['属性点']);
  return [
    是整(阶) ? 好对('阶位', String(阶)) : 坏(),
    // 上限走副行（同 `组心智` 的『月蚀度』；'% / %' 拼一串会折行）
    是数(进) && 是数(满) ? 好对('晋升进度', 进 + '%', 满 + '%') : 坏(),
    是整(点) ? 好对('属性点', String(点)) : 坏(),
  ];
});

/* ── 7.2 「攻」组（2026-09-30 加）────────────────────────────────────────
   依据 ＝ 卡文 `1108` 三、**八 攻** ＋ **九 先攻**（面板十二行里的两行）——
   前端先前这两行**一格都没画**，所以驾驶员问「mvu字段表里不是还有东西吗」。

   ⚠ **`阶级` 不在这里** —— `画主角头` / `画在场头` 的 `.yh-hero-meta` 已经画过
     `种族 · 性别 · 阶级 · 归属`，而头盒在**每一签上方**、永远看得见 ⇒
     再画一遍就是「同一屏里同一个值画两遍」（`格签卡` 那条判据）。
   ⚠ `个体浮动` 是**算式里的乘数**（`1108` 七/八 都带 `× 个体浮动`）⇒ 跟攻放一起，
     放五维里会读成"第六维"。 */
const 组攻 = (主) => {
  const 手 = 取(取(主, ['攻']), ['主手段']);
  const g = 组('攻', 主, (c) => {
    const 攻 = 取(c, ['攻']);
    const 值 = 取(攻, ['值']);
    const 先 = 取(c, ['先攻修正']), 浮 = 取(c, ['个体浮动']);
    return [
      是数(值) ? 好对('攻值', String(值)) : 坏(),
      // 先攻可能是负的（值域 −12…12）⇒ 正数带 `+`，同 `写好感`
      是整(先) ? 好对('先攻', (先 > 0 ? '+' : '') + 先) : 坏(),
      // 个体浮动恒为 1.00 时**照画** —— 它是账本的一格，不是"异常值"
      是数(浮) ? 好对('个体浮动', '×' + 浮.toFixed(2)) : 坏(),
    ];
  });
  // 🔴 **主手段走组抬头右边的副题，不走统计小格**（2026-09-30 改）——
  //    它是"这一行叫什么"（`1108` 三、**八 攻**：「**主手段名** ＝ 基准 × 倍率 × … ＝ 结果」），
  //    不是跟"攻值"并排的一格。塞进小格的实测代价：`蚀相·断纤刀` 六个汉字需 139.81px，
  //    而 900 档那一格内宽只有 86px ⇒ **压字 12px，值当场压到隔壁「攻值」的标签上**
  //    （量具原话 `压字 🔴 stat-v 蚀相·断纤刀 溢12`，实拍两串字叠成一串）。
  //    挪走之后攻组 4 格 → 3 格，`个体浮动` 那格也从「放不下 需106」回到装得下。
  if (是串(手) && 手.trim()) g.副 = 手.trim();
  return g;
};

/* ── 7.3 「质点」组（2026-09-30 加）──────────────────────────────────────
   依据 ＝ 卡文 `1108` 三、**五 质点**（乙截第一行，人 → 力的那道桥）。
   🔴 前端先前**整块没画** —— `节点` 是个字典、下面五格全是只读派生值，
      `_MVU变量字段总表.md` §2.5 有，面板上一个字都没有。

   ⚠ 这一组在**卡上只出数**（共鸣度 / 解锁进度 / 律座 / 条数）；
     节点逐条与 `已凝` 名单走**详情层的「来历」签**（那里有整幅宽度）。
     这不是"卡上少画"—— 同 `三值`：卡上一根条、详情层才是数，**两个深度两个画法**。
   `节点` 的键形如 `源质·X` / `蚀相·X`，值形如 `{档: 共鸣|凝质|登座}`。 */
const 组质点 = (主) => 组('质点', 主, (c) => {
  const 节 = 取(c, ['节点']), 已凝 = 取(c, ['已凝']);
  const 律 = 取(c, ['律座']);
  const 共 = 取(c, ['共鸣度']), 进 = 取(c, ['解锁进度']);
  const 有 = 取(律, ['有无']), 偏 = 取(律, ['偏向']);
  const 节数 = (节 && typeof 节 === 'object') ? Object.keys(节).length : 0;
  const 凝数 = Array.isArray(已凝) ? 已凝.filter((s) => 是串(s) && s.trim()).length : 0;
  const 偏数 = Array.isArray(偏) ? 偏.filter((s) => 是串(s) && s.trim()).length : 0;
  return [
    // 未立约 ＝ 0 个节点，是**合法状态**（`1108` 五：「没有就写「未立约」」）⇒ 照画 `0 个`，不判坏
    (节 && typeof 节 === 'object') ? 好对('节点', 节数 + ' 个') : 坏(),
    是数(共) ? 好对('共鸣度', String(共)) : 坏(),
    // 0~4 是 schema 封顶；副行给封顶值，同 `晋升进度`
    是数(进) ? 好对('解锁进度', 进 + '%') : 坏(),
    // 律座是**开/关 ＋ 一张偏向名单**：开关走值、条数走副行（名单本身在详情层）
    (typeof 有 === 'boolean') ? 好对('律座', 有 ? '已立' : '未立', 有 ? (偏数 + ' 向') : '') : 坏(),
    是数(凝数) ? 好对('已凝', 凝数 + ' 个') : 坏(),
  ];
});

/* ── 7.4 「状态」字典 → 统计行（2026-09-30 加）────────────────────────────
   `状态` 是 `字典(状态条目Schema)`（6 格/条：来源/剩余/检定修正/劣势/资源/抗性）。
   ⚠ **它不是统计卡** —— 条目数不定、每条的六个数都要看 ⇒ 详情层走**列表块**
     （`_分栏_内容区.js` 的 `录块`），卡上**不出**（`格详` 包着）。
     这里这枚只干一件事：把"有几条"报出来，**空字典也报 `0 条`**，不许静默留白。 */

/* ── 7.5 「在场」页 —— 名字 ＋ 好感度（轮 1-5 新增）──────────────────────
   数据根 ＝ `stat_data.角色`，**一个字典：键就是角色名**，值是那一整套角色字段。
   只取两格：键（名字）与 `好感度`。
   🔴 `关系` 那一格**本轮不画** —— §3.6 写的这页只有「名字 ＋ 好感度」（一个不多一个不少）。
   🔴 `在场` / `好感度` 的六档、颜色、间距 —— **全是审美，归轮 1-10**（本轮只到看得见）。 */

// 好感度写法 —— 🔴 正数带 `+`（卡文 `9900042` 三、5：`好感度 −12 → +8`）。
//    ⚠ 减号用 **ASCII `-`**：它要跟数字拼成一体，全角 `−` 排在数字里对不齐。
const 写好感 = (n) => (n > 0 ? '+' : '') + n;

// 名单 —— 挑出在场的人。返回 { 名: [{名, 感}], 坏: [键] }。
// 🔴 判据**只认 `'离队'` 一个串**（其余一律算在场）—— schema 里 `在场` 的默认值就是 `'在场'`，
//    字段缺了算在场，**不静默漏人**。
// 🔴 `在场` 或 `好感度` 读不出来 ⇒ 记进 `坏`（**跳过它，但页脚要报数**，不许静默留白）。
// ⚠ 名字取自 `Object.keys()`：整数-like 的键会被 V8 强制重排到最前（项目踩过这个坑）。
//    角色名是中文，正常不触发；而且下面按好感度**重排**过，这一层不影响最终顺序。
function 取在场(角) {
  const 名 = [], 坏 = [];
  for (const k of Object.keys(角)) {
    const 条 = 角[k];
    if (条 === null || typeof 条 !== 'object') { 坏.push(k); continue; }
    if (取(条, ['在场']) === '离队') continue;      // 🔴 卡文：离队是状态，不是删除理由
    const 感 = 取(条, ['好感度']);
    if (!是数(感)) { 坏.push(k); continue; }
    名.push({ 名: k, 感 });
  }
  // 好感度降序。⚠ `sort` 在 V8 里是**稳定**的 ⇒ 同分的两人保持字典序，位置可复现。
  名.sort((a, b) => b.感 - a.感);
  return { 名, 坏 };
}

// 图标元素 —— 名字给了但没画出来的，出个**空位**（留白），不出一个破图。
function 图标(名, 大) {
  const el = document.createElement('span');
  el.className = 'yh-i' + (大 ? ' yh-i-' + 大 : '');
  el.setAttribute('aria-hidden', 'true');   // 纯装饰 —— 旁边的文字已经说清了

/* ── 格子 ────────────────────────────────────────────────────────────────
   'g' ＝ '{类, 文, 签?, 值?, 长?}' —— **这三个包装函数不改数据，只加渲染记号**：
   · '格长(g)'   ⇒ 进**摘要区**（clamp 2 行，全文进详情层）
   · '格片(色, g)' ⇒ 进 **chip 行**
   · 其余 ⇒ 进**标签值行**
   ⚠ 必须包在**最外层**：这些函数都会 'Object.assign({}, g, …)' 造新对象，
     写反了（'格长(格签(…))'）记号会被后造的对象丢掉。 */
const 格长 = (g) => Object.assign({}, g, { 长: true });
const 格片 = (色, g) => Object.assign({}, g, { 片: 色 });

// 无标签的纯文本格（在场的好感度那种）
const 格文 = (文) => ({ 类: '好', 文 });

/* 🔴 只设 '签'、**绝不设 '值'** —— '装格()' 判的是 'g.签 != null && g.值 != null'，

   只设 '签' ⇒ 卡上走兜底 'textContent = g.文'，一个字不动；详情层拿得到标签。 */
const 格签 = (签, g) => Object.assign({}, g, { 签 });

// 取一格的显示文字（'值' 优先，没有就用 '文'）
const 格文2 = (g) => (g.值 != null ? g.值 : g.文);

/* 🔴 详情层专用两枚记号（2026-09-29 加）。
   起因：在场详情层先前只有名字 / 在场 / 好感度三格 —— 驾驶员原话「**像角色这种点进去
   没有任何东西**」，并指着创世回廊与命定之诗说「他们都有东西」。
   根因不在数据：`stat_data.角色.<名>` 每项 **77 格**（`_MVU变量字段总表.md` §3），
   而 `取在场` 只返回 `{名, 感}`、`画在场` 只画那三格 ⇒ **七十几格被渲染层扔了**。

   · `格轴(值)`      ⇒ 好感度刻度轴。**卡上画小档、详情层画大档**（同一棵树，CSS 换布局）。
                       卡上它落在标签值行**之后** —— `.yh-c-kv` 是两列网格，块级子树塞不进去。
   · `格详(格)`      ⇒ **只在详情层出**的格。包住普通格就照普通格画（`长` 照旧自成一签）；
                       包住 `格块` 就把一整棵 DOM 塞进去。
                       属性那一段是五张 `.yh-gcard`，不是「格」，没有 `文`/`值` 可给 ——
                       硬塞进格子系统只会压成一行字。
   · `格块(节点,签)` ⇒ `格详` 的 DOM 形态。有签 ⇒ 自成一签；无签 ⇒ 留在当前那一签的正文里。

   ⚠ `块: true` 的用处只有一个：详情层里进 `.yh-body`（整行块），而**不自成一签**。
     自成一签的判据是 `长`（长文本「一次看不完」才自己一签）；轴和属性卡是
     "一眼看得完的一片"，留在它那一签里。**两个记号分开是有意的，别合并。**
   ⚠ `组卡` 必须**跳过** `只详` 的格（卡片上画不出这些）。 */
const 格详 = (g) => Object.assign({}, g, { 只详: true });
const 格轴 = (值) => ({ 类: '轴', 值, 块: true });
const 格块 = (节点, 签) => 格详({ 类: '块', 节点, 块: true, 长: 签 != null, 签 });
/* 🔴 反过来的一枚：**只在卡片上出**的片。
   在场页那个「在场」片，详情层由头盒（`画在场头` 的身份行）负责 ——
   不标的话，详情层里 `造格` 会照画一遍，同一个词在 60px 内出现两次。
   ⚠ 这跟 `格块`（只在详情层出）是**方向相反的一对**，别把两者看成同一个东西。 */
const 格片卡 = (色, g) => Object.assign({}, g, { 片: 色, 只卡: true });

/* 只卡的**记号轨**（2026-09-30 加，主线节点树用）—— 同 `格片卡` 的理由：
   卡片上是一串 CSS 记号、详情层里是整棵树，两边画的不是同一个东西 ⇒ 记号不带进详情层。
   `造格` 不认识这一型，不挡就会掉进兜底那条 `textContent = 格文2(g)` 画成 `undefined`。 */
const 格轨 = (完, 节, 态) => ({ 类: '轨', 完, 节, 态, 只卡: true });
/* 只卡的**标签值**格（2026-09-30 加，主线 '分支' 用）—— 卡面上走标签值行，
   详情层里由节点树尾巴那个岔口画。**同一屏里同一个值画两遍**是这个面板的禁忌
   （§9C.4「一页一张图」那条判据的反面），所以两边各认一个，别都画。 */
const 格签卡 = (签, g) => Object.assign({}, g, { 签, 只卡: true });
/* 带签的**整行块**：进 `.yh-body`（值 `pre-wrap`、标签左列），但**不自成一签**。
   用在「关系」这种"一段自由文本、但短到不必单独占一签"的格子上。
   ⚠ 它**也只走详情层**（`格详` 包着）—— 「关系」在卡上是一段长度不可控的自由文本，
     落进 `.yh-c-kv` 那个两列网格会把值列挤成一条竖缝（同 `.yh-ax` 那条判据）。 */
const 格段 = (签, 文) => 格详({ 类: '好', 签, 文, 块: true });

/* ── 好感度刻度轴（2026-09-29 加）──────────────────────────────────────────
   值域 `−200…200` 是**卡文硬封**（`D71` ②「硬封，撞到两端停住」），记号位置按它算。
   🔴 **一个 DOM，两套布局** —— 小档不是"另画一根简易条"，是同一棵树换
      `grid-template-areas`（见样式表 `.yh-ax-s`）。两处永远同源 ⇒
      卡上那根与详情层那根**不可能对不上**。
   ⚠ 刻度只有五个、位置 0/25/50/75/100%，**算一遍**：JS 和 CSS 各存一半，
      迟早有一天对不上，而且对不上时两边都"看着对"。
   ⚠ 减号用 **ASCII `-`**，与 `写好感` 同口径（卡文 `9900042` 三、5 那处定的：
     全角 `−` 排在数字里对不齐）。 */
const 轴刻度 = ['-200', '-100', '0', '+100', '+200'];
function 好感轴(感, 小) {
  const 盒 = document.createElement('div');
  盒.className = 'yh-ax' + (小 ? ' yh-ax-s' : '');
  const 好 = 是数(感);

  const k = document.createElement('span');
  k.className = 'yh-ax-k';
  k.textContent = '好感度';
  盒.appendChild(k);

  const t = document.createElement('span');
  t.className = 'yh-ax-t';
  const l = document.createElement('span');
  l.className = 'yh-ax-l';
  t.appendChild(l);
  // 五条刻度。中间那条（`0`）加高 —— 它是语义铰链（左＝恶感 / 右＝好感），
  // 没有它，一枚孤零零的记号读不出自己在哪一侧。
  轴刻度.forEach((_, i) => {
    const tk = document.createElement('span');
    tk.className = 'yh-ax-tk' + (i === 2 ? ' z' : '');
    tk.style.left = (i * 25) + '%';
    t.appendChild(tk);
  });
  if (好) {
    // 记号位置夹在 0~100：模型可能写超值域 ⇒ 不夹会捅出轨道。
    // ⚠ 夹的是**记号位置**；值本身照实报原值（同 `造条` 那条口径，不粉饰数据）。
    const 百 = Math.max(0, Math.min(100, ((感 + 200) / 400) * 100));
    const m = document.createElement('span');
    m.className = 'yh-ax-m';
    m.style.left = (Math.round(百 * 10) / 10) + '%';
    t.appendChild(m);
  } else {
    // 读不到 ⇒ 轨照画、记号不画。画一枚停在 0 的记号会被读成「好感度是 0」，那是另一个意思。
    盒.classList.add('yh-ax-na');
  }
  盒.appendChild(t);

  const v = document.createElement('span');
  v.className = 'yh-ax-v';
  v.textContent = 好 ? 写好感(感) : '读不到';
  盒.appendChild(v);

  // 刻度字。小档由 CSS 藏掉，**DOM 照旧在** —— 树只有一棵，这是它只有一棵的代价。
  const n = document.createElement('div');
  n.className = 'yh-ax-n';
  轴刻度.forEach((名, i) => {
    const s = document.createElement('span');
    s.style.left = (i * 25) + '%';
    s.textContent = 名;
    n.appendChild(s);
  });
  盒.appendChild(n);
  return 盒;
}

/* ── 🔴 状态**片色表**（闭集，全页唯一一处）────────────────────────────────
   驾驶员 2026-09-28 拍：「**胶囊，且每档不同色**」。
   ⚠ 这**推翻了 1-7 方案的「不上色」** —— 但那份方案自己留了口子：
     「本轮**不上色**……美术是**轮 1-10**」，而**本轮就是 1-10** ⇒ 是照口子改，不是推翻。
   ⚠ 色记号只有四个（见样式表 `.yh-chip-*`）：'好' 绿 / '特殊' 土黄 / '坏' 红褐 / '中性' 灰。
     ⇒ 四档正好一一对应，**零新增 CSS**。
   🔴 **两个页面的「四档」不是同一套**（`zod_schema.js` 是形状真源）：
      · 主线：未启 / 进行中 / 已完成 / 已失败
      · 委托：进行中 / 已完成 / **已结算** / 已失败 ← 有「已结算」、**没有**「未启」
     ⇒ 五个词、四个色。**「未启」与「已结算」永远不会同页出现**，故共用 '中性'
       —— 任何一页上的四档**仍然是四个不同色**。
   🔴 表外落 '中性' **照画不报错** —— 同 1-6 决策③「不在表里的类型排最后、照画不报错，
     楼层面不当裁判」。 */
const 态色 = { 未启: '中性', 进行中: '好', 已完成: '特殊', 已结算: '中性', 已失败: '坏' };
const 片色 = (态) => 态色[态] || '中性';

/* ── 网格容器 ──────────────────────────────────────────────────────────── */
function 网格(子们) {
  const g = document.createElement('div');
  g.className = 'yh-grid';
  子们.forEach((x) => { if (x) g.appendChild(x); });
  return g;
}

/* ── 造一张卡 ──────────────────────────────────────────────────────────────
   '格们' ＝ [{类,文,签?,值?,长?,片?}]，**第一格是这条的名字**。
   '可点' ＝ 挂不挂详情层。判据：**这一行的信息一次看不看得完** ——
   🔴 **2026-09-28 改：在场页也挂**（驾驶员原话「**在场肯定是要挂详情层的**」）。
      原判据是「≤4 对短值就不挂」，那等于替用户判断"你不必看全"；
      卡是随机生成 ＋ RP 驱动的，**模型的字段会变**，今天两格不代表明天两格。
      ⇒ 现在只有**状态页的五组**不挂（它不是条目，是五张汇总卡，没有"某一条"可点）。
   '图名' ＝ 卡头图标（可选）。 */
function 组卡(名, 格们, 可点, 图名, 头图, 传头) {
  const el = document.createElement(可点 ? 'button' : 'div');
  if (可点) {
    el.type = 'button';                       // ⚠ 不写就是 submit 语义
    el.setAttribute('aria-haspopup', 'dialog');
    // 🔴 整卡当按钮 ⇒ 无障碍名会是整卡内容（长且跳）。给一个说人话的。
    el.setAttribute('aria-label', '打开「' + 名 + '」的详情');
  }
  el.className = 'yh-card';

  // ── 卡头：图标 ＋ 名字。**名字是卡里最重的一档**（15.5px/700，见样式表）
  const 头 = document.createElement('span');
  头.className = 'yh-c-h';
  /* 🔴 **头图优先于图名**（2026-09-28 加）——「在场」页拿它放角色头像。
     为什么是**替换**、不是"图标旁边再加一个头像"：卡头那一行只有
     `图标 ＋ 名字 ＋ 箭头` 三件，再塞一个 44px 的圆进去会把名字挤到折行。
     ⚠ 头图是**纯展示**的（`可点:false`）—— 整张卡本身是 `<button>`，
       里面放可点的东西是非法结构；上传入口在**详情层**（见 `_分栏_头像.js` 文件头）。 */
  if (头图) 头.appendChild(头图);
  else if (图名) 头.appendChild(图标(图名));
  const 名格 = document.createElement('span');
  名格.className = 'yh-c-n';
  名格.textContent = 名;                      // 🔴 textContent —— 名字是模型写的自由文本
  头.appendChild(名格);
  // 🔴 **只有可点的卡才挂这个箭头**（见 `图标源.进` 的注释）。判据就是 `可点` 本身 ——
  //    不可点的卡（现在只剩状态页那五组汇总卡）挂上它就是骗人去点，跟 `.yh-card` 那条
  //    「`button` 才给 hover 位移、`div` 不给」是同一条规矩。
  if (可点) { const 进 = 图标('进'); 进.classList.add('yh-c-go'); 头.appendChild(进); }
  el.appendChild(头);

  // ── 分拣：chip / 摘要 / 标签值 / 轴。第一格（名字）已经在卡头里了，跳过。
  //    ⚠ **`只详` 的先走** —— 它跨好几种类别（轴 / 块 / 好），搁后面会被别的分支先接走。
  const 片们 = [], 摘们 = [], 对们 = [], 轴们 = [], 轨们 = [];
  格们.forEach((g, i) => {
    if (i === 0) return;
    if (g.只详) return;                    // 详情层专用，卡片上画不出（见 `格详` 的说明）
    if (g.类 === '轴') 轴们.push(g);        // 块级子树，进不了两列的 `.yh-c-kv`
    else if (g.类 === '轨') 轨们.push(g);   // 同上 —— 记号轨也是块级子树
    else if (g.片) 片们.push(g);
    else if (g.长) 摘们.push(g);
    else 对们.push(g);
  });

  // ── chip 行
  if (片们.length) {
    const c = document.createElement('span');
    c.className = 'yh-c-chips';
    片们.forEach((g) => {
      const s = document.createElement('span');
      // '片' 是语义色名：好/坏/特殊/中性。类名走 'yh-chip-*'
      s.className = 'yh-chip' + (g.片 === '好' ? ' yh-chip-on'
        : g.片 === '坏' ? ' yh-chip-bad'
        : g.片 === '特殊' ? ' yh-chip-spec' : '');
      s.textContent = 格文2(g);
      c.appendChild(s);
    });
    el.appendChild(c);
  }

  // ── 记号轨（只卡）—— 主线走的节点串。落在 chip 行**之后**：
  //    它答的是「走到哪了」，跟 chip 答的「现在什么状态」是同一层的问题，挨着放。
  轨们.forEach((g) => {
    const r = 节点轨(g.完, g.节, g.态);
    if (r) el.appendChild(r);
  });

  // ── 摘要（可能不止一条：任务只有 '目标'，连携只有 '效果'，但结构上不假设只有一条）
  摘们.forEach((g) => {
    const s = document.createElement('span');
    s.className = 'yh-c-sum';
    s.textContent = 格文2(g);
    el.appendChild(s);
  });

  // ── 标签值行。**成对 append** —— CSS 是 'grid-template-columns: 标签列 值列'，
      // grid 自动把第 1、3、5… 个放标签列、第 2、4、6… 个放值列，
      // ⇒ **同一张卡里所有标签自动对齐成一条竖线**（列宽是整卡共享的）。
  if (对们.length) {
    const kv = document.createElement('span');
    kv.className = 'yh-c-kv';
    对们.forEach((g) => {
      const k = document.createElement('span');
      k.className = 'yh-k';
      // 没有标签的格（在场的好感度那种）⇒ 标签位**留空但占位**，值照旧对齐
      k.textContent = g.签 != null ? g.签 : '';
      const v = document.createElement('span');
      v.className = g.类 === '坏' ? 'yh-no' : g.类 === '未定' ? 'yh-d' : 'yh-v';
      v.textContent = 格文2(g);
      kv.append(k, v);
    });
    el.appendChild(kv);
  }

  // ── 好感度刻度轴（小档）—— 落在标签值行**之后**：
  //    `.yh-c-kv` 是「标签列 值列」两列网格，块级子树塞进去会把那张网格撑歪。
  轴们.forEach((g) => el.appendChild(好感轴(g.值, true)));

  // `传头` 是**函数**不是元素：详情层关着的时候不该建那一棵子树（在场页可能有十几个人）
  if (可点) el.addEventListener('click', () => 开详情(名, 格们, 传头 ? 传头() : null));
  return el;
}

/* ── 详情层 ────────────────────────────────────────────────────────────── */
// 当前打开的那一条；'null' ＝ 没开。**跨重画活着**（同 '当前页' 那套）。
let 详情 = null;
let 详情要聚焦 = false;      // 只在"刚打开"那一帧聚焦，重画不抢焦点
// 🔴 **子页签的选中位**（2026-09-28 加 · 任务 #14）。同 '详情' 一样跨重画活着。
let 详情签 = 0;
let 签要聚焦 = false;        // 点页签换节之后，焦点要落回**新选中的那一签**（不是掉到 body）

function 开详情(名, 格们, 头盒) {
  详情 = { 名, 格们, 头盒 };
  详情要聚焦 = true;
  // 🔴 **换条目 ⇒ 回到第一签** —— 照命定 `DestinyTab.tsx`：换伙伴时三处调用点都写
  //    `setActivePartnerDetailSection('overview')`。不重置的话，从「任务·目标」退出去
  //    再点开另一条，会**停在上一条的第 2 签**上，而那一签在新条目里可能是另一个字段
  //    —— 用户看到的是「我明明点的是 A，怎么显示 B 的正文」。
  详情签 = 0;
  if (最后行) 画(最后行);     // 🔴 只重画、**不重读快照**（同 '切页()'）
}
function 关详情() {
  详情 = null;
  详情签 = 0;                 // 同上：关了就该回到第一签，别把位次留给下一条
  if (最后行) 画(最后行);
}

/* 造详情层。'role="dialog"'，Esc 关、「返回」关。
   🔴 **不给 'aria-modal'** —— 它宣称"背景不可访问"，而这里页眉带与页签条**照旧是活的**
      （鼠标点得到、Tab 也走得到），列表只是被抽走。写 'aria-modal="true"' 是对屏幕阅读器
      说假话。'role="dialog"' 留着是因为它确实有标题、有关闭、Esc 收焦点 —— 那套是对的。
   🔴 **没有"点遮罩空白处关"** —— 详情层**取代**内容区，没有可点的空白。 */
function 画详情(d) {
  const ovl = document.createElement('div');
  ovl.className = 'yh-ovl';

  const sh = document.createElement('div');
  sh.className = 'yh-sheet';
  sh.setAttribute('role', 'dialog');
  sh.setAttribute('aria-label', '「' + d.名 + '」的详情');
  sh.tabIndex = -1;                          // 收 Esc 用

  const h = document.createElement('div');
  h.className = 'yh-sh-h';
  const x = document.createElement('button');
  x.type = 'button';
  x.className = 'yh-sh-x';
  // 🔴 「返回」不是「关闭」—— 详情层**取代**内容区，用户要的是"回到刚才那张列表"，
  //    而箭头给出方向。⚠ 'aria-label' 必须**包含**可见文字（WCAG 2.5.3 标签名一致）：
  //    可见是「返回」，无障碍名就必须以「返回」打头，不能只写「关闭详情」。
  // 🔴 箭头是 **SVG 图标**不是 `←` 字符（2026-09-28 改，见 `图标源.返` 的注释）：
  //    字符的笔画由字体决定，跟全套 `stroke-width: 2.1` 摆一起粗细对不上。
  //    ⚠ 图标 `aria-hidden="true"`（`图标()` 里设的），所以**文字节点必须留着** ——
  //      否则按钮就成了纯图形，无障碍名只剩 aria-label 里那个词，可见文字归零。
  x.append(图标('返'), document.createTextNode('返回'));
  x.setAttribute('aria-label', '返回列表');
  x.addEventListener('click', 关详情);
  const t = document.createElement('div');
  t.className = 'yh-sh-t';
  t.textContent = d.名;                       // 🔴 textContent —— 名字是模型写的自由文本
  h.append(x, t);

  const body = document.createElement('div');
  body.className = 'yh-sh-b';
  /* 🔴 头像（**只有「在场」页传了 `头盒`**）。
     位置在**标题之下、字段之上** —— 命定 `DetailSheet` 也是这个次序：
     先"这是谁"，再"他怎么样"。放进 `.yh-sh-b` 而不是 `.yh-sh-h`：
     标题行是 `返回 ＋ 名字` 的定高横条，塞进一张 3:4 的竖幅会把它撑歪。 */
  if (d.头盒) body.appendChild(d.头盒);
  // 🔴 字段分两类画：
  //    · **短字段**（'长' 没标的）⇒ 挤进一条横排的**胶囊带**（'.yh-meta'，flex-wrap）
  //      —— 860px 宽放四五个绰绰有余，横排才不浪费宽度；
  //    · **长字段**（'长' 标的：目标/效果/节点）⇒ **独占整行**，值 'pre-wrap' 全文出。
  //    ⚠ chip 那类在详情层里**照旧走胶囊带**（详情层不需要"再强调一次状态"，
  //      它要的是"查得到"）。
  const 元 = document.createElement('div');
  元.className = 'yh-meta';
  const 正 = document.createElement('div');
  正.className = 'yh-body';
  const 造格 = (g) => {
    // 🔴 两枚块级记号**直接还节点**，不套 `.yh-f` 那层壳：
    //    轴自带「好感度 ＋ 值」那一行，属性卡自带组抬头 —— 再套一层标签就是同一个词画两遍。
    if (g.类 === '轴') return 好感轴(g.值, false);
    if (g.类 === '块') return g.节点;
    const f = document.createElement('div');
    f.className = 'yh-f';
    if (g.签 != null) {
      const a = document.createElement('span');
      a.className = 'yh-k';
      a.textContent = g.签;
      f.appendChild(a);
    }
    const v = document.createElement('span');
    if (g.类 === '坏') v.className = 'yh-no';
    else if (g.类 === '未定') v.className = 'yh-d';
    else v.className = 'yh-v';
    v.textContent = 格文2(g);                  // 🔴 自由文本原样出，**不 clamp**
    f.appendChild(v);
    return f;
  };

  // ── 分节：短字段归「概览」，**每个长字段自成一签**（2026-09-28 · 任务 #14）──────
  //    依据 ＝ 命定 `DestinyTab.tsx` 的 `detailSections`：「概览 / 状态 / 装备 / 技能 /
  //    背包 / 资产 / 相册」—— **第一节永远是"概览"，后面每节是一类子内容**。
  //    月痕没有"多份子集合"那种数据；月痕的**长文本本身就是子内容** ⇒ 长字段一签一节。
  //    ⚠ 签题直接取该字段的**标签**（'目标' / '效果' / '当前节点'）—— 它就是用户在
  //      列表上看到的那个词。**别另起一套名字**（另起就要维护一张对照表，迟早对不上，
  //      而且模型写的字段名是自由的，对照表天生漏）。
  const 短 = [], 长 = [];
  d.格们.forEach((g, i) => {
    if (i === 0) return;                      // 第一格就是名字，标题里已经有了，别画两遍
    if (g.只卡) return;                       // 只在卡上出的片（头盒已经画过同一个词）
    (g.长 ? 长 : 短).push(g);
  });
  const 节 = [];
  if (短.length) 节.push({ 名: '概览', 格们: 短 });
  长.forEach((g) => 节.push({ 名: g.签 != null ? g.签 : '正文', 格们: [g] }));
  // 🔴 兜底：**一个字段都没有时也要有且只有一节（空的）** —— 否则 `节[0]` 是 undefined，
  //    下面 `节[详情签]` 直接抛，整块白屏。这不是防想象的问题：连携页的 '效果' 是空串就
  //    **整格不出**（见 `画连携` 那条注释），"只剩名字"的条目是造得出来的。
  if (!节.length) 节.push({ 名: '概览', 格们: [] });
  // 位次夹回合法范围（切页 / 换条目都可能把上一条的位次带过来）
  if (详情签 >= 节.length) 详情签 = 节.length - 1;
  if (详情签 < 0) 详情签 = 0;
  const 选中 = 节[详情签];

  // 🔴 **只画选中那一节** —— 同命定 `activePartnerDetailSection === 'overview' && (…)`。
  //    **不是「全画出来再 display:none 藏起来」**：藏起来的内容照样进 DOM，
  //    照样被读屏念出来、照样被 find-in-page 搜到 —— 那是"假装没在页面上"。
  选中.格们.forEach((g) => ((g.长 || g.块) ? 正 : 元).appendChild(造格(g)));
  // 空的那一组**不出**（'.yh-meta:empty' 也会撑出 gap —— 明确不 append）
  if (元.childElementCount) body.appendChild(元);
  if (正.childElementCount) body.appendChild(正);

  // ── 子页签条（'.yh-sh-nav'）─────────────────────────────────────────────
  //    ⚠ **只有一节时不画这条** —— 一个签的"页签条"没有任何可切的东西，
  //      纯粹是白占 44px（在场页那种"短字段都没有、只剩名字"的条目就是这种）。
  //      命定那边恒有 7 节所以恒画；月痕的节数是**数据决定的**，不能照抄这个恒字。
  let nav = null;
  if (节.length > 1) {
    nav = document.createElement('div');
    nav.className = 'yh-sh-nav';
    nav.setAttribute('role', 'tablist');
    nav.setAttribute('aria-label', '详情分节');
    节.forEach((s, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.id = 'yh-sht-' + i;
      b.className = 'yh-sh-tab' + (i === 详情签 ? ' yh-sh-tab-on' : '');
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', i === 详情签 ? 'true' : 'false');
      b.setAttribute('aria-controls', 'yh-shp');
      b.textContent = s.名;
      b.addEventListener('click', () => {
        if (i === 详情签) return;
        详情签 = i;
        // 🔴 重画会把整层换掉 ⇒ 焦点会掉到 <body>。**点页签的人焦点必须落回新选中的那一签**
        //    —— 否则键盘用户点一下就"失踪"了（同 `切页()` 那条「键盘够得着」的教训）。
        签要聚焦 = true;
        if (最后行) 画(最后行);
      });
      nav.appendChild(b);
    });
    body.id = 'yh-shp';
    body.setAttribute('role', 'tabpanel');
    body.setAttribute('aria-labelledby', 'yh-sht-' + 详情签);
    body.tabIndex = 0;                        // tabpanel 可聚焦（读屏的"下一个"落点）
  }

  sh.append(h);
  if (nav) sh.appendChild(nav);
  sh.appendChild(body);
  sh.addEventListener('keydown', (e) => { if (e.key === 'Escape') 关详情(); });
  ovl.appendChild(sh);
  return ovl;
}

/* ══ 各页 ══════════════════════════════════════════════════════════════════ */

/* ── 名录块（2026-09-30 加）──────────────────────────────────────────────
   **字典型容器**（技能 / 装备 / 背包 / 特质 / 节点 / 状态）在详情层里的画法：
   一条一目，目里"名称"在上、其余字段是下面一行「标签 值」对。

   🔴 **为什么不复用 `.yh-stats`**：那套统计小格的列数是**开卡时按格数现推的**
     （`--格数`），前提是"这一组的格数固定"（三值恒 3、五维恒 5）。
     字典的**条目数不定、每条的字段数也不定**（技能 14 格、装备 17 格、背包 4 格），
     铺成网格就是一片砖，而且列数会随数据抖动。
   🔴 **空字典照画**：抬头右边报 `无`＋计数，**不许静默留白**（口径④：
     留白分不清「没设」和「坏了」）。
   ⚠ 名称取 `Object.keys()`。整数-like 的键会被 V8 强制重排到最前（项目踩过），
     技能/装备名是中文，正常不触发；**不额外排序** —— 插入顺序就是模型写下的顺序，
     替它排序等于替它决定什么重要。 */
function 录块(签, 图名, 行们, 空文) {
  const b = document.createElement('div');
  b.className = 'yh-rec';
  const h = document.createElement('div');
  h.className = 'yh-rec-h';
  if (图名) h.appendChild(图标(图名, 16));
  const hn = document.createElement('span');
  hn.className = 'yh-rec-hn';
  hn.textContent = 签;
  const hc = document.createElement('span');
  hc.className = 'yh-rec-hc';
  hc.textContent = 行们.length ? 行们.length + ' 条' : 空文;
  h.append(hn, hc);
  b.appendChild(h);
  if (!行们.length) return b;
  const ul = document.createElement('ul');
  ul.className = 'yh-rec-l';
  for (const r of 行们) {
    const li = document.createElement('li');
    li.className = 'yh-rec-i';
    const n = document.createElement('div');
    n.className = 'yh-rec-n';
    n.textContent = r.名;
    li.appendChild(n);
    if (r.对们 && r.对们.length) {
      const dl = document.createElement('div');
      dl.className = 'yh-rec-d';
      for (const p of r.对们) {
        const s = document.createElement('span');
        s.className = 'yh-rec-p';
        const kk = document.createElement('span');
        kk.className = 'yh-rec-k';
        kk.textContent = p[0];
        const vv = document.createElement('span');
        vv.className = 'yh-rec-v';
        vv.textContent = p[1];
        s.append(kk, vv);
        dl.appendChild(s);
      }
      li.appendChild(dl);
    }
    ul.appendChild(li);
  }
  b.appendChild(ul);
  return b;
}

/* 字典 → 行们。`造对(条)` 回一张 `[签, 值]` 表；`过滤(条)` 不要的条目直接跳过。
   ⚠ 非对象的条目**跳过**（模型可能把一整本写成字符串）—— 跳过会被页脚报数吗？
     不会，这一层没有页脚。⇒ 所以条数用**真进列表的条数**算，不是 `Object.keys().length`。 */
function 字典行(典, 造对, 过滤) {
  const 出 = [];
  if (!典 || typeof 典 !== 'object') return 出;
  for (const 名 of Object.keys(典)) {
    const 条 = 典[名];
    if (!条 || typeof 条 !== 'object') continue;
    if (过滤 && !过滤(条)) continue;
    出.push({ 名: String(名).trim() || '（无名）', 对们: 造对(条) });
  }
  return 出;
}

/* 一串短字段 → 一张 `[签, 值]` 表。空串 / 非串 / 占位词（`无`）**都不进**。
   ⚠ `无` 是 schema 的默认值（战技.名称 / 子词条 / 消耗 都是 `串('无')`），
     它跟"没写"是同一个意思 ⇒ 不画。这不是筛数据，是**不把默认值当内容报**。 */
const 占位 = (s) => !s || s === '无' || s === '未定' || s === '—';
function 短字段(条, 键们) {
  const 对 = [];
  for (const k of 键们) {
    const v = 取(条, [k]);
    const s = (是串(v) ? v : (是数(v) ? String(v) : '')).trim();
    if (!占位(s)) 对.push([k, s]);
  }
  return 对;
}

/* 装备条目（17 格）→ `[签, 值]` 表。字段名照 `zod_schema.js` 的 `装备条目Schema`。
   ⚠ `状态` **不在这里出** —— 相貌签只收 `在装`、持有签两份都收，
     两边各自知道自己在画哪一档 ⇒ 再画一行「状态 在装」是废话。
   ⚠ `数量 === 1` 不画 —— schema 默认值就是 1，画出来满屏「数量 1」。 */
function 装备对(v) {
  const 对 = [];
  const 类 = 取(v, ['类型']), 位 = 取(v, ['部位']);
  const 名 = [是串(类) ? 类.trim() : '', 是串(位) ? 位.trim() : ''].filter(Boolean).join(' · ');
  if (名) 对.push(['类型', 名]);
  const 型 = 取(v, ['型级']), 炼 = 取(v, ['精炼']);
  if (是串(型) && 型.trim()) 对.push(['型级', 型.trim() + (是整(炼) && 炼 > 0 ? ' +' + 炼 : '')]);
  const 数 = 取(v, ['数量']);
  if (是整(数) && 数 !== 1) 对.push(['数量', String(数)]);
  const 战 = 取(v, ['战技']);
  const 战名 = 取(战, ['名称']);
  if (是串(战名) && !占位(战名.trim())) {
    const 修 = 取(战, ['精炼修正']);
    对.push(['战技', 战名.trim() + (是整(修) && 修 > 0 ? ' +' + 修 : '')]);
  }
  const 质 = 取(v, ['象征质点']);
  if (Array.isArray(质)) {
    const s = 质.filter((x) => 是串(x) && x.trim()).map((x) => x.trim()).join(' / ');
    if (s) 对.push(['象征质点', s]);
  }
  对.push(...短字段(v, ['子词条', '消耗']));
  // 属性词条：数组，每条 `{入口, 极性, 写法, 值}` ⇒ 拼成「常驻 检定修正 +2」
  const 词 = 取(v, ['属性词条']);
  if (Array.isArray(词) && 词.length) {
    const 串们 = 词.map((w) => {
      const a = 取(w, ['入口']), b = 取(w, ['写法']), c = 取(w, ['值']);
      const 极 = 取(w, ['极性']);
      return [是串(a) ? a : '', 是串(b) ? b : '', (是串(c) || 是数(c)) ? String(c) : '']
        .filter(Boolean).join(' ') + (是串(极) ? '（' + 极 + '）' : '');
    }).filter((s) => s.trim());
    if (串们.length) 对.push(['属性词条', 串们.join('；')]);
  }
  return 对;
}

/* 技能条目（14 格）→ `[签, 值]` 表。`封顶` / `倍率` / `归属` 是**只读派生**，
   照旧画 —— 账本不筛（`D83`：面板要能跟装备词条对得上）。
   ⚠ `消耗` 是一整格卡文原样（`"[主动作: 39 MP]"`），**不拆不裁**。 */
function 技能对(v) {
  const 对 = [];
  const 类 = 取(v, ['类型']), 属 = 取(v, ['归属']);
  const 名 = [是串(类) ? 类.trim() : '', 是串(属) ? 属.trim() : ''].filter(Boolean).join(' · ');
  if (名 && 名 !== '主动 · 无源系') 对.push(['类型', 名]);
  const lv = 取(v, ['Lv']), 熟 = 取(v, ['熟练度']), 顶 = 取(v, ['封顶']);
  if (是整(lv)) {
    // 熟练度带出「/封顶」—— `封顶` 是只读的 `'3'|'5'|'6'`（字符串枚举，别当数）
    对.push(['Lv', String(lv) + (是数(熟) ? ' · ' + 熟 + '%' : '') + (是串(顶) && 顶 ? ' / ' + 顶 : '')]);
  }
  const 冷 = 取(v, ['冷却']), 计 = 取(v, ['冷却计数']);
  if (是整(冷) && 冷 > 0) 对.push(['冷却', String(计) + ' / ' + String(冷)]);
  const 倍 = 取(v, ['倍率']);
  if (是数(倍) && 倍 !== 1) 对.push(['倍率', String(倍)]);
  对.push(...短字段(v, ['关联属性', '目标类型', '核心功能', '触发', '消耗']));
  const 质 = 取(v, ['象征质点']);
  if (Array.isArray(质)) {
    const s = 质.filter((x) => 是串(x) && x.trim()).map((x) => x.trim()).join(' / ');
    if (s) 对.push(['象征质点', s]);
  }
  return 对;
}

/* ── 四个签的正文（2026-09-30 加）──────────────────────────────────────
   每一支回一个**节点数组**；`节()` 把它包成一个只详的块级格。
   ⚠ 每一支的第一项恒是那段散文（没有就跳过），同伴跟在后面 ——
     **散文是这个签的主角，同伴是它的旁证**，次序不能倒。 */
const 散文 = (文) => {
  const d = document.createElement('div');
  d.className = 'yh-prose';
  d.textContent = 文;
  return d;
};

// 行二 · 相貌 ＝ 散文 ＋ 在装装备（行二自己写的「外貌与着装…穿什么」）
function 相貌节(条) {
  const 子 = [];
  const s = (是串(取(条, ['相貌'])) ? 取(条, ['相貌']).trim() : '');
  if (s) 子.push(散文(s));
  // `状态` 三选一里只有 `在装` 是"穿在身上"（`在包` 属于行十二·持有）⇒ 这里只要 `在装`
  const 在装 = 字典行(取(条, ['装备']), 装备对, (v) => 取(v, ['状态']) === '在装');
  子.push(录块('着装', null, 在装, '无'));
  return 子;
}

// 行三 · 来历 ＝ 散文 ＋ 质点（行五：他力量的来处）
function 来历节(条) {
  const 子 = [];
  const s = (是串(取(条, ['来历'])) ? 取(条, ['来历']).trim() : '');
  if (s) 子.push(散文(s));
  // 节点条目的键形如 `源质·X` / `蚀相·X`（`_MVU变量字段总表.md` §2.5），值只有一格 `档`
  const 行们 = 字典行(取(条, ['节点']), (v) => 短字段(v, ['档']));
  // `已凝` 是一张**只读派生**的名单（凝到登座的节点名）⇒ 拿它给对应的那几行标一下，
  // **不另算一格**（`组质点` 已经在卡上报了条数）。
  const 已凝 = Array.isArray(取(条, ['已凝'])) ? 取(条, ['已凝']).filter((x) => 是串(x) && x.trim()) : [];
  const 已集 = new Set(已凝.map((x) => x.trim()));
  for (const r of 行们) {
    if (已集.has(r.名)) r.对们.push(['已凝', '是']);
  }
  const 律 = 取(条, ['律座']);
  const 偏 = 取(律, ['偏向']);
  const 偏们 = Array.isArray(偏) ? 偏.filter((x) => 是串(x) && x.trim()) : [];
  const 有律 = 取(律, ['有无']);
  const 共 = 取(条, ['共鸣度']), 进 = 取(条, ['解锁进度']);
  // 桩：质点那一节的"数"（律座 / 共鸣度 / 解锁进度）走一行小字，逐条节点走名录
  const 数行 = [];
  if (typeof 有律 === 'boolean') 数行.push(['律座', 有律 ? (偏们.length ? '已立 · ' + 偏们.join(' / ') : '已立') : '未立']);
  if (是数(共)) 数行.push(['共鸣度', String(共)]);
  if (是数(进)) 数行.push(['解锁进度', 进 + '%']);
  if (已凝.length) 数行.push(['已凝', 已凝.join(' / ')]);
  const 壳 = document.createElement('div');
  壳.className = 'yh-tabsec';
  壳.appendChild(录块('质点', '质', 行们, '未立约'));
  if (数行.length) {
    const d = document.createElement('div');
    d.className = 'yh-tabkv';
    for (const p of 数行) {
      const s2 = document.createElement('span');
      s2.className = 'yh-rec-p';
      const kk = document.createElement('span');
      kk.className = 'yh-rec-k';
      kk.textContent = p[0];
      const vv = document.createElement('span');
      vv.className = 'yh-rec-v';
      vv.textContent = p[1];
      s2.append(kk, vv);
      d.appendChild(s2);
    }
    壳.appendChild(d);
  }
  子.push(壳);
  return 子;
}

// 行四 · 性格 ＝ 散文 ＋ 性格码 ＋ 特质（行十三）
function 性格节(条) {
  const 子 = [];
  const s = (是串(取(条, ['性格'])) ? 取(条, ['性格']).trim() : '');
  if (s) 子.push(散文(s));
  const 码 = 取(条, ['性格码']);
  if (是串(码) && 码.trim()) {
    const d = document.createElement('div');
    d.className = 'yh-tabkv';
    const p = document.createElement('span');
    p.className = 'yh-rec-p';
    const kk = document.createElement('span');
    kk.className = 'yh-rec-k';
    kk.textContent = '性格码';
    const vv = document.createElement('span');
    vv.className = 'yh-rec-v';
    vv.textContent = 码.trim();
    p.append(kk, vv);
    d.appendChild(p);
    子.push(d);
  }
  子.push(录块('特质', '叶', 字典行(取(条, ['特质']), (v) => 短字段(v, ['标签', '描述'])), '无'));
  return 子;
}

/* 只详的**整签块** —— `子们` 为空 ⇒ **回空数组**（这一签不出）。
   ⚠ 为什么不是"总是出"：`段()` 原来的判据就是"散文非空才出这一签"，
     保留它 —— 一个连散文带同伴都没有的签，是一片空壳。
   🔴 **回的是数组（0 或 1 个格），不是节点** —— 调用处写 `...节(...)`（展开）。
     下面的 `持有节` 回的是**节点**、调用处直接 `格块(持有节(条), '持有')`，
     两者形状不同是**故意的**：持有那一签恒出（空手也是信息），其余三签按内容出。 */
function 节(签, 子们) {
  const 实 = 子们.filter(Boolean);
  if (!实.length) return [];
  return [格块(包签(实), 签)];
}
/* 把一片子节点裹成一个「一签的盒子」。`格块()` 的 `节点` 必须是**一个 Node** ——
   🔴 2026-09-30 踩过：`持有节` 原来回的是数组，直接喂给 `格块()` ⇒
     `造格` 里 `正.appendChild(数组)` 抛 TypeError ⇒ `画()` 半路中断 ⇒
     **整个详情层没挂上**（量具报「焦点跑到 BODY」，那不是读数错，是元素真没了）。
     量具当时报 `选中 undefined · 正文块 —` —— **它是对的，我错了**。 */
function 包签(子们) {
  const d = document.createElement('div');
  d.className = 'yh-tabbox';
  for (const x of 子们) d.appendChild(x);
  return d;
}

// 行十二 · 持有 ＝ 技能 / 装备 / 背包 ＋ 金钱。**恒出**（空手本身是信息）。
function 持有节(条) {
  return 包签([
    录块('技能', '卷', 字典行(取(条, ['技能']), 技能对), '无'),
    录块('装备', '盾', 字典行(取(条, ['装备']), 装备对), '无'),
    录块('背包', '空态', 字典行(取(条, ['背包']), (v) => 短字段(v, ['数量', '型级', '类别', '备注'])), '无'),
    // 🔴 `金钱` 只有 `主角` 有（`角色条目Schema` 是 `主角本体.omit({金钱:true})` 派生）
    //    ⇒ 取不到就**整节不出**，不是"读不到"。这是形状差异，不是故障。
    (取(条, ['金钱']) && typeof 取(条, ['金钱']) === 'object')
      ? 录块('金钱', null, [{ 名: '持有', 对们: 短字段(取(条, ['金钱']), ['现金', '资产总值']) }], '无')
      : null,
  ].filter(Boolean));
}

// 7.5 「在场」页 —— 名字 ＋ 好感度。
// 🔴 **2026-09-28 改：这一页也挂详情层**（驾驶员原话：「**在场肯定是要挂详情层的**」）。
//    原判据是「两格，点开还是这两格（清一色短值，没有"一次看不完"的问题）」——
//    **那条判据本身就是错的**：它等于替用户判断"你不必看全"。
//    卡是**随机生成 ＋ RP 驱动**的，模型的字段会变，今天两格不代表明天两格；
//    而且"在场"这一页恰恰是最想点开看某个人详情的（好感度怎么来的、现在在干什么）。
//    ⇒ 现在**只有状态页那五组汇总卡不挂**（它不是条目，是五张汇总卡，没有"某一条"可点）。
/* ══ 头像引擎（2026-09-28 加）═══════════════════════════════════════════════
   🔴 **这一块治的是什么**：驾驶员问过一句「**你给主角，给头像留下来余地没有？**」
     当时的实况是——**一点余地都没有**：`画状态()` 的第一个元素是三值卡，
     全页没有主角的名字、没有称号、没有相貌，**更没有图片字段**。
     我核过卡里的 `[InitVar]变量初始值`（uid 9900047）：`主角` 底下
     `全名 / 称号 / 性别 / 种族 / 归属 / 身份[] / 职业[] / 性格码 / 相貌 /
     来历 / 性格 / 阶级 / 阶位 …` **一个都没画**，而**没有任何图片字段**。
     ⇒ 图片只能从**卡外面**进来，这就是上传功能存在的唯一理由。

   🔴 **三条头像来源，按优先级叠（同一条链，不是三个分支）**：
     ① **玩家自己传的**（存本地，见下）—— 覆盖一切
     ② **ST 人格头像**（`.user-avatar`）—— **只给主角**，零代码，见 `头挂人格`
     ③ **首字圆**（名字第一个字）—— 永远在**最底层**，上面两层没东西时露出来
     ⚠ 三层是**叠在一起的三个 DOM 层**，不是 if/else 选一个画。这样任何一层
       加载失败/不存在，**下面的自动露出来**，不需要 JS 去"判断该画哪层"。
     ⚠ ② **只给主角**：在场页那些是 NPC，套玩家的人格头像 ＝ 每个 NPC 都长玩家的脸。

   🔴 **主角这一格没有「粘链接」这个入口**（2026-09-28 撤。驾驶员原话
     「**让你主角用网站链了吗**」）—— 主角只认**酒馆人格头像 ＋ 本地图**两条，
     理由和参照卡（`组件库/道渊`）出处写在 `头开面板` 里 `是主角` 那一段。

   🔴 **还有一个入口没做 ＝ 图床**（预设头像池）。驾驶员 2026-09-28 明确它只要
     「**预留位置**」⇒ **位置留在 `头开面板` 末尾那一行注释里，代码不实现**。
     ⚠ 它是**取图的一个入口**（点一张预设图 ⇒ 存那个网址 ⇒ 走 `头存链`），
       **不是第四层** —— 不进 `头存` 那条压缩/配额链，别把它当成一层往上叠。
     ⚠ 图床在规划里是「未定」（`扩展规划.md` §1.11 / §8），定了才做。

   🔴 **成法来源 ＝ 创世回廊**（`组件库/创世回廊/modules/regex-set/assets/parts/
     07_正文美化.script.js`，读了 240-299 与 420-549 两段）。它那套
     「选图 → 压 → 配额 → 存 → 回落」是**有成品背书的**，我不另发明一套：
       · 5MB 选图上限 / 480KB 单张目标 / 4MB 总量 / 最长边 1024 / 最短边 256
       · 质量梯 [0.98, 0.95, 0.92, 0.88, 0.84, 0.8]，一档不够就缩 0.85 再来一轮
       · **精确估字节**（不是 `length * 0.75` 那种粗估 —— 那样要么白压要么超）
     ⚠ **不照抄的部分**：它的键按"角色名"直接拼，月痕要区分**主角 / 在场角色**，
       而且它没有"移除"入口 ⇒ 键结构我自己定（见 `头钥匙`）。

   🔴 **嵌套按钮这个坑（设计被它逼着改过一次，先说清楚）**：
     「在场」页每张卡**本身就是一个 `<button>`**（`组卡(…, true, …)` ⇒ 整卡可点、
     触摸目标大、键盘可达）。HTML 的 content model **禁止 `<button>` 里有可交互后代**
     —— 往卡里塞一个 `<button>` 头像是**非法结构**：读屏会把「按钮里还有个按钮」
     念出来，而且外层按钮的语义会被内层吃掉一块。
     ⇒ 分工改成：
       · **卡里**放一个**纯展示**的圆头像（`<span>`，不可点）—— 让人**看得见**
         "这个人有没有立绘"；
       · **上传入口**放**详情层**（点卡进去）—— 那儿有整幅宽度，立绘能画大，
         而且详情层本来就是一个独立视图，不存在嵌套问题。
     ⇒ `头画()` 因此有 `可点` 这一档；`可点:false` 时**不建按钮、不挂事件、
       连上传角标都不画**（画了就是一个骗人去点的东西）。 */

// ── 1. 常量（值照创世回廊，来源见文件头）──────────────────────────────────
const 头键前缀 = 'yh_av_v1|';                 // 三层存储里唯一一处命名，改就改这儿
const 头选图上限 = 5 * 1024 * 1024;           // 选图阶段先拦一道，避免白读一张 20MB 的
const 头总配额 = 4 * 1024 * 1024;             // 全部头像合计（含所有 NPC）
const 头质量梯 = [0.98, 0.95, 0.92, 0.88, 0.84, 0.8];

/* 两档压缩参数 —— **立绘要清楚、小圆点不要**。
   ⚠ 不给 NPC 用立绘那档：在场页可能有十几个角色，每个 480KB 会当场撑爆 4MB。
   档 = { 最长边, 目标 }，`头压()` 按它压。 */
const 头档立绘 = { 最长边: 1024, 目标: 480 * 1024 };
const 头档小圆 = { 最长边: 320, 目标: 110 * 1024 };

// ── 2. 仓库（三层回退，见文件头）─────────────────────────────────────────
const 头内存 = {};        // 第三层：内存兜底。⚠ 刷新即失，`头临时` 会把它标出来
let 头临时 = false;       // true ⇒ 当前用的是内存层，UI 必须说出来

function 头探仓() {
  // 🔴 探路要**先写一次再删**：有的实现 `localStorage` 拿得到、`setItem` 才抛
  //    （配额满 / 隐私模式）。只判 `!!window.localStorage` 会把这种当成功。
  const 试 = [];
  try { if (window.parent && window.parent !== window && window.parent.localStorage) 试.push(window.parent.localStorage); } catch (_) { /* 跨源会抛，属正常 */ }
  try { if (window.localStorage) 试.push(window.localStorage); } catch (_) { /* 同上 */ }
  for (const 仓 of 试) {
    try { const k = '__yh_探'; 仓.setItem(k, '1'); 仓.removeItem(k); return 仓; } catch (_) { /* 换下一个 */ }
  }
  return null;
}
const 头仓 = 头探仓();
头临时 = 头仓 === null;

const 头钥匙 = (名) => 头键前缀 + 名;

function 头读(名) {
  const k = 头钥匙(名);
  if (头仓) { try { return 头仓.getItem(k) || ''; } catch (_) { /* 读也可能抛 */ } }
  return 头内存[k] || '';
}
function 头存(名, 值) {
  const k = 头钥匙(名);
  if (头仓) {
    try { 头仓.setItem(k, 值); return true; } catch (_) { return false; }   // 配额满 ⇒ false
  }
  头内存[k] = 值; return true;
}
function 头删(名) {
  const k = 头钥匙(名);
  if (头仓) { try { 头仓.removeItem(k); } catch (_) { /* 删不掉不拦着 */ } }
  delete 头内存[k];
}

// ── 3. 字节估算 —— 照抄创世回廊 `estimateDataUrlBytes` ────────────────────
/* 🔴 为什么不用 `len * 3 / 4`：base64 的 `=` 补位**不算数据**，粗估会偏大，
   于是明明塞得下的图被当成塞不下、白压一轮。它这份把补位减掉了，是准的。 */
function 头估(串) {
  if (typeof 串 !== 'string') return 0;
  const 逗 = 串.indexOf(',');
  if (逗 < 0) return 0;
  const b64 = 串.slice(逗 + 1);
  const 补 = (b64.match(/=+$/) || [''])[0].length;
  return Math.floor((b64.length * 3) / 4) - 补;
}
function 头可读(n) {
  if (!(n >= 0)) return '0 B';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
  return (n / 1024 / 1024).toFixed(2) + ' MB';
}
// 已用字节 —— **按真值累加**，不拿 `JSON.stringify` 估（估出来和浏览器算的不是一个数）
function 头已用() {
  let 和 = 0;
  if (头仓) {
    try {
      for (let i = 0; i < 头仓.length; i++) {
        const k = 头仓.key(i);
        if (k && k.indexOf(头键前缀) === 0) 和 += 头估(头仓.getItem(k) || '');
      }
    } catch (_) { /* 遍历失败 ⇒ 报 0，不报假数 */ }
  } else {
    for (const k in 头内存) 和 += 头估(头内存[k] || '');
  }
  return 和;
}

// ── 4. 压缩 —— 照抄创世回廊 `encodeAvatarDataUrl`，只把两个常量变成入参 ────
/* 🔴 为什么必须压：手机拍一张就是 4~8MB，`readAsDataURL` 之后还要 ×1.37
   （base64 膨胀），塞进 4MB 的仓里必炸。压完通常 80~300KB。
   ⚠ 返回 `''` ＝ **压不出来**（canvas 被污染 / 拿不到 2d 上下文），
     调用方必须**当成失败报出来**，不许当成"没头像"静默回落。 */
function 头压(图, 档) {
  const 源长 = Math.max(图.width, 图.height);
  if (!(源长 > 0)) return '';
  let 比 = 源长 > 档.最长边 ? 档.最长边 / 源长 : 1;
  let 保底 = '';
  // 每一轮缩一档；缩到 320 以下就停（再小就糊成马赛克，不如不压）
  while (比 > 0) {
    const w = Math.max(1, Math.round(图.width * 比));
    const h = Math.max(1, Math.round(图.height * 比));
    const 布 = document.createElement('canvas');
    布.width = w; 布.height = h;
    const 笔 = 布.getContext('2d');
    if (!笔) break;
    笔.imageSmoothingEnabled = true;
    笔.imageSmoothingQuality = 'high';
    笔.drawImage(图, 0, 0, w, h);
    let 本档最好 = '';
    for (const q of 头质量梯) {
      const 试 = 布.toDataURL('image/webp', q);
      本档最好 = 试;
      if (头估(试) <= 档.目标) return 试;
    }
    保底 = 本档最好;
    if (Math.max(w, h) <= 320) break;
    比 *= 0.85;
  }
  return 保底;
}

// ── 5. 首字圆（第 ③ 层，永远在底下）─────────────────────────────────────
/* ⚠ 取**第一个字**用 `Array.from` 而不是 `[0]` —— 名字里可能有 emoji 或
   星平面字（`𠮷` 在 UTF-16 里是两个码元），`[0]` 会切出半个字，显示成一个 `�`。 */
function 头首字(名) {
  const s = String(名 == null ? '' : 名).trim();
  if (!s) return '?';
  return Array.from(s)[0];
}

// ── 6. 画一个头像 ────────────────────────────────────────────────────────
/* `头画(名, 形, 选项)`：
     名   —— 存储键用的名字（主角固定 '主角'，NPC 用角色名）
     形   —— '立绘'（3:4 竖幅，主角头/详情层）| '圆'（小圆点，在场页卡里）
     选项 —— { 人格: 挂不挂 `.user-avatar`（**只给主角 true**）
               可点: 建不建上传入口（false ⇒ 纯展示，见文件头"嵌套按钮"那段） }
   返回的**外壳** `.yh-av-w`（`position: relative`）：
     .yh-av-w
       button.yh-av | span.yh-av      ← 可点 / 纯展示
         .yh-av-t    首字（③ 底）
         .yh-av-g    `.user-avatar` 人格层（②，可能被摘掉）
         img.yh-av-i 上传层（①，可能不存在）
         .yh-av-e    上传角标（只有可点才画）
       .yh-av-pop                      ← 面板，**与按钮平级、不在按钮里**（同上）
   🔴 返回**外壳**不是按钮：调用方要拿它挂进 DOM，而面板必须是按钮的**兄弟**。 */
function 头画(名, 形, 选项) {
  const o = 选项 || {};
  const 可点 = o.可点 !== false;
  const 立 = 形 === '立绘' ? 'p' : 'c';

  const 壳 = document.createElement('span');
  壳.className = 'yh-av-w yh-av-w-' + 立;

  const 盒 = document.createElement(可点 ? 'button' : 'span');
  if (可点) 盒.type = 'button';
  盒.className = 'yh-av yh-av-' + 立;
  if (可点) 盒.setAttribute('aria-label', '设置「' + 名 + '」的头像');

  const 首 = document.createElement('span');
  首.className = 'yh-av-t';
  首.setAttribute('aria-hidden', 'true');
  首.textContent = 头首字(名);
  盒.appendChild(首);

  if (o.人格) {
    const 人 = document.createElement('span');
    人.className = 'yh-av-g user-avatar';   // 🔴 TH 的注入 CSS 认这个类名
    盒.appendChild(人);
  }

  const 值 = 头读(名);
  if (值) {
    const 图 = document.createElement('img');
    图.className = 'yh-av-i';
    图.alt = '';                             // 名字就在旁边，再念一遍是噪音
    图.decoding = 'async';
    图.src = 值;
    盒.appendChild(图);
  }

  if (可点) {
    const 角 = document.createElement('span');
    角.className = 'yh-av-e';
    角.setAttribute('aria-hidden', 'true');
    角.appendChild(图标('摄', 12));
    盒.appendChild(角);
  }

  壳.appendChild(盒);
  if (可点) 头挂传(壳, 盒, 名, 形 === '立绘' ? 头档立绘 : 头档小圆, !!o.人格);
  return 壳;
}

/* ── 6b. 第 ② 层的可用性探测 ───────────────────────────────────────────────
   🔴 **为什么不能直接信任 `.user-avatar`**：TH 往 iframe 的 `<head>` 里注入的是
        .user_avatar,.user-avatar{background-image:url('./User Avatars/<file>')}
      —— 只有 `background-image`，**没有 size / position**，也没保证那张图真的在。
      ST 里每个用户都有一张人格图（没设过就是默认剪影），所以这一层**大概率会亮**，
      而"亮出来是默认剪影"和"亮出来是玩家设的立绘"在 CSS 层面**长得一样**。
   ⇒ 只在**真能取到一个 User Avatars 链接**时才认这一层；取不到、或图打不开，
     就把这一层**摘掉**，让第 ③ 层的首字露出来
     （首字至少是**这张卡自己的数据**，不会拿一张陌生人的剪影骗人）。
   ⚠ 用 `getComputedStyle` 读**计算后**的值，不是读 `style` 属性 —— 注入的 CSS
     在样式表里，元素自身的 `style` 上什么都没有，读 `style` 会永远读到空。 */
function 头挂人格(盒) {
  const 层 = 盒.querySelector('.yh-av-g');
  if (!层) return;
  let 链 = '';
  try { 链 = String(getComputedStyle(层).backgroundImage || ''); } catch (_) { 链 = ''; }
  const m = /^url\(["']?(.+?)["']?\)$/.exec(链.trim());
