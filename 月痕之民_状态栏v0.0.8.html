     ⇒ 结论：**空场要填，不是把容器缩小**（我一度想出的「④窄幅 620px」方向是错的，已撤）。

     🔴 `min-width: max-content`（命定写的是 `min-width: 0`）—— 这一处**不照抄**：
        月痕页签是中文两字，中文**任意两字之间都能断行**，`min-width: 0` 会让字被压成两行。
        `max-content` 按"不折行"算最小宽 ⇒ 真挤不下时**整签折到下一行**（容器本来就是
        `flex-wrap: wrap`），而不是压扁。守的是本卡那条「宁可整格折行，不许压字」。
     📐 实测三档（同一条试验 CSS 注入前后）：900 空 506.5 → **0**；390 空 79.8 → **0**；
        320 空 13.2 → **0**（每签 45.8px，两字 24.15px ＋ 内边距 10px 放得下）。 */
  flex: 1 1 0;
  min-width: max-content;
  /* 🔴 **图标 ＋ 文字横排居中**（2026-09-27 加页签图标时补）。命定 `.item` 原文就是
     `display: inline-flex; align-items: center; justify-content: center; gap: 6px`。
     ⚠ `text-align: center` **留着不删** —— 万一某个页签在 `签图标源` 里没有对应的键，
       `签图()` 出来的是个空 span，此时只剩文字节点，靠它仍然居中、不会退成左对齐。 */
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  text-align: center;
  font: inherit;
  font-size: var(--fs-1);
  line-height: 1.5;
  letter-spacing: .05em;
  /* 🔴 **不留字距补偿**（左右内边距对称）。
     原先写的是 `padding-right: calc(10px - .05em)`，理由是"`letter-spacing` 在末字之后
     也加一格，居中时会推歪"。**那个理由是错的** —— 实测（`.tokenicode\tmp\_拍签带.mjs`，
     把左右内边距改成对称再量一次）：
       对称内边距 ⇒ 墨迹居中偏移 **0**；加了那笔补偿 ⇒ 偏移 **+0.29px**（正=偏右）。
     Chrome 的 `text-align: center` **不把末尾字距算进居中宽度**，所以补偿是净增误差。
     结论：**居中排用对称内边距，补偿只在左对齐排才有意义**（而左对齐那版盒子没有底色，
     那 0.575px 也没人看得见）。 */
  /* 🔴 **纵向内边距原来是 `6px` —— 抄漏了一半**（2026-09-28 补）。
     命定 `TabBar.module.scss` `.item` 原文是 `padding: 12px 14px 11px`，
     窄屏那条是 `11px 10px 10px`。下面 430 档那段注释一直引着这两个值 ——
     但**只把横向那半抄了**（`14 → 10` 收进 `--tab-pad`），**纵向那半整个丢了**，
     落成 `6px`。后果是量具每页都报的一行：
       `触控 🔴矮button.yh-tab 29.25×…`（15 个页面 × 6 个签，一次没漏）
     29.25 ＝ 行盒 17.25 ＋ 6×2。补回成法的 12/11 后 ＝ 17.25 ＋ 23 ＝ **40.25**。
     ⚠ **纵向写 12/11 而不是 11/11** —— 照抄命定的**不对称**：下边少 1px，
       因为 `.yh-tab::after` 那条 2px 指示横条压在底边上，视觉重量偏向下方。
     ⚠ `--tab-pad` 只管横向（它同时是横条的内缩），纵向是独立两个数，别混。
     ⚠⚠ **本文件里的注释反引号必须转义成 \`** —— 这一段 CSS 是 template literal 的
       参数，裸反引号会提前闭合整个串，脚本直接起不来（`_分栏_骨架.js` 头部记了同款坑，
       那边踩过五次）。我是先写了裸的、`node _排版.mjs` 报
       `SyntaxError: Invalid or unexpected token` 才发现。 */
  padding: 12px var(--tab-pad) 11px;
  color: var(--p-ink2);
  background: none;
  border: 0;
  border-radius: 0;
  cursor: pointer;
}
/* ── 「当前在哪」的指示器：**底部横条** ──────────────────────────────────
   🔴 原先是**左端一根 2px 竖刻度**（`.yh-tab::before`）—— 已改。
   改的理由不是"横条更好看"，是**竖刻度在铺满之后失效了**：
   槽位从 49.6px 涨到 134px，刻度还钉在槽位最左缘，离居中的文字 60 多像素 ——
   那一刻它读起来像**分栏线**，而不是"你在这格"。形状跟内容脱钩了。
   命定之诗的做法正是横条（`&::after { left:12px; right:12px; bottom:-1px; height:2px }`）：
   横条量的是**槽位**，槽位越宽它越明确。
   🔴 形状学它，**颜色不学** —— 命定那条是紫蓝 `--theme-tab-indicator`（它的主题强调色），
      月痕的红线是「当前在哪」**只走主字色 `--p-ink`，不借告急色**，照旧。
   🔴 不学它那半句 `border-radius: 999px` —— 本卡直角到底，突然一个胶囊是外来物。 */
.yh-sb .yh-tab::after {
  content: '';
  position: absolute;
  left: var(--tab-pad);
  right: var(--tab-pad);
  bottom: -1px;                    /* 压在 `.yh-tabs` 那条 1px 底边上，横条跨住两边 */
  height: 2px;
  background: var(--p-ink);
  transform: scaleX(.3);
  transform-origin: 50% 100%;      /* 从中心长出去 —— 短→长是一个"到位"的动作 */
  opacity: 0;
  transition: transform .18s cubic-bezier(.2, .75, .25, 1), opacity .18s ease;
}
.yh-sb .yh-tab.yh-on { color: var(--p-ink); font-weight: 700; }
.yh-sb .yh-tab.yh-on::after { transform: scaleX(1); opacity: 1; }
.yh-sb .yh-tab.yh-off { color: var(--p-ink3); }

/* ── 页签图标 ────────────────────────────────────────────────────────────
   命定 `TabBar.module.scss`：
     `.item i { font-size: 12px; opacity: .72 }` ＋ `.itemActive i { opacity: 1 }`
   ⇒ **未激活压到 72%，激活才满。** 图标也参与"你在这格"的表达，不是只跟着文字变色。
   颜色走 `currentColor`（`background: currentColor` ＋ `mask`）⇒ 页签的
   `.yh-on` / `.yh-off` 一改文字色，图标自动跟着走，不用写第二份颜色。
   ⚠ 尺寸 13px 对着 11.5px 的中文 —— 图标略大于字高才看得出形状，
     和字一样大就会被当成第 0 个字（这条是量出来的：命定 12px 图标配 12px 文字，
     它的西文 x-height 比中文小得多，尺寸不能直接搬）。 */
.yh-sb .yh-ti {
  width: 13px;
  height: 13px;
  flex: 0 0 auto;
  background: currentColor;
  -webkit-mask: var(--i) center / contain no-repeat;
  mask: var(--i) center / contain no-repeat;
  opacity: .72;
  transition: opacity .15s ease;
}
.yh-sb .yh-tab.yh-on .yh-ti { opacity: 1; }

/* 🔴 窄屏：**收页签内边距**，不用 `display:none` 藏东西、更不用
   `font-size:0` 把中文抽掉（创世回廊那条反面教材）。
   抄的是命定之诗 540px 那条：`padding: 12px 14px 11px → 11px 10px 10px`。
   收完 6 个页签 ＋ 徽记才挤得进 320 档那一行（实测每签 45.8px）。
   ⚠ 一条 `--tab-pad` 同时收**内边距**和**指示器横条的内缩**，不会一边收一边没收。 */
@media (max-width: 430px) {
  /* 🔴 加了图标之后 320 档的算术变了 —— 每签最小宽从「文字 ＋ 内边距」变成
     「文字 ＋ 内边距 ＋ 图标 ＋ 间距」，多出 13px。收三处把它压回来：
       `--tab-pad` 5 → 4（同时收指示器横条的内缩，一处定义两条一起收）
       图标 13 → 11（仍大于 11.5px 中文字的 x-height）
       间距 5 → 2
     ⇒ 每签最小宽 24.15 ＋ 8 ＋ 11 ＋ 2 ＝ 45.15，×6 ＝ 270.9，＋徽记 28 ＝ 298.9，
       320 档内容盒 304.6 ⇒ 放得下（余 5.7px）。
     ⚠ 余量很薄 —— 真折行了就再收图标到 10px，别去动页面其它地方。 */
  .yh-sb .yh-tab { --tab-pad: 4px; gap: 2px; padding: 11px var(--tab-pad) 10px; }
  .yh-sb .yh-ti { width: 11px; height: 11px; }
  .yh-sb .yh-crest { margin: 0 var(--sp-2) 0 2px; }
}

/* ── 内容区 ──────────────────────────────────────────────────────────── */
.yh-sb .yh-pane { margin: 0; padding: var(--sp-1) var(--pad-x) var(--sp-2); }
.yh-sb .yh-grp {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  column-gap: var(--sp-3);
  row-gap: var(--sp-1);            /* 原 1px —— 折行后两行会粘成一坨 */
  padding: var(--sp-1) 0 var(--sp-1) 10px;
  border-bottom: 1px solid var(--p-line3);
  border-left: 2px solid transparent;     /* 指示灯竖条的位置 —— 默认不亮 */
  transition: border-left-color .2s ease;
}
.yh-sb .yh-grp > span { flex: 0 0 auto; }  /* 🔴 宁可整格折行，不许压字 */
.yh-sb .yh-grp:last-child { border-bottom-color: transparent; }
/* 组名 —— 按三家共识走「小 ＋ 字距 ＋ 灰」三件套，**不加粗、不放大**。
   （RhineLabUI 的 `.panel-label { font-size: 9px; letter-spacing: 1px }` 最接近本用途：
     它是分类签，不是标题。） */
.yh-sb .yh-grp .yh-gn {
  font-size: var(--fs-1);
  letter-spacing: .16em;
  margin-right: -.16em;            /* 🔴 字距尾巴补偿，见页签那条 */
  color: var(--p-ink3);
}
.yh-sb .yh-grp .yh-sep { color: var(--p-line2); margin: 0 1px; }
.yh-sb .yh-grp > span:not(.yh-gn):not(.yh-sep) { font-size: var(--fs-2); color: var(--p-ink); }

/* ── 名 / 值（本轮 JS 拆出来的那两个 span，就是为这里）──────────────────
   三家共识：**标签和值各自是独立元素**，颜色/字重/字号随便分调。
   差距靠 1 档字号 ＋ 一冷一暖两个灰拉开，不靠加粗对撞。 */
.yh-sb .yh-k { color: var(--p-ink3); font-size: var(--fs-1); }
.yh-sb .yh-v { color: var(--p-ink);  font-size: var(--fs-2); }

/* 🔴 指示灯：**读的是内容，不是位置** —— 这一行里有坏值才亮 */
.yh-sb .yh-grp:has(.yh-no) { border-left-color: var(--p-fault); }
.yh-sb .yh-grp:has(.yh-err) { border-left-color: var(--p-urgent); }

/* ── 三种非正常态 ────────────────────────────────────────────────────── */
.yh-sb .yh-no  { color: var(--p-fault); font-size: var(--fs-2); font-weight: 700; }
.yh-sb .yh-d   { color: var(--p-ink3); font-size: var(--fs-1); }
.yh-sb .yh-ok  { color: var(--p-ink2); font-size: var(--fs-1); }
.yh-sb .yh-err {
  margin-top: var(--sp-2);
  padding: 5px 8px;
  background: #eee7df;                                            /* 兜底：手算的 7% 混色 */
  background: color-mix(in srgb, var(--p-urgent) 7%, var(--p-card));
  border-left: 2px solid var(--p-urgent);
  color: var(--p-urgent);
  white-space: pre-wrap;
}

/* ── 页脚（源行）也压一道冷灰凹槽，跟徽记呼应 ────────────────────────── */
.yh-sb .yh-src {
  margin: 0;
  padding: 5px var(--pad-x) 6px;
  background: var(--p-sunk);
  border-top: 1px solid var(--p-line2);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5);
}

/* ── 折叠 ────────────────────────────────────────────────────────────── */
.yh-sb .yh-fb {
  font: inherit;
  font-size: var(--fs-1);
  line-height: 1.5;
  letter-spacing: .05em;
  color: var(--p-ink2);
  padding: 0 6px;
  background: none;
  border: 1px solid var(--p-line2);
  border-radius: 0;
  cursor: pointer;
  transition: color .16s ease, border-color .16s ease;
}
.yh-sb .yh-fb:hover { color: var(--p-ink); border-color: var(--p-ink2); }
.yh-sb .yh-fold { margin-top: 3px; padding-left: 10px; color: var(--p-ink2); font-size: var(--fs-1); }
.yh-sb .yh-fold[hidden] { display: none; }

@media (prefers-reduced-motion: reduce) {
  .yh-sb *, .yh-sb *::before, .yh-sb *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
/* ══ 内容区：卡片 ＋ 池子条 ＋ 详情层（视觉重做 · 2026-09-27）═══════════════
   🔴 **本轮的转折**：上一版我做的是一套「1px 细线 ＋ 零圆角 ＋ 零填充」的极简线框。
      驾驶员当场判死：「命定的你是一点没学啊」。
      读过命定源码（`The-poem-of-destiny/FrontEnd-for-destined-journey` 的
      `src/status/` 目录下 14 份 `*.module.scss`）之后，确认**我错在哪**：

      | 维度 | 命定源码原值 | 我上一版 |
      |---|---|---|
      | 卡底 | `color-mix(card-bg 88%, transparent)` —— 半透明卡色叠在窗口底上 | `background: none` |
      | 卡边 | `1px solid color-mix(card-border 80%, transparent)` | `border: 0`，只有下划线 |
      | 圆角 | 4 / 8 / 12 / 999px | 全部 0 |
      | 内高光 | `box-shadow: inset 0 1px 0 白4%` ⇒ "有厚度" | 无 |
      | 标签·值 | **标签在左、值在右** `minmax(82px,.24fr) minmax(0,1fr)` | 标签在上、值在下 |
      | 语义 chip | `border-radius:999px` ＋ 色 12% 混底 / 42% 混边 | 无 |
      | 左竖条 | 状态效果 `3px` 三色；任务摘要 `2px` 主色 | 无 |
      | 池子 | 轨道 14px/圆角 8px/底 `rgba(0,0,0,.25)`；**数值居中在条内** | 无 |
      | 统计格 | `repeat(auto-fit,minmax(88px,1fr))`，标签 10px / 值 15px·700 | 无 |
      | 图标 | `mask: var(--icon) center/contain` ＋ `background: 语义色` | 只有 1 个徽记 |

      **根因**：我把「大面积实心填充＝廉价」读成了「一律不许有填充」。
      命定的填充是**半透明淡卡底**，靠 `1px 边 ＋ 4px 圆角 ＋ 内顶高光` 收边 ——
      不是大面积实心色块。这条在暖米纸上照样成立：**白 50% 叠在暖米底上 ＝ 一张浮起的白卡**。

   🔴 **保留不动**（这些是量出来、不是猜出来的）：详情层**取代**内容区（不是弹层）·
      `-webkit-line-clamp` 全文进详情层 · `.yh-grp > span.yh-long` 那个特异度陷阱 ·
      两栏 `repeat(2,minmax(0,1fr))` 与 860px 断点 · `.yh-card` 的 `box-sizing` 那句。 */

/* ── 令牌补层 ──────────────────────────────────────────────────────────────
   ⚠ 色彩**值**没动（`--p-card` / `--p-ink*` / `--p-line*` 全照旧），
     只**新增**这一轮要用的层次。命名照旧走功能语义（tavern-ui skill 的要求）。 */
.yh-sb {
  /* 抬升／凹槽 —— 暖米纸上的"叠一张白纸"与"压一道槽"。
     🔴 用**半透明**而不是实色：叠在任何底上都自然，也不会在下一次改底色时变成孤儿色。 */
  --p-raise:  rgba(255, 255, 255, .52);   /* 卡片底：比面板亮 ⇒ 浮起来 */
  --p-well:   rgba(46, 42, 34, .07);      /* 凹槽：进度条轨道 / 输入框 */
  --p-chip:   rgba(46, 42, 34, .055);     /* chip 底（中性） */
  --p-hi:     rgba(255, 255, 255, .9);    /* 内顶高光 */

  /* 圆角阶梯 —— 照命定 `$border-radius-sm/md/lg` ＝ 4/8/12 */
  --r-1: 4px;  --r-2: 8px;  --r-3: 12px;  --r-pill: 999px;

  /* 语义色 —— 暖米纸上要**降饱和、偏矿物**，不能用荧光色（那是屏幕色，不是纸上的色）。
     三个池子色是驾驶员 2026-09-27 点名要的「彩色渐变，色彩搭配要和背景相符」。 */
  --c-hp-a: #b8483a;  --c-hp-b: #d97a5e;   /* HP 朱砂 → 陶土 */
  --c-mp-a: #3c6a9e;  --c-mp-b: #6f9ec9;   /* MP 石青 → 天青 */
  --c-sp-a: #4a7a4e;  --c-sp-b: #86ab72;   /* SP 苔绿 → 芽绿 */
  --c-exp-a:#a8792c;  --c-exp-b:#cfa855;   /* EXP 赭石 → 麦黄 */
  --c-ok:   #4a7a4e;                        /* 增益/已解锁 —— 同 SP 色系 */
  --c-bad:  #8a3a1e;                        /* 告急（＝ --p-urgent） */
  --c-spec: #8a6a24;                        /* 特殊（＝ 土黄） */
  --c-main: #7a5a34;                        /* 主色：暖棕 —— 选中/指示器 */
}

/* ── 网格 ──────────────────────────────────────────────────────────────────
   依据 ＝ 命定 `StatusTab.module.scss` `.dashboardGrid{display:flex;gap:16px}`。
   这里用 grid ＋ `repeat(2,minmax(0,1fr))`：月痕的条目是**数量不定的一串**，
   不是命定那种"固定的左栏一堆、右栏一堆"。
   🔴 **行优先**（默认），不用 `column-count` —— 读序保持左→右、上→下，Z 字扫描对得上
      人体视觉习惯；`column-count` 是竖着排完一栏再排下一栏，读序会跳。
   🔴 `align-items: start` —— **2026-09-27 改判**，原来这儿写的是"默认 stretch 让同行等高、
      底边对齐，写 start 会锯齿底"。那条在**各卡内容量相近**时成立；
      可状态页是 `三抗` 3 格 对 `心智` 5 格 —— 硬差 90px，**等高就必须把这 90px 塞进某处**：
        · stretch ＋ 内容顶在上面 ⇒ 卡下面空一大块，像"这张卡没写完"；
        · stretch ＋ `justify-content:center` ⇒ 卡头一起被居中，**两栏卡头错开**；
        · stretch ＋ `space-between` ⇒ 卡头和格子顶到上下两端，中间裂开。
      **三条全是同一个病：把不属于这张卡的高度硬塞给它。** 改成 start ⇒ 卡只有自己内容那么高，
      卡头与内容紧贴；代价只是同行底边可能差十几 px（3 格 vs 5 格那条差 17px，看不出来）。
      ⇒ 判据：**宁可底边不齐，不可让一张卡里出现说不清来历的空白。** */
.yh-sb .yh-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: var(--sp-3);
  row-gap: var(--sp-3);            /* 16→12：卡片自己有边有底了，不再需要大间距扛分组 */
  align-items: start;
}
/* 🔴 **落单的那张卡横跨两栏**（2026-09-27）。
   状态页固定 5 张卡 ⇒ 第 5 张（成长）永远单独占一行左半边，**右下角空出一整块**
   （900 档实拍约 430×110px）。那不是"留白"，是**排版没算完**：
   读者扫到右下会以为还有内容没画出来。
   ⚠ 判据与页签条那条同源 —— **空场要填，不是把容器缩小**。
   ⚠ 用 `:last-child:nth-child(odd)` 而不是写死第 5 张：卡数是数据驱动的，
     哪天少一组，落单的就是别人，这条选择器自己会跟过去。
   ⚠ 单栏档（≤860）`grid-column: 1 / -1` 等于没写，所以不用给它加断点。 */
.yh-sb .yh-grid > .yh-card:last-child:nth-child(odd) { grid-column: 1 / -1; }
@media (max-width: 860px) {
  .yh-sb .yh-grid { grid-template-columns: minmax(0, 1fr); }
}

/* ── 卡 ────────────────────────────────────────────────────────────────────
   🔴 **形态整个换了** —— 上一版是"一行横排流式、`·` 分隔"，
      这一版照命定 `questCard` 改成**纵向分区**：
      `卡头（名字）→ chip 行 → 摘要（左竖条）→ 标签值行`。
      横排流式的问题是**所有字段一样重**：名字、级别、日期、目标全挤在一行，
      眼睛没有落点；纵向分区之后，**名字最重、chip 次之、正文再次、元数据最轻**。
   🔴 卡本身仍是一颗 `<button>`（整卡可点 ⇒ 触摸目标大）——不变量没变。 */
.yh-sb .yh-card {
  font: inherit;
  text-align: left;
  color: inherit;
  /* 🔴 淡底 ＋ 1px 边 ＋ 4px 圆角 ＋ 一道底部投影 ＝ 命定 `.card` 那套。
     暖米底上「白 52% 叠上去」就是一张浮起的白卡 —— 这是层次，不是"大面积实心色块"。
     （我上一版把两者混为一谈，才做成了没有层次的一整片。） */
  background: var(--p-raise);
  border: 1px solid var(--p-line3);
  border-radius: var(--r-1);
  /* 🔴 **投影加深**（2026-09-27 二改）。
     上一版这里写的是 `0 1px 2px rgba(46,42,34,.05)` —— 偏移 1px、模糊 2px、5% 黑。
     那句注释还自称"命定 `.card` 同款"，**是假的**：命定原文是
       `box-shadow: 0 6px 16px color-mix(in srgb, var(--theme-window-border) 16%, transparent), …`
     偏移 6px、模糊 16px、16%。**我把它缩到了 1/6 还自称同款** —— 于是卡片与米黄底之间
     只剩一根 1px 淡线，读起来是"一个大平面上画了五道线"，不是"五张纸浮在上面"。
     驾驶员 2026-09-27 的原话：「你原型现在的烂完了，也没有把各种分开」——
     这条投影就是"分开"最直接的那一件：**卡片必须先离开底面，边界才成立。**
     ⚠ 数值按暖米纸折算：命定那 16% 是压深色底的，米黄底上黑影会发脏 ⇒ 取 10%
       并把颜色锁成纸墨色 `46,42,34`（不用纯黑 —— 纯黑投影在暖纸上是灰斑）。 */
  box-shadow:
    0 6px 16px rgba(46, 42, 34, .10),
    inset 0 1px 0 var(--p-hi);      /* 内顶高光 ⇒ 有厚度（这一句才是命定 `.card` 同款） */
  width: 100%;
  /* 🔴 `box-sizing` **不继承** —— `.yh-sb` 上那条只管它自己。不写这句：
     `width:100%` 拿到列宽 407，再加 padding/border ⇒ 实宽超出列宽（320 档溢出的来源）。 */
  box-sizing: border-box;
  min-width: 0;                     /* 网格项的老规矩：不写会被长内容撑破 */
  cursor: pointer;

  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  /* ⚠ 这里**不能**写 `justify-content: center`（写过一版，当天就撤了）：
     它居中的是**整个内容块、连卡头一起** —— 900 档实况是「三抗」卡头掉到卡中间，
     而右边「心智」卡头在顶部，**两栏卡头不在一条水平线上**，扫读时视线得跳。
     ⚠ 也别指望"卡头吸顶 ＋ 数据区居中"那类补丁（`.yh-stats` 的 `margin-block: auto` 试过，
       结果是卡头和格子之间裂开 80px）。**真正的解法是让卡压根没有多余高度**
       —— 见 `.yh-grid` 的 `align-items: start`。 */
  padding: var(--sp-3);
  transition: background .15s ease, border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
/* 可点的卡：hover 才浮一下（命定 `.questCard:hover` 是 `translateY(-1px)` ＋ 投影加深）。
   🔴 只给 `<button>` —— 状态/在场那些不可点的 `<div>` 不跟着动，免得骗人去点。 */
.yh-sb button.yh-card:hover {
  background: rgba(255, 255, 255, .72);
  border-color: var(--p-line2);
  box-shadow: 0 4px 12px rgba(46, 42, 34, .09), inset 0 1px 0 var(--p-hi);
  transform: translateY(-1px);
}
.yh-sb button.yh-card:focus-visible {
  outline: 2px solid var(--c-main);
  outline-offset: 1px;
}
.yh-sb div.yh-card { cursor: default; }

/* 卡头 —— 名字 ＋ 图标。
   🔴 字号 15.5（`--fs-3`）＋ 700：**卡里最重的一档**。上一版名字跟别的格一样大，
      一屏十张卡扫下来找不到标题（人体视觉：没有字号差的列表＝没有入口）。 */
.yh-sb .yh-c-h {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.yh-sb .yh-c-n {
  font-size: var(--fs-3);
  font-weight: 700;
  color: var(--p-ink);
  line-height: 1.3;
  word-break: break-word;
  min-width: 0;
}
/* 卡头的图标 —— 跟着名字走，不抢焦点 */
.yh-sb .yh-c-h .yh-i { color: var(--p-ink3); }
/* 🔴 **「这张卡点得进去」的常驻标记**（2026-09-28 补）——
   依据 ＝ 命定 `StatusTab.module.scss` `.detailEntryChevron`（可点进详情的入口卡，
   **标题行右端**一个 `color: text-muted` 的小 chevron）。月痕原来只有 `cursor: pointer`
   ＋ hover 那一套 —— 那是**鼠标碰上去之后**才有的反馈，**碰之前可点的卡和不可点的卡
   长得一模一样**，玩家没有理由去点。
   🔴 `margin-left: auto` 而不是给 `.yh-c-h` 加 `justify-content: space-between`：
      后者会把**卡头图标和名字也拆开**（flex 会把 gap 平均分到三个子元素之间），
      而图名和名字是**一组**（6px 紧挨着）。auto 外边距只推最后这一个。
   ⚠ 颜色不在这儿写 —— 它已经是 `.yh-c-h .yh-i` 的 `--p-ink3`（全卡最弱一档），
      正好是命定 `text-muted` 的位阶。**弱到"看得见但不抢戏"就对了，不用再调。** */
.yh-sb .yh-c-go { margin-left: auto; }

/* chip 行 —— 短枚举（状态/级别/类型/期限/冷却）走胶囊，**不再散在文本流里**。
   🔴 `flex-wrap` ＋ `gap`：窄栏放不下就换行，不是压字（同「宁可整格折行，不许压字」）。 */
.yh-sb .yh-c-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  min-width: 0;
}
.yh-sb .yh-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 22px;
  padding: 2px 8px;
  border-radius: var(--r-pill);
  border: 1px solid var(--p-line3);
  background: var(--p-chip);
  color: var(--p-ink2);
  font-size: var(--fs-1);
  line-height: 1.3;
  white-space: nowrap;
  max-width: 100%;
}
/* 语义 chip —— **色 12% 混底 ＋ 42% 混边**（命定 `.buffChipBuff` 那套）。
   ⚠ 用 `color-mix` 而不是写死三元色：同一个色源派生底/边/字三档，
     下次改主色只改一处（命定全库都这么写）。 */
.yh-sb .yh-chip-on   { border-color: color-mix(in srgb, var(--c-ok)   42%, var(--p-line3) 58%);
                       background:   color-mix(in srgb, var(--c-ok)   12%, transparent); color: var(--c-ok); }
.yh-sb .yh-chip-off  { border-color: var(--p-line3); background: var(--p-chip); color: var(--p-ink3); }
.yh-sb .yh-chip-bad  { border-color: color-mix(in srgb, var(--c-bad)  42%, var(--p-line3) 58%);
                       background:   color-mix(in srgb, var(--c-bad)  12%, transparent); color: var(--c-bad); }
.yh-sb .yh-chip-spec { border-color: color-mix(in srgb, var(--c-spec) 42%, var(--p-line3) 58%);
                       background:   color-mix(in srgb, var(--c-spec) 12%, transparent); color: var(--c-spec); }
/* 摘要 —— 自由文本的**行内预览**，带一道左竖条（命定 `.questProgress`：
   `border-left: 2px solid 主色44%` ＋ `background: surface-muted 54%` ＋ 右侧圆角）。
   🔴 `-webkit-line-clamp` 是唯一能跨浏览器做**多行**截断的东西
      （`text-overflow: ellipsis` 只管单行）。非标准，但 Chrome/Safari/Firefox 都实现。
   ⚠ 省略号是**可见的** ⇒ 不算「静默吞数据」—— 那条（账本不筛）针对的是"根本不画"。
      而且整张卡可点、详情层里是全文。 */
.yh-sb .yh-c-sum {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  /* 🔴 **底部内边距必须是 0**（2026-09-28，出图后才查出来的）——
     现象：320/390 档摘要块底边**露出一截被切掉半行的字**（4× 特写图上一目了然）。
     根因是两套裁切的**边界不重合**：
       · `-webkit-line-clamp: 2` 管的是**内容盒** —— 裁在 2 × line-height ＝ 41.86px；
       · `overflow: hidden` 裁的是 **padding-box** —— 底边在内容底之下 `padding-bottom` 处。
     两者差的正是这 6px。第 3 行的字形从 41.86px 开始画，41.86 → 47.84 这一段
     落在 padding-bottom 里、**不在 clamp 的管辖范围内** ⇒ 半个字就这么露出来了。
     ⇒ `padding-bottom: 0` 让两个边界重合，裁切点正好压在第 3 行的起点上。
     ⚠ **别用 `max-height` 替 clamp 来"修"这个** —— 试算过：`max-height` 在
       `box-sizing: border-box` 下同样含 padding，第 3 行照样露 6px；而只算
       padding-top 又会把第 2 行切掉。**病根在"两个裁切边界不重合"，不在用哪个属性。**
     ⚠ 也**别把 clamp 提到 3 行**来绕 —— 那只是把同一个洞推到第 4 行，且当前数据
       全文正好 3 行（320 档实测 scrollHeight 75px），提上去等于取消截断，
       跟"长文本进详情看全文"的设计相反。
     ⚠ 视觉上的下边距由外层容器的 gap 给，不靠 padding —— **gap 不在裁切区内**。
     ⚠ 探针量不出来这个：它量到 `clientHeight − padding = 2.01 行` 报"整行 ✓"，
       因为**溢出量恰好等于 padding-bottom、被算进了 padding 里**。
       ⇒ 抓到它靠的是 4× 局部特写（`_量分栏.mjs --特写`），不是数字。 */
  padding: 6px 9px 0;
  border-left: 2px solid color-mix(in srgb, var(--c-main) 44%, transparent);
  border-radius: 0 var(--r-1) var(--r-1) 0;
  background: color-mix(in srgb, var(--p-ink) 4%, transparent);
  color: var(--p-ink2);
  font-size: var(--fs-2);
  line-height: 1.55;
  word-break: break-word;
}

/* 标签值行 —— **标签在左、值在右**（命定 `.basicInfoRow`：
   `grid-template-columns: minmax(82px, .24fr) minmax(0, 1fr)`）。
   🔴 这一条是整轮改动里**最要紧**的一处：上一版标签在上、值在下（竖排），
      一屏十张卡看下来，每张卡都长一倍、右半幅全空。
      横排之后**卡矮一半、且标签列对齐成一条竖线** —— 眼睛能顺着标签列扫。
   🔴 **窄屏不塌栏** —— 曾经有一条 `≤540px` 塌成一栏的规则，2026-09-27 删了
      （理由见这条规则下面那段）。**横排是全宽度都成立的结论，不是宽屏专属。** */
.yh-sb .yh-c-kv {
  display: grid;
  grid-template-columns: minmax(56px, auto) minmax(0, 1fr);
  gap: 3px var(--sp-3);
  align-items: baseline;
  min-width: 0;
}
.yh-sb .yh-c-kv > .yh-k {
  color: var(--p-ink3);
  font-size: var(--fs-1);
  font-weight: 600;
  white-space: nowrap;
}
.yh-sb .yh-c-kv > .yh-v {
  color: var(--p-ink);
  font-size: var(--fs-2);
  min-width: 0;
  word-break: break-word;
}
/* 🔴 **行与行之间补一道细线**（2026-09-27 二改）。命定 `.basicInfoRow` 原文：
     `border-bottom: 1px solid color-mix(card-border 70%, transparent);`
     `&:last-child { border-bottom: none; }`
   为什么要它：任务卡的 `级别 S / 委托方 官署 / 期限 1916年3月5日` 三行，
   上一版只靠 3px 行距分开 —— 三行**读成一段**，眼睛得重新找"下一行的标签在哪一列"。
   有了底线，标签列那条竖线之外又多了一条横线，**每一行是一个可停靠的格**。
   这与 `.yh-stat` 那条描边是同一个判据的两处应用：**不同层级各说各的边界**。
   ⚠ 实现细节：`.yh-c-kv` 是 grid，DOM 是 `k,v,k,v…` 扁平排列，
     所以线画在**每一格**上，靠两格各自的线接成通长的一条。
   🔴 **2026-09-28 订正 —— 「接成通长的一条」原来没成立。** `_特写_主线卡_宽_1.png`
      （4×）上那条线**断成两截**，中间一个 12px 的豁口 —— 因为 `column-gap: var(--sp-3)`
     正开在两格之间，线画在格上就跟着断开。**命定那边不断，是因为它的线画在"行"元素上**
     （`.basicInfoRow` 是个包住整行的盒子），我这边是扁平 `k,v` 没有行盒子。
     ⇒ 修法：**列距从 `gap` 挪到值格自己的 `padding-left`** —— 两格的线就贴上了，
       视觉间距一点没变，行盒子也不用加（扁平 DOM 是别处依赖着的不变量）。
     ⚠ 教训：注释里写"视觉上如何"必须**出图看过再写** —— 这句我写的时候是推的，推错了。
     末行两格（`:nth-last-child(-n+2)`）去掉，不然卡底会多一条悬空的线。
   ⚠ 行距 `3px` → `0`：线自己就占位，再留 3px 就散了（线与线之间该紧）。 */
.yh-sb .yh-c-kv { row-gap: 0; column-gap: 0; }
.yh-sb .yh-c-kv > .yh-k,
.yh-sb .yh-c-kv > .yh-v {
  padding-block: 3px;
  border-bottom: 1px solid color-mix(in srgb, var(--p-ink) 9%, transparent);
}
/* 值格补上原来由 `column-gap` 提供的横向间距（见上一条订正） */
.yh-sb .yh-c-kv > .yh-v { padding-left: var(--sp-3); }
.yh-sb .yh-c-kv > :nth-last-child(-n+2) { border-bottom: 0; }
/* 🔴 **2026-09-27 删掉了 `@media (max-width: 540px)` 把 `.yh-c-kv` 塌成一栏那条。**
   原注释写的是「窄屏（≤540，命定同款断点）塌成一栏：标签上、值下」——
   可**上面那三行刚刚才说"标签在上、值在下"是整轮最要紧的毛病**（卡长一倍、右半幅全空）。
   同一段里宽屏判它死刑、窄屏又请它回来，这不是"窄屏更保守"，是**自相矛盾**：
   窄屏（390/320）才是最缺竖向空间的地方，在那儿把卡撑高一倍比宽屏更亏。
   实测数据也支持不塌：内容区 363px（320 档 296px），首列下限 56px ＋ 间距 12px，
   值列还剩 295px（320 档 228px）—— 而最长的值 `1916年3月5日` 只要约 100px。
   ⚠ **别照搬命定的 540 断点** —— 那个断点是配它自己的字段长度定的；
     月痕这边的标签是 `级别`/`委托方`/`期限` 这类 2~4 字短词，两列从来没挤过。
   ⇒ 判据：**断点要按自己的字段长度定，不是按参照物抄。** */

/* 读不出来的格 —— 保住上一版的语义色（故障走 `--p-fault`，不是告急色） */
.yh-sb .yh-no { color: var(--p-fault); font-weight: 700; }
.yh-sb .yh-d  { color: var(--p-ink3); }

/* ── 图标 ──────────────────────────────────────────────────────────────────
   命定用 Font Awesome（`<i class="fa-solid …">`）。月痕**不能引外链** ——
   状态栏活在楼层内嵌 iframe 里，引外网就是引一个会失效的依赖。
   ⇒ 自绘单色 SVG ＋ `mask` 上色：**图标本身没有颜色**，颜色由 `background` 决定，
     跟着上下文自动变（命定 `.resourceBarIcon` / `.sectionIcon` 都是这个手法）。
   🔴 `-webkit-mask` 要写全 —— Chrome 至今仍只认带前缀的那条。 */
.yh-sb .yh-i {
  display: inline-block;
  flex: 0 0 auto;
  width: 14px;
  height: 14px;
  background: currentColor;
  -webkit-mask: var(--i) center / contain no-repeat;
          mask: var(--i) center / contain no-repeat;
}
.yh-sb .yh-i-16 { width: 16px; height: 16px; }
.yh-sb .yh-i-18 { width: 18px; height: 18px; }

/* ── 池子条 ────────────────────────────────────────────────────────────────
   依据 ＝ 命定 `ResourceBar.module.scss`：
   `grid-template-columns: 44px minmax(0,1fr)` ＋ 轨道 `14px / 圆角 8px / 底 rgba(0,0,0,.25)`
   ＋ **数值居中在条内**（`10px` ＋ **双层 text-shadow**）。
   🔴 那道双层描边不是装饰：数值压在**填充色**上，填充色随百分比变，单靠一个颜色
      总有一段读不清。黑 .5 ＋ 白 .5 两层 ⇒ 深底靠白边、浅底靠黑边，**任何位置都读得出**。
   🔴 填充用**渐变**（驾驶员 2026-09-27 点名要的）：
      亮端在左、深端在右。渐变给的是"有体积"的观感 —— 纯色条看着像色块，渐变像液体。
   ⚠ 色彩是**矿物色**（朱砂/石青/苔绿），不是屏幕荧光色 —— 暖米纸上要压得住。 */
/* 三根条竖着排（三值那一组）。`gap` 比卡片内的通用 gap 小 —— 三根条是**一个整体**，
   间距大了会被读成三个独立的块（同"分组由间距扛"那条理，只是这里要的是"它们是一家"）。 */
.yh-sb .yh-pools { display: flex; flex-direction: column; gap: 6px; }
.yh-sb .yh-pool {
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr);
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.yh-sb .yh-pool-k {
  font-size: var(--fs-1);
  font-weight: 700;
  color: var(--p-ink2);
  letter-spacing: .04em;
  white-space: nowrap;
}
.yh-sb .yh-pool-l {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.yh-sb .yh-pool-l .yh-i { color: var(--bar-a); }
.yh-sb .yh-pool-t {
  position: relative;
  height: 14px;
  background: var(--p-well);
  border-radius: var(--r-2);
  overflow: hidden;
  min-width: 0;
}
.yh-sb .yh-pool-f {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  border-radius: var(--r-2);
  background: linear-gradient(90deg, var(--bar-a), var(--bar-b));
  transition: width .25s ease;
}
.yh-sb .yh-pool-v {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 600;
  line-height: 1;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-shadow: 0 0 2px rgba(0, 0, 0, .5), 0 0 2px rgba(255, 255, 255, .45);
}
.yh-sb .yh-hp  { --bar-a: var(--c-hp-a);  --bar-b: var(--c-hp-b); }
.yh-sb .yh-mp  { --bar-a: var(--c-mp-a);  --bar-b: var(--c-mp-b); }
.yh-sb .yh-sp  { --bar-a: var(--c-sp-a);  --bar-b: var(--c-sp-b); }
.yh-sb .yh-exp { --bar-a: var(--c-exp-a); --bar-b: var(--c-exp-b); }
/* 读不出来的池子 —— 轨道照画、不填，值那格写字（**不是静默跳过**） */
.yh-sb .yh-pool-na .yh-pool-f { display: none; }
.yh-sb .yh-pool-na .yh-pool-v { color: var(--p-fault); text-shadow: none; font-weight: 700; }

/* ── 统计小格 ──────────────────────────────────────────────────────────────
   依据 ＝ 命定 `QuestsTab.module.scss` `.overviewStats`：
   `repeat(auto-fit, minmax(88px, 1fr))`；每格 `标签 10px muted` ＋ `值 15px·700`。
   ⇒ 同一组数字**等宽排开、值右对齐**，扫一眼就能比大小（人体视觉：等宽 ＋ 右对齐
      才比得出来；散在文本里比不出来）。 */
/* 🔴 先把骨架写在 `.yh-sb` 上的 `overflow-wrap: anywhere` **撤掉**（它被全面板继承）。
   那条是给长中文串兜底的，但对「数字＋单位」是灾难：`62/70` 被从 `7` 和 `0` 中间切断、
   `85` 断成 `8` ＋ `5`。⇒ 这里改回 `normal`（只在空格、`/` 这类**本来就有的断点**折行），
   真正需要"任意字符都能断"的两处（摘要 / 详情正文）**各自补回来** —— 见下面两条。 */
.yh-sb { overflow-wrap: normal; }
.yh-sb .yh-c-sum { overflow-wrap: anywhere; }
.yh-sb .yh-f .yh-v { overflow-wrap: anywhere; }

/* ── 统计小格 ────────────────────────────────────────────────────────────
   🔴 `78px` 是**压字的直接原因**：390 档内容区 363px 被塞进 4 列 ⇒ 每格 81px，
      `理智稳定性` 这种标签只剩截成 `理…` 一条路。判据是「宁可整格折行，不许压字」
      ⇒ 下限提到 120px：900 档 3 列 / 390 档 2 列 / 320 档 2 列，每格都放得下标签。
   ⚠ 列数随宽度在 2~3 之间变，这是 `auto-fit` 的本意 —— 比"固定 4 列、列列都挤"对。 */
.yh-sb .yh-stats {
  /* 🔴 **等宽网格**（2026-09-28 撤回当天早些时候的 flex 版 —— 经过见下面那条墓碑）。
     `auto-fit` 这一个关键字同时管两件事，都不需要 JS：
       · 格子数**少于**轨道数 ⇒ 空轨道被塌缩、剩下的按 `1fr` 重分
         （成长组：容器 800px、3 格 ⇒ 6 条轨道塌缩 3 条 ⇒ 三格各占 1/3、撑满整行）；
       · 格子数**多于**轨道数 ⇒ 末行左对齐、**末尾留空**
         （五维 5 格 / 3 列 ⇒ `3+2`，第二行两格各 123px，右边空 123px）。
     🔴 **末尾留空是正常网格行为，不是缺陷** —— 命定 `QuestsTab.overviewStats`
        (`repeat(auto-fit, minmax(88px,1fr))`) 与 `StatusTab.attributeGrid`
        (`repeat(3, minmax(0,1fr))`) **两处成法都没有任何"末行撑满"的花招**，
        不满行就空着。我当天早些时候把这个当成 bug 去修，才引出 flex 那版。
     🔴 **判据：同一组数字必须等宽排开**（本文件另一处注释早写下了这句）——
        格子宽度不等的话，"扫一眼比大小"这件事就不成立：
        值的位置随格子宽度漂移，眼睛没法纵向对齐。 */
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: var(--sp-1);
  /* ⚠ 这里**不要**写 `margin-block: auto`（写过一版，当天撤了）：
     它让格子去吃掉卡里的剩余高度 —— 卡头确实留在了顶端，但格子和卡头之间
     **裂开 80px**（900 档 `三抗` 实况），跟 `space-between` 是同一个病。
     ⇒ 剩余高度根本不该存在：`.yh-grid` 已经改成 `align-items: start`，
       卡只占自己内容那么高，没有剩余可分配，这儿自然什么都不用写。 */
}
.yh-sb .yh-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
  /* `min-width: 0` —— 不写它，内容的最小宽度会顶破 120px 的**轨道**下限，
     列数就随数据变，节奏全乱。宽度本身由上一条的 `minmax(120px, 1fr)` 给：
     轨道的 120px 是**外宽**，格子填满轨道，与 `box-sizing` 无关 ——
     所以这里既不需要 `flex-basis` 也不需要 `box-sizing`（两件都是 flex 版的账，
     flex 版已撤，见上一条）。 */
  min-width: 0;
  padding: 5px 9px;
  /* 🔴 **描边请回来**（2026-09-27 二改，推翻同日的上一版）。
     上一版我写的是：「去掉 1px 描边，改成纯浅底」，理由是"卡片已经有边了，
     再套一层是格中格，同一个边界声明了两次"。
     **那个理由错在把两个不同的边界当成了同一个**：
       · 卡片的边说的是「这张卡到这里为止」——**卡与卡之间**；
       · 格子的边说的是「这一格到这里为止」——**格与格之间**。
     这是两级分组，不是同一句话。去掉之后，五维 6 格 + 三抗 3 格 + 心智 4 格
     全变成一片 5.5% 的浅灰，**格与格之间没有任何可停靠的界**——
     扫读时眼睛落不到任何一格的边界上，六个数读成一团。
     命定 `.attributeItem` 原文正是「1px 边 + 极淡底」两件一起上：
       `border: 1px solid color-mix(card-border 64%, transparent);`
       `background: color-mix(window-bg 14%, transparent);`
     ⇒ 判据改了：**边界要按"分组层级"说，不是按"说了几次"说** —— 不同层级各说各的。
     ⚠ 底从 5.5% 降到 4%（有了描边就不必靠底色扛分量），线走 14% 墨 ——
       底 + 线加起来仍比卡片重，格子才会读作"卡片里的下一级"，而不是"另一张卡"。 */
  border: 1px solid color-mix(in srgb, var(--p-ink) 14%, transparent);
  border-radius: var(--r-1);
  background: color-mix(in srgb, var(--p-ink) 4%, transparent);
}
/* ══ 墓碑：`.yh-stat:last-child { grid-column-end: -1 }` ＋ `.yh-stat-w`（2026-09-28 撤）══
 *
 * 🔴 **两条都是我用错了 `grid-column-end` 的语义，而且我自己的探针替我兜住了错**。
 *
 * ① `grid-column-end: -1` **不是"横跨整行"，是"钉到最后一列"**。
 *    终点线固定在第 N+1 条 ⇒ 起点线被反推成"末列"（跨度默认 1）⇒
 *    格子落在**最后一列**、左边空着。我当时在注释里写的是
 *    「从自动放置到的那个位置一路延伸到最后一条列线」—— **那是 `grid-column: auto / -1`
 *    在我脑子里的样子，不是 CSS 的样子。**
 *    📷 铁证（320 档状态页，撤之前拍的）：五维第 3 行 `[空] [魅 11]`、
 *      三抗第 2 行 `[空] [污染 8%]`、成长第 3 行 `[空] [属性点 6]` ——
 *      **三个洞全在左半边**。900 档更糟：五维第 2 行 `智 12 · [空] · 魅 11`（洞在中间）、
 *      心智第 3 行 `月蚀度 66（蚀刻）` 孤零零挂在第 3 列。
 *
 * ② **坏的量具比没有量具更糟**：`落单` 探针当时报的是「末行 2 铺满✓ / 末行 1 铺满✓」，
 *    全绿。因为它只量**末格右边缘到容器右边缘** —— 格子钉在末列，右边缘天然贴合，
 *    **左半边空着它量不到**。⇒ 判据重写成"**整行占宽 vs 容器内宽**"（每一行都量，
 *    不只末行）。**只验一侧的判据等于没有判据**，这跟 `格排` 第一版量出"2.06 倍"是同一个坑。
 *
 * ③ 🔴 **当天晚些时候我又撤了 flex 版 —— 那是过度修正。** 经过照录：
 *    撤掉 `-1` 之后我先换成了 `.yh-stats{flex-wrap}` ＋ `.yh-stat{flex-grow:1}`
 *    （"每一行都撑满，不需要知道当前几列"）。**它确实消灭了洞，但代价是格子不再等宽**：
 *    `flex-grow` 把剩余宽按比例分给**末行那几个格子**，于是同一组里的格子出现
 *    127 / 190 / 381 三种宽度（📷 900 档状态页：「五维」行1 三格各 250px、行2 两格各 380px；
 *    「心智」行2 的 `月蚀度 66（蚀刻）` 更是被撑成 **762px 整行**、中间空 300px）。
 *    **这比原来那几个洞更显眼** —— 洞只是"少一块"，宽度不等是"同一组数字没法比大小"。
 *
 * ④ **病根只有 `-1` 一条，`auto-fit` 本来就是对的。** 回头查成法：
 *    命定 `QuestsTab.overviewStats`(`repeat(auto-fit, minmax(88px,1fr))`) 与
 *    `StatusTab.attributeGrid`(`repeat(3, minmax(0,1fr))`) **两处都是等宽网格，
 *    两处都没有任何"末行撑满"的花招** —— 不满行就左对齐空着，这是正常网格行为。
 *    而 `auto-fit` 本来就会**塌缩空轨道**：成长组（容器 800px、只有 3 格）三格自动撑满，
 *    "铺满"这件事根本不需要 flex。
 *    ⇒ **我把一个正常行为当成了 bug 修。** 判据其实早就写在本文件里
 *      （"同一组数字**等宽排开**、值右对齐，扫一眼就能比大小"）——
 *      **改之前没回头核自己写下的判据**，这是这一次真正的错处。
 *
 * ⑤ `.yh-stat-w`（放不下的格独占一行）**整套撤掉** —— 它靠 `标长格()` 挂载后实测，
 *    而那个判据只在"挂载那一刻的宽度"上成立：宽度一变就过期，出现
 *    **该跨的没跨、不该跨的跨了**（视口 900→400 不重画时实拍复现）。补 `ResizeObserver`
 *    是能修，但**这个类本来就多余**：`.yh-stat-row` 的 `flex-wrap` 会把长值换到第二行
 *    （标签上一行、值下一行、值右对齐），而 `确定项清单` 的判据是
 *    「**数据行宁可整格折行，不许压字**」—— 折行是**被允许**的形态，不是病。
 *    ⇒ 拿掉一整个量测子系统（`标长格` / `挂盯宽` / 两条 CSS 规则），
 *      换回"长值自然折行"。**少一个会说谎的机制。** */

.yh-sb .yh-stat-k {
  color: var(--p-ink3);
  /* 🔴 `10px` → `--fs-1`(11.5px)（2026-09-27）：全卡其它「标签/组名/页签」都走 `--fs-1`，
     只有统计格的标签自成一档 —— 10px 的中文在 390 档屏上要凑近看，而它是**读数据的入口**，
     比正文更该清楚。统一之后层级仍在（值 15px ÷ 标签 11.5px ＝ 1.30 倍）。
     ⚠ 顺带把 `.yh-stat-row > .yh-stat-k` 的 `min-width: 3.6em` 也托大了（em 跟着字号走：
       36px → 41.4px），对「不把标签压到 0 宽」那条更有利。 */
  font-size: var(--fs-1);
  font-weight: 700;
  letter-spacing: .04em;
  /* 🔴 原来是 `nowrap` ＋ `overflow:hidden` ＋ `text-overflow:ellipsis` ——
     放不下就截成 `理…`，那**就是压字**。⇒ 允许折行、不截断。
     `min-width:0` 是给行式布局用的：标签可缩，别把值挤出格。 */
  overflow-wrap: normal;
  min-width: 0;
}
.yh-sb .yh-stat-v {
  color: var(--p-ink);
  /* 🔴 `15px` → `18px`（2026-09-27 二改）。命定 `.attributeValue` 原文
     `font-size: 18px; font-weight: 800`，而它 `.attributeLabel` 是 12px ⇒ **比值 1.5×**。
     我上一版是 15 / 11.5 ⇒ **1.30×** —— 层级在，但**不够拉开**：
     数值是这张卡里唯一"要一眼比大小"的东西，它必须比标签重出一个档，不是重一点点。
     ⚠ **`font-weight` 留 700，不跟命定的 800** —— 命定字体是 `Noto Sans SC`（有 900 档），
       月痕字体栈是 `system-ui` 打头 ＝ Windows 上的 Segoe UI，**没有 800 这个真字重**；
       写了 800 只会走**合成伪粗**（字面糊、笔画粘连），在 11.5px 的小字旁边反而更脏。
       ⇒ 层级靠**字号**拉（18 ÷ 11.5 = 1.57×），不靠字重。 */
  font-size: 18px;
  font-weight: 700;
  line-height: 1.15;
  font-variant-numeric: tabular-nums;
  /* `keep-all` ⇒ 中文标签不被拆词；数字串只在空格 / `/` 处折行 ——
     那两处是**本来就有的断点**，断了两行也读得出是两段。**不掉进词内断行**。 */
  word-break: keep-all;
  overflow-wrap: normal;
  /* 🔴 `nowrap` 是 2026-09-27 补的：`240% / 300%` 原来**在 `/` 后面折成两行**
     （空格和 `/` 都是合法断点，浏览器当然断在最省事的地方）——
     结果成长卡里那格变成三行，旁边两格只有一行，一排格子高低全乱。
     实测格宽 124.33 − 内边距 18 = 106px，而这串在 16px/700/tabular 下约 85px ⇒ **本来就放得下**，
     是断点太松才断的，不是真装不下。
     ⇒ 判据：**先不许它断**，让「装不下」这件事暴露成溢出、由压字探针去报；
       真报溢出了我再回来降字号。**不许靠折行把装不下藏起来。** */
  white-space: nowrap;
}
/* 属性成对（五维/三抗/心智）—— 标签左、值右**同格一行**（命定 `.attributeItem`） */
.yh-sb .yh-stat-row {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  /* 🔴 `wrap` 是这一格的关键：当一格塞不下「4 字标签 ＋ `240% / 300%` 这种长值」时，
     **换行**——值掉到第二行、标签独占第一行——就**自动降级成列式**了。
     不 wrap 的话 flex 会把标签一路压到 0 宽：标签变成**一个字一行竖排**、
     还被值**盖在上面**（900 档 `晋升进度` 的实况）。
     ⇒ 判据：**放不下就换行，绝不允许把任何一格压到 0。** */
  flex-wrap: wrap;
  gap: 2px 6px;
}
/* 标签**不许被压到 0** —— 至少留得下 3 个字，否则就是竖排 */
.yh-sb .yh-stat-row > .yh-stat-k { flex: 1 1 auto; min-width: 3.6em; }
.yh-sb .yh-stat-row > .yh-stat-v { flex: 1 1 auto; min-width: 0; text-align: right; }
/* ── 值组：数值在上、**品阶/状态在下一行**（2026-09-28 加，驾驶员裁定「用命定」）────
   依据 ＝ 命定 `StatusTab.module.scss` 的 `.heroTitleRow`：
     `.heroLevel { font-size: 26px; font-weight: 800; line-height: 1 }`
     `.heroTier  { font-size: 15px; font-weight: 700; line-height: 1.25 }`
     `.heroTitleRow { display: flex; flex-direction: column; gap: 6px }`
   ⇒ **数值和它的品阶是上下两行**，不挤成一行。
   🔴 为什么非拆不可：`月蚀度 66（蚀刻）` 一整串要 136.09px，而 900 档那格内宽只有
      104px ⇒ 折行成"标签独占第一行 / 值独占第二行"，格子高一倍、右半边三分之二全空。
      拆开算账：**全角括号每个在 18px 下就是 18px 满宽**，`（蚀刻）` 4 个字符 ＝ 72px
      ＝ 格宽的 **69%**；而真正的数字 `66` 只占 20px。**69% 的格宽花在一个括号说明上。**
      拆成两行后这一格只需 `max(值 20, 副 23.9) ＋ 标签 41.4 ＋ 间距 6 = 71.3px`，
      **余 33px**（原来差 32px）。格高 50.95px，比原来的 51.95px 还**矮 1px**。
   ⚠ `flex: 0 1 auto`（不是 `1 1 auto`）—— 值组**不许被拉宽**：拉宽了值就不贴右，
     同组其它格的右边缘立刻对不齐，"等宽排开、值右对齐、扫一眼比大小"那条判据就废了。
   ⚠ `gap: 1px` 而不是命定的 `6px` —— 那是 26px 大字配 15px 的间距；这里 18px 配 11.5px，
     两个 line-height（1.15 / 1.5）本身已经各留了约 1.4px 和 2.9px 的铅空，再加 6px 就散了。 */
.yh-sb .yh-stat-row > .yh-stat-vg {
  flex: 0 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 1px;
}
/* 副行 —— 规格与 `.yh-stat-k`（标签）**逐字相同**：11.5px / 700 / .04em / ink3。
   为什么不新开一档：它读起来就该是"一个小的说明"（同一角色的第二个实例），
   多一档字号就多一个全卡要维护的数。命定自己也是这么分的 —— `.heroEditLabel`(12px/700)
   与 `.heroTier`(15px/700) **同色同重，只差字号** ⇒ 标签与品阶共享一套文字规格。
   ⚠ 不写 `white-space: nowrap`：放不下就折行，**不许溢出**（「宁可整格折行，不许压字」）。 */
.yh-sb .yh-stat-vs {
  font-size: var(--fs-1);
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--p-ink3);
}
/* 🔴 **窄档收一格**（2026-09-27 二改）—— 这条是**量测报出来的**，不是估的。
   值提到 18px 之后跑 `_量分栏.mjs`，320 档报：
     `压字 🔴 [{"谁":"stat-v","文":"240% / 300%","溢":6}]`
   算术：320 档成长卡内容盒 272px，`auto-fit` 给 2 列 ⇒ 每列 134px，
   减内边距 18 减描边 2 ＝ 格内可用 114px；而这一串在 18px 下要约 120px ⇒ 差 6px。
   （900 / 390 两档不报 —— 900 的成长卡横跨两栏有 265px 一列，390 有 153px，都放得下。）
   ⇒ 两处一起收：值 18 → 17px（比值仍是 17 ÷ 11.5 ＝ **1.48×**，命定那套是 1.5×，层级没丢）、
     格子左右内边距 9 → 7px。格内可用回到 118px，17px 的值约 113px，**留 5px 余量**。
   ⚠ 断点用现成的 430（和页签那条同一档），不新开第三个数 —— 全文件的宽度分界只有
     860 / 430 两条，多一条就要多一处解释。 */
@media (max-width: 430px) {
  .yh-sb .yh-stat-v { font-size: 17px; }
  .yh-sb .yh-stat { padding: 5px 7px; }
}
/* 🔴 16px → 15px（2026-09-27）：`240% / 300%` 在 900 档那格（3 列 · 124.33px）
   实测溢出 **2px** —— 探针报 `{"谁":"stat-v","文":"240% / 300%","溢":2}`。
   16px 下这串要 108px、格内可用只有 106px。降到 15px ⇒ 约 101px，留 5px 余量。
   ⚠ **不靠折行把溢出藏起来**（那正是上一版的做法，代价是那格变三行、旁边两格一行，一排高低全乱）。
   ⚠ 也别去动 `.yh-stat` 的 `flex-basis: 120px`：提到 128px 会让 900 档从 3 列掉到 2 列，
     五维卡多出一行、整页长 30px —— 为 2px 付这个代价不值。
   ⚠ 为什么 16 当初是错的：那一档是想让「值比卡头重」，可**状态页的卡头走 `.yh-gn`（11.5px）**，
     不是条目卡的 `.yh-c-n`（15.5px）—— 15px 依然远大于 11.5px，层级一点没丢。
   ⚠ **2026-09-27 二改：这条 `15px` 的覆盖整个删了** —— 字号统一由上面那条给 18px。
     理由：行式格（五维/三抗/心智/成长）和列式格（无标签的）**不该有两档字号**，
     那正是"同一组里读数方式不一致"的另一面。 */
/* `.yh-stat-w`（放不下的格独占一行）**已撤**，连同它的 `标长格()` / `挂盯宽()`。
   完整原因（`grid-column-end` 语义用错 ＋ 探针只验一侧 ＋ 为什么不需要这个类）
   在上面那条墓碑里，**这里不再抄一份**。 */

/* ── 组名（状态页的分组抬头）─────────────────────────────────────────────
   命定 `.sectionTitle`：`inline-flex; gap:7px; 12px/700` ＋ 前面一个 15px 图标。
   图标是这一组的**视觉锚点** —— 五组竖着排，光靠字要一行行读，有图标能直接跳到那组。 */
.yh-sb .yh-gn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--p-ink);
  font-size: var(--fs-1);
  font-weight: 700;
  letter-spacing: .02em;
}
.yh-sb .yh-gn .yh-i { color: var(--c-main); opacity: .85; }

/* ── 详情层：**取代**内容区（不是盖在上面）────────────────────────────────
   🔴 不用 `position: fixed` —— 本页是楼层内嵌 iframe，`fixed` 的参照系是 iframe 自己。
   🔴 定位父是 `.yh-pane`（内容区），且**参与正常流**（`position: relative`，不是 absolute）。
      这条是量出来的，改了两轮：
      · 第一版：挂**面板** ＋ `absolute; inset:0` ＋ `align-items:flex-end` ⇒
        顶部留一条 26.25px 的遮罩带，带里**正是页眉带被拦腰切掉下半截的字**。
      · 第二版：挂内容区 ＋ 仍是 `absolute` 铺满 ⇒ 遮罩带 0 了，**但换了个病**：
        内容区只有 110px 高，而详情内容要 155.25px ⇒ **详情盒内部可滚**。
      ⇒ 根治：打开详情时**列表让位**（`.yh-grid` 抽走），详情层**撑开内容区**。
   🔴 因此**没有遮罩** —— 遮罩是「列表还在、只是被压暗」的产物。列表都抽走了，
      一层半透明黑只会叠在面板底色上、把详情整体压暗。 */
.yh-sb { position: relative; }
.yh-sb .yh-pane { position: relative; }
.yh-sb .yh-pane:has(.yh-ovl) > .yh-grid { display: none; }
/* 详情打开时**内容区自己的 padding 归零** —— 否则 sheet 被内缩一圈，
   而 sheet 抬头/正文里**各自又有一份 `--pad-x`** ⇒ 左右边距是卡片的两倍。 */
.yh-sb .yh-pane:has(.yh-ovl) { padding: 0; }
.yh-sb .yh-ovl { position: relative; display: flex; }
.yh-sb .yh-sheet {
  width: 100%;
  display: flex;
  flex-direction: column;
  background: var(--p-card);
  /* 🔴 **不画 border-top、不打上阴影** —— sheet 顶边正好落在页签条那条 1px 底边下面，
     再加一条边就是**两道线贴在一起**（2px 灰杠）。上边界由页签条自己的 border-bottom 顶着。 */
  animation: yh-浮现 .18s ease;
  outline: none;
}
.yh-sb .yh-sh-h {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--pad-x) var(--sp-2);
}
/* 「← 返回」—— 照命定图 3 的「< 返回关系列表」：**它是详情页的入口动作**，
   放在最左、与标题同排。⚠ `aria-label` 必须**包含**可见文字（WCAG 2.5.3）：
   可见是「← 返回」，无障碍名就必须以「返回」打头。 */
.yh-sb .yh-sh-x {
  font: inherit;
  font-size: var(--fs-1);
  line-height: 1.5;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  /* 🔴 **命中高度 44px**（2026-09-28 补）—— 同 `.yh-tab` 那条，依据是创世回廊
     `DESIGN.md` 明写的「主要操作至少 44px 触控高度」。**返回键是详情页唯一的出口动作**，
     属主要操作。
     📐 实测（`_量分栏.mjs` 的详情段，2026-09-28 加）：改之前九处全是
       **`29.25×64`** —— 5 ＋ 行高17.25 ＋ 5 ＋ 上下描边2。
       对照：命定 `DetailSheet` 的关闭键 `@include delete-button-base(32px)` ＝ **32px**；
       创世 `.back-button { min-height: 44px }`。
       **29.25 比命定的 32 还矮 2.75px** —— 连"照命定做"这条口径都够不上。
     ⚠ 代价：`.yh-sh-h`（抽屉抬头）49.25 → 64px，抽屉整体 +14.75px。
       抬头本来就是"标题 ＋ 一个动作"的一行，44 的按钮在这行里是正常尺寸，
       不是异形（创世 `.detail-tabs button` / `.viewer-back` 都这么写）。 */
  min-height: 44px;
  margin-left: -10px;
  background: color-mix(in srgb, var(--p-ink) 5%, transparent);
  border: 1px solid var(--p-line3);
  border-radius: var(--r-pill);
  color: var(--p-ink2);
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s ease, border-color .15s ease;
}
.yh-sb .yh-sh-x:hover,
.yh-sb .yh-sh-x:focus-visible { background: color-mix(in srgb, var(--p-ink) 9%, transparent); border-color: var(--p-line2); color: var(--p-ink); }
/* 🔴 **焦点圈要走本层的颜色**（2026-09-28 补）—— 不写 `outline` 就会落到浏览器默认的
   黑圈上：实拍 390 档「目标」那一签，选中态外头套着一圈**纯黑的方框**，跟暖米纸完全不是
   一套东西。三家参考卡**没有一家用默认圈**：
     · 月痕自己（`.yh-card:focus-visible`）＝ `outline: 2px solid var(--c-main); outline-offset: 1px`
     · 创世 `named-inner-voice__trigger` ＝ `outline: 1px dashed currentColor; outline-offset: 3px`
     · 命定 `.selectable-card` ＝ `box-shadow: 0 0 0 3px rgba(212,175,55,.22)`
   ⇒ 照**月痕自己那条**抄（同色系统、同粗细），不另起一套。 */
.yh-sb .yh-sh-x:focus-visible,
.yh-sb .yh-sh-tab:focus-visible {
  outline: 2px solid var(--c-main);
  outline-offset: 1px;
}
.yh-sb .yh-sh-t {
  font-size: var(--fs-3);
  font-weight: 700;
  color: var(--p-ink);
  line-height: 1.3;
  min-width: 0;
  word-break: break-word;
}
/* ══ 详情层的子页签条（2026-09-28 加 · 任务 #14「详情里再分子页签」）════════════
   成法 ＝ 命定 `pages/destiny/DestinyTab.module.scss` 的 `.partnerDetailNav` ＋
   `.partnerDetailTab` ＋ `.partnerDetailTabActive`（配 `DestinyTab.tsx` 的
   `renderActivePartnerDetailContent()`）。三条要点：
     ① **等分网格，不是可滚动条** —— 命定 `display:grid;
        grid-template-columns:repeat(auto-fit, minmax(72px,1fr)); gap:6px; padding:4px;`
        签少时自动拉宽、签多时自动换行 ⇒ **不需要"滚动提示"那套**（在暖米纸上很脏）。
     ② **未选中的签是"透明底 ＋ 一条凹槽托着"**，选中的才有边有底
        —— 命定 `.partnerDetailTab` 是 `background:transparent; border:1px solid transparent`，
        `.partnerDetailTabActive` 才给 `border-color + background + color + box-shadow: inset 0 1px 0`。
        **那个 `inset 0 1px 0` 是内顶高光**（＝本层的 `--p-hi`），不是投影。
     ③ 🔴 **只渲染选中那一节**（命定 `activePartnerDetailSection === 'overview' && (…)`），
        **不是「全画出来再藏起来」** —— 藏起来的内容照样进 DOM、照样被读屏念出来。
   🔴 **高度 44px**（驾驶员 2026-09-28 指定）。⚠ 命定自己的 `.partnerDetailTab` 只有
     `padding:8px 12px` ＋ 12px 字 ≈ **33px** —— **44 这里不照抄命定**，依据是创世
     `DESIGN.md` 明写的「主要操作至少 44px 触控高度」，而详情层里"换一节"是主要操作。
     （同 `.yh-sh-x` 返回键那条口径：命定 32 / 创世 44 ⇒ 取 44。）
   ⚠ **不许 `nowrap + ellipsis`** —— 签题是模型写的字段名（「当前节点」这类），
     截成「当前…」就读不出来了。判据同全局那条：**宁可整格折行，不许压字**。
   🔴 **本层不照抄命定的 `grid` ＋ `1fr`**（2026-09-28 实拍后改）——
     命定写的是 `display:grid; grid-template-columns:repeat(auto-fit, minmax(72px,1fr))`，
     **`1fr` 会让签拉满整格**。命定恒有 7 个签，所以每个 ≈ 72~123px，看不出问题；
     月痕的签数**是数据决定的**，任务页只有 2 个 ⇒ 900 档实拍出来是**两块 405px 宽的
     空板**，中间两个字（见 `_轮110/_分栏_分栏①对齐_任务详情_目标_宽.png`）。
     `1fr` 是那条成法的**前提**（签多）在兜着，前提不成立就得把上限自己封上。
   ⇒ 改成 `flex` ＋ `flex: 1 1 72px` ＋ **`max-width: 160px`**：
     · `min-width: 72px` 保住命定那条下限（要的是**放不下就整签换行，不是压字**）
     · `max-width: 160px` 封顶（命定自己的签最大也就 ~123px，160 已在它的量级里）
     · `justify-content: center` —— 签不满一行时居中，读作"一条居中的分段控件"，
       而不是"左边挤着两个、右边空一片"
     ⚠ 390 / 320 档签数少时（2 个）本来就长不到 160，**行为与命定一致**；
       只有 900 档的少签情形和它不同 —— **这正是唯一需要不同的地方**。 */
.yh-sb .yh-sh-nav {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  padding: 4px;
  margin: 0 var(--pad-x) var(--sp-2);
  border: 1px solid color-mix(in srgb, var(--p-ink) 10%, transparent);
  /* 凹槽底（`--p-well`）—— 同进度条轨道那套，让**没选中的签看起来是"陷进去的"** */
  background: var(--p-well);
  border-radius: var(--r-2);
}
.yh-sb .yh-sh-tab {
  font: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  /* 🔴 `1 1 72px` ＋ `min-width` ＋ `max-width` —— 三条缺一条都会翻车：
     · 只写 `1 1 72px`：`flex-shrink:1` 会让签**缩到 72px 以下**去挤一行 ⇒ 压字
     · 少了 `max-width`：签数少时拉成空板（就是上面那条）
     · 少了 `min-width`：同上，shrink 没有地板 */
  flex: 1 1 72px;
  min-width: 72px;
  max-width: 160px;
  min-height: 44px;
  padding: 4px 10px;
  border: 1px solid transparent;
  border-radius: var(--r-1);
  background: transparent;
  color: var(--p-ink3);
  font-size: var(--fs-1);
  font-weight: 600;
  line-height: 1.25;
  text-align: center;
  word-break: break-word;
  cursor: pointer;
  transition: background .15s ease, border-color .15s ease, color .15s ease;
}
.yh-sb .yh-sh-tab:hover,
.yh-sb .yh-sh-tab:focus-visible {
  background: color-mix(in srgb, var(--p-ink) 6%, transparent);
  color: var(--p-ink2);
}
.yh-sb .yh-sh-tab-on {
  border-color: color-mix(in srgb, var(--p-ink) 16%, transparent);
  background: var(--p-raise);
  color: var(--p-ink);
  /* 内顶高光 —— 同卡片的 `--p-hi`，**不是投影**（命定那句 `inset 0 1px 0` 就是它） */
  box-shadow: inset 0 1px 0 var(--p-hi);
}
.yh-sb .yh-sh-b {
  overflow-y: auto;
  overscroll-behavior: contain;   /* 万一超长要内部滚，别把聊天页带着一起滚 */
  /* 🔴 **自定义滚动条**（2026-09-28 补）—— 依据 ＝ 命定 `shared/styles/_mixins.scss`
     的 `custom-scrollbar` mixin，它**给每一个滚动容器都挂**（`ContentArea` 等）：
       `scrollbar-width: thin; scrollbar-color: <thumb> transparent;`
       `&::-webkit-scrollbar { width: 6px }  &::-webkit-scrollbar-thumb { border-radius: 3px }`
     为什么必须有：默认的 Chrome 滚动条是**浅灰底 ＋ 上下箭头按钮 ＋ 15px 宽**的
     OS 控件 —— 贴在一张暖米纸的抬升卡上，它读起来是个**外来零件**，而且**吃掉 15px 内宽**，
     让正文的右边距比抬头窄一截（抬头吃 `--pad-x`，正文吃 `--pad-x` ＋ 被滚动条再挤）。
     ⚠ 颜色不抄命定的 `--theme-window-border`（那是它的深色窗口边），
       走月痕自己的墨色淡洗 —— 和全卡其它线条同一套 `color-mix(--p-ink)`。
     ⚠ `::-webkit-scrollbar` 是**非标准**选择器（Chrome/Safari/Edge 认），
        Firefox 认上面那两条标准的 ⇒ 两条腿都要写，缺一条就在某个浏览器上退回默认样式。 */
  scrollbar-width: thin;
  scrollbar-color: color-mix(in srgb, var(--p-ink) 22%, transparent) transparent;
  padding: 0 var(--pad-x) var(--sp-3);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}
.yh-sb .yh-sh-b::-webkit-scrollbar { width: 6px; height: 6px; }
.yh-sb .yh-sh-b::-webkit-scrollbar-track { background: transparent; }
.yh-sb .yh-sh-b::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--p-ink) 22%, transparent);
  border-radius: 3px;
}
/* 详情层的字段 —— **标签在左、值在右**（同卡内那条，理由见上） */
.yh-sb .yh-f {
  display: grid;
  grid-template-columns: minmax(56px, auto) minmax(0, 1fr);
  gap: 3px var(--sp-3);
  align-items: baseline;
}
.yh-sb .yh-f .yh-v { white-space: pre-wrap; }
.yh-sb .yh-f .yh-v { color: var(--p-ink); font-size: var(--fs-2); word-break: break-word; }
.yh-sb .yh-f .yh-k { color: var(--p-ink3); font-size: var(--fs-1); font-weight: 600; white-space: nowrap; }
/* 🔴 **2026-09-27 删掉了 `@media (max-width: 540px)` 把 `.yh-f` 压成一列那条。**
   它让「标签 | 值」变成「标签一行、值一行」—— 390 档一张任务卡的元数据从 3 行涨到 6 行，
   卡片高度几乎翻倍，而 390 的竖向空间恰恰是最紧的。实测量过，**根本不需要降级**：
   内容区 363px，首列下限 56px（最长的标签「当前节点」4 字约 46px，被下限托到 56）＋ 间距 12px，
   值还剩 295px —— `1916年3月5日` 只要约 100px。
   ⚠ 320 档同理（296 − 56 − 12 = 228px），也没压字。
   ⇒ 判据：**两列放得下就别降成一列** —— 降级的代价是双倍高度，比"标签值挨得近"贵得多。
      真要降级也得让量测的压字探针先报出来，不许凭"窄屏应该更保守"的直觉先斩后奏。 */
/* 详情层里的正文块 —— 长文本整幅宽（驾驶员点名要的"长文本要整幅宽"） */
.yh-sb .yh-body { display: flex; flex-direction: column; gap: var(--sp-3); }
.yh-sb .yh-meta {
  display: flex;
  flex-wrap: wrap;
  /* ⚠ 列距 24 → 8px（2026-09-28 改）：胶囊自带 999px 圆边，**自己就是一格**，
     间距再留 24px 就散成几座孤岛（同命定 `.itemMeta { gap: $spacing-xs }`）。 */
  gap: var(--sp-1);
  padding-bottom: var(--sp-3);
  border-bottom: 1px solid var(--p-line3);
}
/* 🔴 **胶囊分层**（2026-09-28 重做。驾驶员原话：「**短字段（现在的元数据带）他们怎么做
   的你就怎么做，而且他们不是胶囊分层吗？**」）
   ─────────────────────────────────────────────────────────────────────────
   ⚠ **上一版这里写着「这个组件是我自创的 …… 命定 `DetailSheet` 只有 header/title/
     subtitle/body，没有元数据带，这一处没有成法可抄」—— 那句话是错的，这条注释
     连同它下面那套自创的样式一起作废。** 命定确实有成法，我上一轮**只翻了
     `DetailSheet.module.scss` 一个文件就下了结论**，没往用到它的地方看。
   成法在 **`shared/components/ItemDetail/ItemDetail.module.scss`** 的三件套：
     · `.itemMetaBadge`  —— 一颗胶囊 ＝ `inline-flex; align-items:center; gap:6px;
        min-height:22px; padding:3px 8px; border:1px solid color-mix(card-border 72%,transparent);
        border-radius:999px; background:color-mix(window-bg 18%,transparent)`
     · `.itemMetaLabel`  —— 标签：`10px; color:muted; uppercase; letter-spacing:.5px`
     · `.itemMetaValue`  —— 值　：`11px; font-weight:600; color:secondary`
     （调用处 `ItemDetail.tsx` 的 `renderMeta()`：`<span class=itemMetaBadge><span class=itemMetaLabel>
       {label}</span><span class=itemMetaValue>{value}</span></span>`）
   ⇒ 三条要点，缺一条就不是那个东西：
     ① **胶囊贴合内容**，不是等宽格；
     ② **`border-radius: 999px`**，真胶囊，不是小圆角方框；
     ③ **分层靠"值比标签更重、更亮"**（命定 400 → 600，muted → secondary）。
   🔴 **月痕原来是反的**：`.yh-k` 是 `600`、`.yh-v` 是 `400` —— **标签比值还重**；
      再叠上 `.yh-f` 的 `grid; grid-template-columns: minmax(56px,auto) …`，
      一颗颗胶囊被 56px 的首列下限撑成**等宽的表格格** ⇒ 读起来是表，不是胶囊。
      **这正是驾驶员说的"没有把各种分开"。**
   ⚠ **只改详情层这一处**（`.yh-meta > .yh-f`）。卡内那条标签值行照旧走 `grid` 两列对齐
     —— 那是"扫一眼比大小"要的（值的位置必须纵向对齐），**两处诉求不同，别合并**。
   ⚠ 尺寸按本层自己的字号档放大（命定 22px/10px/11px ⇒ 本层 24px/11.5px/13.5px），
     **不抄它的绝对像素** —— 两套字号阶梯不一样，照抄会让胶囊比卡内正文还小一号。
   🔴 原来那条「格子**不缩**、放不下就整格折行」的判据**照旧有效**，`flex: 0 0 auto` 保留：
     实测过 `flex:1 1 0` 会把值缩到比字形还窄、直接印在后缀上。 */
.yh-sb .yh-meta > .yh-f {
  flex: 0 0 auto;
  min-width: 0;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 24px;
  padding: 3px 10px;
  border: 1px solid color-mix(in srgb, var(--p-ink) 14%, transparent);
  border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--p-ink) 4%, transparent);
}
.yh-sb .yh-meta > .yh-f > .yh-k {
  color: var(--p-ink3);
  font-size: var(--fs-1);
  font-weight: 400;
  letter-spacing: .04em;
}
.yh-sb .yh-meta > .yh-f > .yh-v {
  color: var(--p-ink);
  font-size: var(--fs-2);
  font-weight: 700;
}

/* 详情层现身 —— 只有 2px 位移，主戏是淡入（详情层是"在同一位置替换列表"，不是从下面来） */
@keyframes yh-浮现 { from { transform: translateY(2px); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div class="yh-sb"><span class="yh-d">楼层状态栏 · 正在读…</span></div>
<script type="module">
/* ══════════════════════════════════════════════════════════════════════════
   骨架 v0.0.8 · 轮 1-10（视觉重做 ＋ 主线/连携补出图）
   ══════════════════════════════════════════════════════════════════════════ */
const 版本 = 'v0.0.8';
const 单例键 = '__yuehenStatusBar__';

/* ── 页表 ────────────────────────────────────────────────────────────────
   6 页照 `_小手机与楼层状态栏方案.md` §3.6；**未建的写「未开放」**。
   ⚠ 「未开放」是**要长期保留的真实状态**（地图页**在本卡内永远是它** —— 1-9 定的性，§3.6.1），
     不是临时占位。 */
const 页表 = ['状态', '在场', '主线', '任务', '连携', '地图'];
const 已建 = { 状态: true, 在场: true, 主线: true, 任务: true, 连携: true };
let 当前页 = '状态';
let 最后行 = null;   // 🔴 切页重画用它 —— **不重读快照**（重读会多打一次 MVU 接口）
// 🔴 **展开状态保持**（轮 1-8）—— `画()` 是整框重建，不记就会「点开一刷新就弹回去」。
//    存的是**连携名**（字典的键），不是下标 —— 重排之后下标会串位，名字不会。
//    ⚠ 与 1-4 的 `当前页` 同构：模块级一份、跨重画活着；**页签**那一半归轮 1-10。
const 展开的 = new Set();

/* ── 0. 小工具 ─────────────────────────────────────────────────────────── */

// 取一个全局：先看自己这一层，再看上一层。
// ⚠ 酒馆助手把 API 注入**消息楼层 iframe**（C1 §3）；但版本差异下未必都在本层 ⇒ 往上找一层。
function 取全局(名) {
  try { const v = window[名]; if (typeof v !== 'undefined' && v !== null) return v; } catch (_) {}
  try { const v = window.parent[名]; if (typeof v !== 'undefined' && v !== null) return v; } catch (_) {}
  return undefined;
}
const 睡 = (毫秒) => new Promise((r) => setTimeout(r, 毫秒));

/* ── 1. 去重（照 C2 §5.6 的思路：**优先保自己**）────────────────────────
   swipe / edit 会再注入一个 iframe；不处理就是同一楼两个框。
   只删**同一楼里带 .yh-sb 的同类 iframe**，不碰别的东西。

   🔴 **必须等 `.yh-sb` 画出来之后再调**。它不在壳里、在托管那份真身里 ——
      壳一跑就调去重，此刻 iframe 里只有一段 `<script>`、`.yh-sb` 还不存在，
      同类框数永远是 0 ⇒ **去重静默失效、一个框都不删**（看着像"没触发"，其实是从没生效）。
      ⇒ 由 `画()` 末尾触发（画完必调），另外挂两个延时兜底。 */
function 去重() {
  try {
    const 我 = window.frameElement;
    if (!我 || !我.closest) return;
    const 楼 = 我.closest('.mes');
    if (!楼) return;
    const 同类 = [];
    const 全部 = 楼.querySelectorAll('iframe');
    for (let i = 0; i < 全部.length; i++) {
      try {
        const d = 全部[i].contentDocument;
        if (d && d.querySelector('.yh-sb')) 同类.push(全部[i]);
      } catch (_) { /* 跨源读不到就跳过 */ }
    }
    if (同类.length <= 1) return;
    const 留 = 同类.indexOf(我) >= 0 ? 我 : 同类[同类.length - 1];
    for (const x of 同类) if (x !== 留) x.remove();
  } catch (_) {}
}

/* ── 2. 等 Mvu 就绪 ─────────────────────────────────────────────────────── */
async function 等Mvu(毫秒) {
  if (取全局('Mvu')) return true;
  const 等 = 取全局('waitGlobalInitialized');
  if (typeof 等 === 'function') {
    try { await Promise.race([等('Mvu'), 睡(毫秒)]); } catch (_) {}
  }
  return !!取全局('Mvu');
}

/* ── 3. 取本楼楼号 ──────────────────────────────────────────────────────── */
function 取楼号() {
  const f = 取全局('getCurrentMessageId');
  if (typeof f !== 'function') return { 楼: null, 报: '这一层没有 getCurrentMessageId' };
  try {
    const n = f();
    if (typeof n !== 'number' || !isFinite(n)) return { 楼: null, 报: 'getCurrentMessageId 返回的不是数字：' + String(n) };
    return { 楼: n, 报: null };
  } catch (e) {
    return { 楼: null, 报: 'getCurrentMessageId 抛错：' + (e && e.message ? e.message : e) };
  }
}

/* ── 4. 读那一楼自己的快照（只有两条路，第三档是报错）─────────────────── */
function 读快照(楼) {
  const 报 = [];
  const 选 = { type: 'message', message_id: 楼 };   // 🔴 楼号必带 —— 这是全部的重点

  const M = 取全局('Mvu');
  if (M && typeof M.getMvuData === 'function') {
    try {
      const d = M.getMvuData(选);
      if (d && typeof d === 'object') return { 路: 'Mvu.getMvuData', 数据: d, 报 };
      报.push('Mvu.getMvuData 返回的不是对象');
    } catch (e) { 报.push('Mvu.getMvuData 抛错：' + (e && e.message ? e.message : e)); }
  } else {
    报.push('这一层没有 Mvu');
  }

  const G = 取全局('getVariables');
  if (typeof G === 'function') {
    try {
      const d = G(选);
      if (d && typeof d === 'object') return { 路: 'getVariables', 数据: d, 报 };
      报.push('getVariables 返回的不是对象');
    } catch (e) { 报.push('getVariables 抛错：' + (e && e.message ? e.message : e)); }
  } else {
    报.push('这一层没有 getVariables');
  }

  return { 路: null, 数据: null, 报 };
}

/* ── 5. 取值 —— 逐层防御 ─────────────────────────────────────────────────
   🔴 这里防的是「**形状没验过**」，不是「内容会不会错」。
      轮 1-2 只验到 `数据.stat_data` 有 6 个顶层键 —— 那是**本地假 shim 造的形状**
      （`_435干跑.mjs`）；真机上 `Mvu.getMvuData` 到底回什么，**没验过**（方案 §5 头号风险）。
      ⇒ 只判**类型/结构**，任何一层不对就返回 undefined，**绝不抛错**。
   ⚠ **不判取值范围、不判枚举** —— 那是 zod 的活（schema 里全是 clamp/catch），
      在这儿再判一遍是重复投入，还会把 zod 已经修好的值误报成「读不到」。 */
function 取(对象, 路) {
  let 当 = 对象;
  for (const 段 of 路) {
    if (当 === null || typeof 当 !== 'object') return undefined;
    当 = 当[段];
  }
  return 当;
}
const 是串 = (v) => typeof v === 'string';
// `是数` 允许小数 —— 三值/三抗/理智/理智稳定性/人性/月蚀度/晋升进度/进度满值 在 schema 里都是 `数`
const 是数 = (v) => typeof v === 'number' && isFinite(v);
const 是整 = (v) => 是数(v) && Math.trunc(v) === v;

// 给失败路径用：把读到的对象缩成一小段能看的字（免得画出 "object Object"）
function 摘要(v) {
  try {
    const s = JSON.stringify(v);
    if (typeof s !== 'string') return String(v);
    return s.length > 200 ? s.slice(0, 200) + '…' : s;
  } catch (_) { return String(v); }
}

/* ── 6. 四个格子（顶部常驻条，轮 1-3 的东西，一个字没改）─────────────────
   每格自己负责「不对就说读不到」—— **一格坏不塌整条**（C2 §7.2）。
   返回 { 类: '好'|'未定'|'坏' }，怎么显示由 画() 定。 */
const 好 = (文) => ({ 类: '好', 文 });
const 坏 = () => ({ 类: '坏', 文: '读不到' });
/* 好对(签, 值, 副) —— 跟 好() 唯一的差别是**多带两个字段**：
   `文` 仍然是拼好的整串（**文本层一个字不变**），`签`/`值` 只给渲染层用。
   🔴 字段名**不能叫 `名`** —— 本文件 `行.sort(... a.名 ...)` 那批条目对象上已经有了
   （⚠ 原文写的是"第 644 行"，我自己加了三行就把它顶歪了 ⇒ 改成指认写法，不再写行号）。
   🔴 `副`（2026-09-28 加）＝ 值的**品阶/状态**。依据 ＝ 命定 `StatusTab.module.scss`
   `.heroTitleRow` 的成法：`heroLevel`(26px/800) 在上、`heroTier`(15px/700) 在**下一行** ——
   **数值和它的品阶是上下两行，不挤在一行**。月痕「月蚀度 66（蚀刻）」走这条。
   ⚠ `文` 照旧拼成 `签 值（副）`，一个字不变 —— 它是**文本层的兜底**，
     渲染层只有在 `值 == null` 时才回落到它。 */
const 好对 = (签, 值, 副) => ({ 类: '好', 文: 签 + ' ' + 值 + (副 == null ? '' : '（' + 副 + '）'), 签, 值, 副 });

/* 装格(盒, g) —— 5 个渲染点共用的**唯一一处**格子渲染逻辑。
   有 `签`/`值` ⇒ 拆成两个 span（CSS 才能分别调字号与颜色）；
   没有 ⇒ 落兜底，`textContent = g.文`，**与重构前逐字相同**（时刻/地点/字典键那批走这条）。 */
const 装格 = (盒, g) => {
  if (g.签 != null && g.值 != null) {
    const a = document.createElement('span'); a.className = 'yh-k'; a.textContent = g.签;
    const b = document.createElement('span'); b.className = 'yh-v'; b.textContent = g.值;
    // 🔴 中间那个空格**不是排版用的，是给文本层的** —— 直接 `append(a, b)` 会让
    //    textContent 从 `HP 412/500` 变成 `HP412/500`，屏幕阅读器会念成一串
    //    （第 1092-1094 行已经专门记过这个坑）。空格同时充当名值之间的间隙。
    盒.append(a, ' ', b);
  } else {
    盒.textContent = g.文;
  }
  return 盒;
};

// 历法 —— 卡文（世界书 `1090` 历法系统）：新月历 · 元年 1 月 1 日 ＝ 星期一 · 每月固定 30 天。
// 🔴 卡文点名「换日时必须同时改 `星期`……这是本卡最容易犯的错」⇒ 四个格子**都要画出来**，
//    画全了驾驶员一眼就能看出「日改了星期没改」。
function 格历法(世) {
  const 历 = 取(世, ['历法']);
  if (历 === null || typeof 历 !== 'object') return 坏();
  const 年 = 取(历, ['年']), 月 = 取(历, ['月']), 日 = 取(历, ['日']), 星 = 取(历, ['星期']);
  if (!是整(年) || !是整(月) || !是整(日) || !是串(星)) return 坏();
  return 好对('新月历', 年 + '年' + 月 + '月' + 日 + '日 · ' + 星);
}

// 时刻 —— 卡文（`9900044`）：「24 个标准魔导时（对应 60 分/3600 秒）」；
// 🔴「**账本上只记数字**」＋「清晨/傍晚是**叙事用语**……**别写进这一格**」
//    ⇒ 条上照钟点画，不画时段词（钟点才是对原文最贴的读法，方案 §2 注）。
// 补零两位：这一行每回合都要扫，不该因位数变化而跳字（口径 ②）。
function 格时刻(世) {
  const 时 = 取(世, ['时刻']);
  if (!是整(时)) return 坏();
  return 好((时 < 10 ? '0' : '') + 时 + ':00');
}

// 地点 —— 卡文：层级 **大区 → 地点** 两层；`大区` 空串 ＝ 不在任何已生成大区内。
// 🔴 空串**有含义**，不是「没数据」⇒ 大区空就只画地点（口径 ③）；
//    两个都空才画「未定」—— **不许静默留白**，留白分不清「没设」和「坏了」（口径 ④）。
function 格地点(世) {
  const 大 = 取(世, ['大区']), 地 = 取(世, ['地点']);
  if (!是串(大) && !是串(地)) return 坏();
  const 大串 = (是串(大) ? 大 : '').trim();
  const 地串 = (是串(地) ? 地 : '').trim();
  if (!大串 && !地串) return { 类: '未定', 文: '未定' };
  return 好(大串 && 地串 ? 大串 + ' · ' + 地串 : (大串 || 地串));
}

// 危机 —— 卡文：只写 无/低/中/高/致命 之一，「**这一刻世界有多紧张**」的刻度
//        （遭遇难度读它），**不是剧情、不是任务进度**。
// ⚠ **本轮纯文字不上色**：「危险该是什么颜色」是审美判断，归轮 1-10（口径 ⑤）。
function 格危机(世) {
  const 危 = 取(世, ['危机']);
  if (!是串(危) || !危) return 坏();
  return 好对('危机', 危);
}

/* ── 7. 「状态」页 —— 5 组 15 格（轮 1-4 新增）──────────────────────────
   全部取自 `zod_schema.js` 的 `主角`，**没有新变量**。
   取值根 ＝ `stat_data.主角`。每格自己判、自己降级；**一格坏不塌一组，一组坏不塌一页**。 */

// 一组 ＝ 一个标签 ＋ 若干格。**容器不是对象 ⇒ 整组一格「读不到」**（不逐格刷四遍"读不到"）。
function 组(标签, 容器, 造格) {
  if (容器 === null || typeof 容器 !== 'object') return { 标签, 格: [坏()] };
  try { return { 标签, 格: 造格(容器) }; }
  catch (_) { return { 标签, 格: [坏()] }; }   // 🔴 造格自己抛错也只塌这一组
}

// 三值 —— 格式照卡文 `254984` 五、2 的 `<battle_status>` 原文：`HP <x>/<y>`
// 🔴 **两个都要是数才画**：只画 `HP 88` 会让人以为上限不重要，而它恰恰是必读的一半
//    —— 依据 `D135` ③「**宁可空着，不许猜**」。
const 值对 = (三, 名) => {
  const 当前 = 取(三, [名, '当前']), 上限 = 取(三, [名, '上限']);
  if (!是数(当前) || !是数(上限)) return 坏();
  return 好对(名, 当前 + '/' + 上限);
};
const 组三值 = (主) => 组('三值', 取(主, ['三值']),
  (c) => [值对(c, 'HP'), 值对(c, 'MP'), 值对(c, 'SP')]);

// 五维 —— 卡文光给值、**没给格式** ⇒ 这一层写法是我拟的（单字照 schema 字段名）
const 组五维 = (主) => 组('五维', 取(主, ['五维']),
  (c) => ['力', '敏', '体', '智', '魅'].map((k) => (是整(取(c, [k])) ? 好对(k, String(取(c, [k]))) : 坏())));

// 三抗 —— 卡文 `9900031` 四、「三抗性各按它的构造定，**落 0%~100%**」⇒ **带 `%`**
const 组三抗 = (主) => 组('三抗', 取(主, ['三抗']),
  (c) => ['物理', '魔法', '污染'].map((k) => (是数(取(c, [k])) ? 好对(k, 取(c, [k]) + '%') : 坏())));

// 心智 —— 🔴 `理智上限` 是**字符串枚举** `'100'|'90'|'70'|'40'`，**不是数**！
//         拿「是数字吗」判它 ⇒ 永远判不过 ⇒ 那格永远「读不到」，**还不报错**。
//         `理智稳定性` 照 `254984` 二、2 的原词（⚠ `调整值` 底下那个叫 `稳定性`，**是另一格**，别混）。
const 组心智 = (主) => 组('心智', 取(主, ['心智']), (c) => {
  const 理智 = 取(c, ['理智']), 上限 = 取(c, ['理智上限']);
  const 稳定 = 取(c, ['理智稳定性']), 人性 = 取(c, ['人性']);
  const 月蚀 = 取(c, ['月蚀度']), 阶段 = 取(c, ['月蚀度阶段']);
  return [
    (是数(理智) && 是串(上限) && 上限) ? 好对('理智', 理智 + '/' + 上限) : 坏(),
    是数(稳定) ? 好对('理智稳定性', String(稳定)) : 坏(),
    是数(人性) ? 好对('人性', String(人性)) : 坏(),
    // 🔴 **2026-09-28 改：阶段从「值串里」挪成「副行」**（驾驶员裁定「用命定」）。
    //    原文是 `好对('月蚀度', 月蚀 + '（' + 阶段 + '）')`，量出来一格要 136.09px、
    //    而 900 档那格只有 104px ⇒ 整串折行、格子高一倍、右半边三分之二全空。
    //    病根是**全角括号**：`（蚀刻）` 这 4 个字符每个都是 18px 满宽 ＝ 72px，
    //    占了 104px 格宽的 **69%** —— 而真正的数字 `66` 只占 20px。
    //    ⇒ 照命定 `.heroTitleRow`（数值上、品阶下）拆成两行后：格需 71.3px，余 33px。
    //    ⚠ 判据 `(是数(月蚀) && 是串(阶段) && 阶段)` **一个字没动** —— 这次只改呈现，
    //      不改"什么算读得出"。缺阶段仍然整格判坏，跟以前一样。
    (是数(月蚀) && 是串(阶段) && 阶段) ? 好对('月蚀度', String(月蚀), 阶段) : 坏(),
  ];
});

// 成长 —— 格式照卡文 `9900037` 七、字段化**原文**：`初次写全: 阶位 2 · 晋升进度 40% / 200%`
//        ⚠ `进度满值` **我不算**（卡文 `9900044` 五、：「`进度满值` 是**只读的**」）⇒ 直接读变量。
const 组成长 = (主) => 组('成长', 主, (c) => {
  const 阶 = 取(c, ['阶位']), 进 = 取(c, ['晋升进度']);
  const 满 = 取(c, ['进度满值']), 点 = 取(c, ['属性点']);
  return [
    是整(阶) ? 好对('阶位', String(阶)) : 坏(),
    (是数(进) && 是数(满)) ? 好对('晋升进度', 进 + '% / ' + 满 + '%') : 坏(),
    是整(点) ? 好对('属性点', String(点)) : 坏(),
  ];
});

/* ── 7.5 「在场」页 —— 名字 ＋ 好感度（轮 1-5 新增）──────────────────────
   数据根 ＝ `stat_data.角色`，**一个字典：键就是角色名**，值是那一整套角色字段。
   只取两格：键（名字）与 `好感度`。
   🔴 `关系` 那一格**本轮不画** —— §3.6 写的这页只有「名字 ＋ 好感度」（一个不多一个不少）。
   🔴 `在场` / `好感度` 的六档、颜色、间距 —— **全是审美，归轮 1-10**（本轮只到看得见）。 */

// 好感度写法 —— 🔴 正数带 `+`（卡文 `9900042` 三、5：`好感度 −12 → +8`）。
//    ⚠ 减号用 **ASCII `-`**：它要跟数字拼成一体，全角 `−` 排在数字里对不齐。
const 写好感 = (n) => (n > 0 ? '+' : '') + n;

// 名单 —— 挑出在场的人。返回 { 名: [{名, 感}], 坏: [键] }。
// 🔴 判据**只认 `'离队'` 一个串**（其余一律算在场）—— schema 里 `在场` 的默认值就是 `'在场'`，
//    字段缺了算在场，**不静默漏人**。
// 🔴 `在场` 或 `好感度` 读不出来 ⇒ 记进 `坏`（**跳过它，但页脚要报数**，不许静默留白）。
// ⚠ 名字取自 `Object.keys()`：整数-like 的键会被 V8 强制重排到最前（项目踩过这个坑）。
//    角色名是中文，正常不触发；而且下面按好感度**重排**过，这一层不影响最终顺序。
function 取在场(角) {
  const 名 = [], 坏 = [];
  for (const k of Object.keys(角)) {
    const 条 = 角[k];
    if (条 === null || typeof 条 !== 'object') { 坏.push(k); continue; }
    if (取(条, ['在场']) === '离队') continue;      // 🔴 卡文：离队是状态，不是删除理由
    const 感 = 取(条, ['好感度']);
    if (!是数(感)) { 坏.push(k); continue; }
    名.push({ 名: k, 感 });
  }
  // 好感度降序。⚠ `sort` 在 V8 里是**稳定**的 ⇒ 同分的两人保持字典序，位置可复现。
  名.sort((a, b) => b.感 - a.感);
  return { 名, 坏 };
}

// 在场页。`角` 是 `stat_data.角色`；**不是对象 ⇒ 故障态**（与「空」分开画）。
/* ══ 内容区渲染层：卡片 ＋ 池子条 ＋ 详情层 ══════════════════════════════════
   替换 '排版①*.html' 里 画在场 / 画主线 / 画任务 / 画连携 / 画页 五个函数。
   🔴 **数据层（取在场 / 取线 / 取务 / 取连 与它们的全部判据）一个字没动** ——
      本轮只改「怎么画」，不改「读什么、怎么判」。「一个不多一个不少」照旧。

   ── 本轮（2026-09-27 视觉重做）改了什么 ──────────────────────────────────
   上一版是「一行横排流式 ＋ '·' 分隔 ＋ 零圆角零填充」，驾驶员判「命定的你一点没学」。
   读过命定源码后重做的**三件事**：

   ① **卡的形态：横排流式 → 纵向分区**（依据 ＝ 命定 'QuestsTab.module.scss' '.questCard'）
      '卡头（名字 15.5px/700）→ chip 行 → 摘要（左竖条＋clamp 2 行）→ 标签值行'
      横排流式的问题是**所有字段一样重** —— 名字、级别、日期、目标全挤一行，眼睛没有落点。
      分区之后层级是：**名字最重 → chip 次之 → 正文再次 → 元数据最轻**。

   ② **标签在左、值在右**（依据 ＝ 命定 '.basicInfoRow' 'minmax(82px,.24fr) minmax(0,1fr)'）
      上一版标签在上、值在下（竖排）⇒ 一屏十张卡每张长一倍、右半幅全空。
      横排之后卡矮一半，且**标签列在卡内自动对齐成一条竖线**（grid 的列是整卡共享的）。

   ③ **短枚举进 chip、自由文本进摘要**（依据 ＝ 命定 '.buffChipBuff' / '.questProgress'）
      chip 只放**一词自明**的短枚举（进行中 / 已解锁 / 就绪 / 在场）。
      ⚠ '级别'（S/C）与 '类型'（主线）**不进 chip** —— 光一个拉丁字母在胶囊里
        读不出是什么（方案 §3 决策④那条照旧）；"高/中/低"那种词才自明。

   ── 为什么整行是一颗真 '<button>' ────────────────────────────────────────
   · 组件库与方案 §4.3 不变量 6 都要求 **不许 '<div>' 加点击**；
   · 触摸目标 ＝ 整行，不是"名字那三个字"一小块；

     所以不存在 button 套 button（那是无效 HTML）。
     ⚠ 代价：'展开的' Set / '.yh-fb' / '.yh-fold' / 'aria-controls' 这套（轮 1-8 的）
       **整套退役**，由详情层接替 —— 这是升级不是删功能。

   ── 为什么详情层铺满「内容区」而不是 'position: fixed' ───────────────────
   本页是**楼层内嵌 iframe**，'fixed' 的参照系是 iframe 自己。
   🔴 而且详情层**参与正常流**（'position: relative'）不是 'absolute' 铺满 ——
      铺满会把详情压进只有 110px 高的内容区、变成内部滚动，"长文本一次看全"就丢了。 */

/* ── 图标 ──────────────────────────────────────────────────────────────────

   ⚠ 'encodeURIComponent' 编码**整个 SVG 源** —— '#' / '<' / 引号全部转义，
