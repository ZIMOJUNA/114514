<div class="yh-sb"><span class="yh-d">楼层状态栏 · 正在读…</span></div>
<script type="module">
/* ══════════════════════════════════════════════════════════════════════════
   骨架 v0.0.5 · 轮 1-6（页 ·「主线」）
   ══════════════════════════════════════════════════════════════════════════ */
const 版本 = 'v0.0.5';
const 单例键 = '__yuehenStatusBar__';

/* ── 页表 ────────────────────────────────────────────────────────────────
   6 页照 `_小手机与楼层状态栏方案.md` §3.6；**未建的写「未开放」**。
   ⚠ 「未开放」是**要长期保留的真实状态**（地图页到 1-9 也是它，§3.6.1），不是临时占位。 */
const 页表 = ['状态', '在场', '主线', '任务', '连携', '地图'];
const 已建 = { 状态: true, 在场: true, 主线: true };
let 当前页 = '状态';
let 最后行 = null;   // 🔴 切页重画用它 —— **不重读快照**（重读会多打一次 MVU 接口）

/* ── 0. 小工具 ─────────────────────────────────────────────────────────── */

// 取一个全局：先看自己这一层，再看上一层。
// ⚠ 酒馆助手把 API 注入**消息楼层 iframe**（C1 §3）；但版本差异下未必都在本层 ⇒ 往上找一层。
function 取全局(名) {
  try { const v = window[名]; if (typeof v !== 'undefined' && v !== null) return v; } catch (_) {}
  try { const v = window.parent[名]; if (typeof v !== 'undefined' && v !== null) return v; } catch (_) {}
  return undefined;
}
const 睡 = (毫秒) => new Promise((r) => setTimeout(r, 毫秒));

/* ── 1. 去重（照 C2 §5.6 的思路：**优先保自己**）────────────────────────
   swipe / edit 会再注入一个 iframe；不处理就是同一楼两个框。
   只删**同一楼里带 .yh-sb 的同类 iframe**，不碰别的东西。

   🔴 **必须等 `.yh-sb` 画出来之后再调**。它不在壳里、在托管那份真身里 ——
      壳一跑就调去重，此刻 iframe 里只有一段 `<script>`、`.yh-sb` 还不存在，
      同类框数永远是 0 ⇒ **去重静默失效、一个框都不删**（看着像"没触发"，其实是从没生效）。
      ⇒ 由 `画()` 末尾触发（画完必调），另外挂两个延时兜底。 */
function 去重() {
  try {
    const 我 = window.frameElement;
    if (!我 || !我.closest) return;
    const 楼 = 我.closest('.mes');
    if (!楼) return;
    const 同类 = [];
    const 全部 = 楼.querySelectorAll('iframe');
    for (let i = 0; i < 全部.length; i++) {
      try {
        const d = 全部[i].contentDocument;
        if (d && d.querySelector('.yh-sb')) 同类.push(全部[i]);
      } catch (_) { /* 跨源读不到就跳过 */ }
    }
    if (同类.length <= 1) return;
    const 留 = 同类.indexOf(我) >= 0 ? 我 : 同类[同类.length - 1];
    for (const x of 同类) if (x !== 留) x.remove();
  } catch (_) {}
}

/* ── 2. 等 Mvu 就绪 ─────────────────────────────────────────────────────── */
async function 等Mvu(毫秒) {
  if (取全局('Mvu')) return true;
  const 等 = 取全局('waitGlobalInitialized');
  if (typeof 等 === 'function') {
    try { await Promise.race([等('Mvu'), 睡(毫秒)]); } catch (_) {}
  }
  return !!取全局('Mvu');
}

/* ── 3. 取本楼楼号 ──────────────────────────────────────────────────────── */
function 取楼号() {
  const f = 取全局('getCurrentMessageId');
  if (typeof f !== 'function') return { 楼: null, 报: '这一层没有 getCurrentMessageId' };
  try {
    const n = f();
    if (typeof n !== 'number' || !isFinite(n)) return { 楼: null, 报: 'getCurrentMessageId 返回的不是数字：' + String(n) };
    return { 楼: n, 报: null };
  } catch (e) {
    return { 楼: null, 报: 'getCurrentMessageId 抛错：' + (e && e.message ? e.message : e) };
  }
}

/* ── 4. 读那一楼自己的快照（只有两条路，第三档是报错）─────────────────── */
function 读快照(楼) {
  const 报 = [];
  const 选 = { type: 'message', message_id: 楼 };   // 🔴 楼号必带 —— 这是全部的重点

  const M = 取全局('Mvu');
  if (M && typeof M.getMvuData === 'function') {
    try {
      const d = M.getMvuData(选);
      if (d && typeof d === 'object') return { 路: 'Mvu.getMvuData', 数据: d, 报 };
      报.push('Mvu.getMvuData 返回的不是对象');
    } catch (e) { 报.push('Mvu.getMvuData 抛错：' + (e && e.message ? e.message : e)); }
  } else {
    报.push('这一层没有 Mvu');
  }

  const G = 取全局('getVariables');
  if (typeof G === 'function') {
    try {
      const d = G(选);
      if (d && typeof d === 'object') return { 路: 'getVariables', 数据: d, 报 };
      报.push('getVariables 返回的不是对象');
    } catch (e) { 报.push('getVariables 抛错：' + (e && e.message ? e.message : e)); }
  } else {
    报.push('这一层没有 getVariables');
  }

  return { 路: null, 数据: null, 报 };
}

/* ── 5. 取值 —— 逐层防御 ─────────────────────────────────────────────────
   🔴 这里防的是「**形状没验过**」，不是「内容会不会错」。
      轮 1-2 只验到 `数据.stat_data` 有 6 个顶层键 —— 那是**本地假 shim 造的形状**
      （`_435干跑.mjs`）；真机上 `Mvu.getMvuData` 到底回什么，**没验过**（方案 §5 头号风险）。
      ⇒ 只判**类型/结构**，任何一层不对就返回 undefined，**绝不抛错**。
   ⚠ **不判取值范围、不判枚举** —— 那是 zod 的活（schema 里全是 clamp/catch），
      在这儿再判一遍是重复投入，还会把 zod 已经修好的值误报成「读不到」。 */
function 取(对象, 路) {
  let 当 = 对象;
  for (const 段 of 路) {
    if (当 === null || typeof 当 !== 'object') return undefined;
    当 = 当[段];
  }
  return 当;
}
const 是串 = (v) => typeof v === 'string';
// `是数` 允许小数 —— 三值/三抗/理智/理智稳定性/人性/月蚀度/晋升进度/进度满值 在 schema 里都是 `数`
const 是数 = (v) => typeof v === 'number' && isFinite(v);
const 是整 = (v) => 是数(v) && Math.trunc(v) === v;

// 给失败路径用：把读到的对象缩成一小段能看的字（免得画出 "object Object"）
function 摘要(v) {
  try {
    const s = JSON.stringify(v);
    if (typeof s !== 'string') return String(v);
    return s.length > 200 ? s.slice(0, 200) + '…' : s;
  } catch (_) { return String(v); }
}

/* ── 6. 四个格子（顶部常驻条，轮 1-3 的东西，一个字没改）─────────────────
   每格自己负责「不对就说读不到」—— **一格坏不塌整条**（C2 §7.2）。
   返回 { 类: '好'|'未定'|'坏' }，怎么显示由 画() 定。 */
const 好 = (文) => ({ 类: '好', 文 });
const 坏 = () => ({ 类: '坏', 文: '读不到' });

// 历法 —— 卡文（世界书 `1090` 历法系统）：新月历 · 元年 1 月 1 日 ＝ 星期一 · 每月固定 30 天。
// 🔴 卡文点名「换日时必须同时改 `星期`……这是本卡最容易犯的错」⇒ 四个格子**都要画出来**，
//    画全了驾驶员一眼就能看出「日改了星期没改」。
function 格历法(世) {
  const 历 = 取(世, ['历法']);
  if (历 === null || typeof 历 !== 'object') return 坏();
  const 年 = 取(历, ['年']), 月 = 取(历, ['月']), 日 = 取(历, ['日']), 星 = 取(历, ['星期']);
  if (!是整(年) || !是整(月) || !是整(日) || !是串(星)) return 坏();
  return 好('新月历 ' + 年 + '年' + 月 + '月' + 日 + '日 · ' + 星);
}

// 时刻 —— 卡文（`9900044`）：「24 个标准魔导时（对应 60 分/3600 秒）」；
// 🔴「**账本上只记数字**」＋「清晨/傍晚是**叙事用语**……**别写进这一格**」
//    ⇒ 条上照钟点画，不画时段词（钟点才是对原文最贴的读法，方案 §2 注）。
// 补零两位：这一行每回合都要扫，不该因位数变化而跳字（口径 ②）。
function 格时刻(世) {
  const 时 = 取(世, ['时刻']);
  if (!是整(时)) return 坏();
  return 好((时 < 10 ? '0' : '') + 时 + ':00');
}

// 地点 —— 卡文：层级 **大区 → 地点** 两层；`大区` 空串 ＝ 不在任何已生成大区内。
// 🔴 空串**有含义**，不是「没数据」⇒ 大区空就只画地点（口径 ③）；
//    两个都空才画「未定」—— **不许静默留白**，留白分不清「没设」和「坏了」（口径 ④）。
function 格地点(世) {
  const 大 = 取(世, ['大区']), 地 = 取(世, ['地点']);
  if (!是串(大) && !是串(地)) return 坏();
  const 大串 = (是串(大) ? 大 : '').trim();
  const 地串 = (是串(地) ? 地 : '').trim();
  if (!大串 && !地串) return { 类: '未定', 文: '未定' };
  return 好(大串 && 地串 ? 大串 + ' · ' + 地串 : (大串 || 地串));
}

// 危机 —— 卡文：只写 无/低/中/高/致命 之一，「**这一刻世界有多紧张**」的刻度
//        （遭遇难度读它），**不是剧情、不是任务进度**。
// ⚠ **本轮纯文字不上色**：「危险该是什么颜色」是审美判断，归轮 1-10（口径 ⑤）。
function 格危机(世) {
  const 危 = 取(世, ['危机']);
  if (!是串(危) || !危) return 坏();
  return 好('危机 ' + 危);
}

/* ── 7. 「状态」页 —— 5 组 15 格（轮 1-4 新增）──────────────────────────
   全部取自 `zod_schema.js` 的 `主角`，**没有新变量**。
   取值根 ＝ `stat_data.主角`。每格自己判、自己降级；**一格坏不塌一组，一组坏不塌一页**。 */

// 一组 ＝ 一个标签 ＋ 若干格。**容器不是对象 ⇒ 整组一格「读不到」**（不逐格刷四遍"读不到"）。
function 组(标签, 容器, 造格) {
  if (容器 === null || typeof 容器 !== 'object') return { 标签, 格: [坏()] };
  try { return { 标签, 格: 造格(容器) }; }
  catch (_) { return { 标签, 格: [坏()] }; }   // 🔴 造格自己抛错也只塌这一组
}

// 三值 —— 格式照卡文 `254984` 五、2 的 `<battle_status>` 原文：`HP <x>/<y>`
// 🔴 **两个都要是数才画**：只画 `HP 88` 会让人以为上限不重要，而它恰恰是必读的一半
//    —— 依据 `D135` ③「**宁可空着，不许猜**」。
const 值对 = (三, 名) => {
  const 当前 = 取(三, [名, '当前']), 上限 = 取(三, [名, '上限']);
  if (!是数(当前) || !是数(上限)) return 坏();
  return 好(名 + ' ' + 当前 + '/' + 上限);
};
const 组三值 = (主) => 组('三值', 取(主, ['三值']),
  (c) => [值对(c, 'HP'), 值对(c, 'MP'), 值对(c, 'SP')]);

// 五维 —— 卡文光给值、**没给格式** ⇒ 这一层写法是我拟的（单字照 schema 字段名）
const 组五维 = (主) => 组('五维', 取(主, ['五维']),
  (c) => ['力', '敏', '体', '智', '魅'].map((k) => (是整(取(c, [k])) ? 好(k + ' ' + 取(c, [k])) : 坏())));

// 三抗 —— 卡文 `9900031` 四、「三抗性各按它的构造定，**落 0%~100%**」⇒ **带 `%`**
const 组三抗 = (主) => 组('三抗', 取(主, ['三抗']),
  (c) => ['物理', '魔法', '污染'].map((k) => (是数(取(c, [k])) ? 好(k + ' ' + 取(c, [k]) + '%') : 坏())));

// 心智 —— 🔴 `理智上限` 是**字符串枚举** `'100'|'90'|'70'|'40'`，**不是数**！
//         拿「是数字吗」判它 ⇒ 永远判不过 ⇒ 那格永远「读不到」，**还不报错**。
//         `理智稳定性` 照 `254984` 二、2 的原词（⚠ `调整值` 底下那个叫 `稳定性`，**是另一格**，别混）。
const 组心智 = (主) => 组('心智', 取(主, ['心智']), (c) => {
  const 理智 = 取(c, ['理智']), 上限 = 取(c, ['理智上限']);
  const 稳定 = 取(c, ['理智稳定性']), 人性 = 取(c, ['人性']);
  const 月蚀 = 取(c, ['月蚀度']), 阶段 = 取(c, ['月蚀度阶段']);
  return [
    (是数(理智) && 是串(上限) && 上限) ? 好('理智 ' + 理智 + '/' + 上限) : 坏(),
    是数(稳定) ? 好('理智稳定性 ' + 稳定) : 坏(),
    是数(人性) ? 好('人性 ' + 人性) : 坏(),
    (是数(月蚀) && 是串(阶段) && 阶段) ? 好('月蚀度 ' + 月蚀 + '（' + 阶段 + '）') : 坏(),
  ];
});

// 成长 —— 格式照卡文 `9900037` 七、字段化**原文**：`初次写全: 阶位 2 · 晋升进度 40% / 200%`
//        ⚠ `进度满值` **我不算**（卡文 `9900044` 五、：「`进度满值` 是**只读的**」）⇒ 直接读变量。
const 组成长 = (主) => 组('成长', 主, (c) => {
  const 阶 = 取(c, ['阶位']), 进 = 取(c, ['晋升进度']);
  const 满 = 取(c, ['进度满值']), 点 = 取(c, ['属性点']);
  return [
    是整(阶) ? 好('阶位 ' + 阶) : 坏(),
    (是数(进) && 是数(满)) ? 好('晋升进度 ' + 进 + '% / ' + 满 + '%') : 坏(),
    是整(点) ? 好('属性点 ' + 点) : 坏(),
  ];
});

/* ── 7.5 「在场」页 —— 名字 ＋ 好感度（轮 1-5 新增）──────────────────────
   数据根 ＝ `stat_data.角色`，**一个字典：键就是角色名**，值是那一整套角色字段。
   只取两格：键（名字）与 `好感度`。
   🔴 `关系` 那一格**本轮不画** —— §3.6 写的这页只有「名字 ＋ 好感度」（一个不多一个不少）。
   🔴 `在场` / `好感度` 的六档、颜色、间距 —— **全是审美，归轮 1-10**（本轮只到看得见）。 */

// 好感度写法 —— 🔴 正数带 `+`（卡文 `9900042` 三、5：`好感度 −12 → +8`）。
//    ⚠ 减号用 **ASCII `-`**：它要跟数字拼成一体，全角 `−` 排在数字里对不齐。
const 写好感 = (n) => (n > 0 ? '+' : '') + n;

// 名单 —— 挑出在场的人。返回 { 名: [{名, 感}], 坏: [键] }。
// 🔴 判据**只认 `'离队'` 一个串**（其余一律算在场）—— schema 里 `在场` 的默认值就是 `'在场'`，
//    字段缺了算在场，**不静默漏人**。
// 🔴 `在场` 或 `好感度` 读不出来 ⇒ 记进 `坏`（**跳过它，但页脚要报数**，不许静默留白）。
// ⚠ 名字取自 `Object.keys()`：整数-like 的键会被 V8 强制重排到最前（项目踩过这个坑）。
//    角色名是中文，正常不触发；而且下面按好感度**重排**过，这一层不影响最终顺序。
function 取在场(角) {
  const 名 = [], 坏 = [];
  for (const k of Object.keys(角)) {
    const 条 = 角[k];
    if (条 === null || typeof 条 !== 'object') { 坏.push(k); continue; }
    if (取(条, ['在场']) === '离队') continue;      // 🔴 卡文：离队是状态，不是删除理由
    const 感 = 取(条, ['好感度']);
    if (!是数(感)) { 坏.push(k); continue; }
    名.push({ 名: k, 感 });
  }
  // 好感度降序。⚠ `sort` 在 V8 里是**稳定**的 ⇒ 同分的两人保持字典序，位置可复现。
  名.sort((a, b) => b.感 - a.感);
  return { 名, 坏 };
}

// 在场页。`角` 是 `stat_data.角色`；**不是对象 ⇒ 故障态**（与「空」分开画）。
function 画在场(角) {
  const 框 = document.createElement('div');
  框.className = 'yh-pane';
  框.setAttribute('role', 'tabpanel');

  if (角 === null || typeof 角 !== 'object') {
    const d = document.createElement('div');
    d.className = 'yh-no';
    d.textContent = '读不到';
    框.appendChild(d);
    return 框;
  }

  const { 名, 坏 } = 取在场(角);

  if (名.length === 0) {
    const d = document.createElement('div');
    if (坏.length) {
      // 🔴 有人读不出来 ⇒ **不许说「暂无人在场」** —— 那句话只在"能读的都读到了"的前提下成立
      d.className = 'yh-no';
      d.textContent = '读不到';
    } else {
      // 空字典与「全员离队」都落这儿 —— 两个都是**真·没人**，不是故障
      d.className = 'yh-d';
      d.textContent = '暂无人在场';
    }
    框.appendChild(d);
  } else {
    for (const r of 名) {
      const 行 = document.createElement('div');
      行.className = 'yh-grp';
      const n = document.createElement('span');
      n.textContent = r.名;                       // 🔴 textContent —— 键是模型写的自由文本
      行.appendChild(n);
      const s = document.createElement('span');
      s.className = 'yh-sep';
      s.textContent = '·';
      行.appendChild(s);
      const v = document.createElement('span');
      v.textContent = 写好感(r.感);
      行.appendChild(v);
      框.appendChild(行);
    }
  }

  // 页脚 —— 🔴 有读不出来的就报数，**不许静默跳过**（方案 §3 决策⑥）
  if (坏.length) {
    const d = document.createElement('div');
    d.className = 'yh-d';
    d.textContent = '另有 ' + 坏.length + ' 个读不到';
    框.appendChild(d);
  }
  return 框;
}
/* ── 7.6 「主线」页 —— 线名 ＋ 五项（轮 1-6 新增）─────────────────────────
   数据根 ＝ `stat_data.世界.主线`，**一个字典：键就是线名**，值是那条线的七格。
   本页只取六样：键（线名）＋ `类型` / `状态` / `章节` / `节点` / `已完成节点`（取长度）。
   🔴 `分支` / `配乐` **本轮不画** —— §3.6 这页的表里没有这两项（同 1-4 决策③「一个不多一个不少」）。
   🔴 数据侧三条卡文（`9900044` 252–266 / `9900050` 二、四、六、）：
      · **`主线` 是保留线名，同时只允许一条**；其余三类可并行、条数不限。
      · **「当前节点」＝ `节点` 格** —— 它写的是**正在做的那一个**，不是列表。
      · **「已完成数」＝ `已完成节点` 列表的长度** —— 不是字典里的某一格。
   ⚠ 颜色、间距、六档 —— 全是审美，归轮 1-10（本轮只到看得见）。 */

// 🔴 **全页唯一一处翻译**（驾驶员 2026-09-26 拍）—— 屏幕上画 `未开始`，变量里是 `未启`。
//    边界是**闭集**：只翻这一个词。`类型` 四值、`状态` 另外三值一律照变量原样。
//    **要翻下一个词，得驾驶员点名** —— 这条防的是「翻译层自己长大」（方案 §4.3 不变量 7）。
const 写状态 = (态) => (态 === '未启' ? '未开始' : 态);

// 一格文本：空串画「未定」（灰）—— schema 里 `章节`/`节点` 的默认**就是空串** ⇒ 空是**合法状态**，不是故障。
// 🔴 不许静默留白（轮 1-3 口径④）：留白分不清「没设」和「坏了」。
function 格文本(文) {
  const s = (是串(文) ? 文 : '').trim();
  return s ? 好(s) : { 类: '未定', 文: '未定' };
}

// 挑线。返回 { 行: [{名, 类, 态, 章, 节, 完数}], 坏: [键] }。
// 🔴 `条` 除了 `null`/非对象，**还要挡数组** —— `typeof [] === 'object'`，
//    漏了就会把 `[]` 当合法条目、逐格读出 undefined ⇒ 静默变「读不到」，看不出是坏数据。
//    ⚠ 名字取自 `Object.keys()`：整数-like 的键会被 V8 强制重排到最前（项目踩过这个坑）。
//      线名是中文，正常不触发；而且下面按类型**重排**过，这一层不影响最终顺序。
function 取线(线典) {
  const 行 = [], 坏 = [];
  for (const k of Object.keys(线典)) {
    const 条 = 线典[k];
    if (条 === null || typeof 条 !== 'object' || Array.isArray(条)) { 坏.push(k); continue; }
    const 类 = 取(条, ['类型']), 态 = 取(条, ['状态']);
    const 章 = 取(条, ['章节']), 节 = 取(条, ['节点']), 完 = 取(条, ['已完成节点']);
    // 🔴 枚举**只验「是非空串」**，不验取值在不在四值里
    //    —— 先例：轮 1-4 `组心智` 对 `理智上限`（字符串枚举）与 `月蚀度阶段` 就是这么判的。
    //    理由：不知道怎么读的值，**画出来比吞掉强**（画出来才看得见、才诊断得了）。
    if (!是串(类) || !类) { 坏.push(k); continue; }
    if (!是串(态) || !态) { 坏.push(k); continue; }
    if (!是串(章) || !是串(节)) { 坏.push(k); continue; }   // 空串合法（＝未定），类型不对才坏
    if (!Array.isArray(完)) { 坏.push(k); continue; }        // 🔴 不是数组 ⇒ 不猜 0，整条算坏
    行.push({ 名: k, 类, 态, 章, 节, 完数: 完.length });
  }
  // 类型序：主线 → 支线 → 地域 → 个人（＝卡文 `9900050` 一、的列举顺序）；同类内按键名。
  // ⚠ `sort` 在 V8 里是**稳定**的 ⇒ 同类型的几条保持字典序，位置可复现。
  // ⚠ 键名比较走 **UTF-16 码点序、不是拼音序** —— 稳定可复现，但别当成中文习惯序（方案 §3 决策③）。
  const 序 = { 主线: 0, 支线: 1, 地域: 2, 个人: 3 };
  行.sort((a, b) => (序[a.类] ?? 9) - (序[b.类] ?? 9) || (a.名 < b.名 ? -1 : a.名 > b.名 ? 1 : 0));
  return { 行, 坏 };
}

// 主线页。`线典` 是 `stat_data.世界.主线`；**不是对象 ⇒ 故障态**（与「空」分开画）。
function 画主线(线典) {
  const 框 = document.createElement('div');
  框.className = 'yh-pane';
  框.setAttribute('role', 'tabpanel');

  // 🔴 数组也是 object —— 必须单独挡掉，否则 `Object.keys([])` 得 `[]`，
  //    会**静默画成「暂无主线」**，看着完全正常（方案 §4.3 不变量 3）。
  if (线典 === null || typeof 线典 !== 'object' || Array.isArray(线典)) {
    const d = document.createElement('div');
    d.className = 'yh-no';
    d.textContent = '读不到';
    框.appendChild(d);
    return 框;
  }

  const { 行, 坏 } = 取线(线典);

  if (行.length === 0) {
    const d = document.createElement('div');
    if (坏.length) {
      // 🔴 有线读不出来 ⇒ **不许说「暂无主线」** —— 那句话只在"能读的都读到了"的前提下成立
      d.className = 'yh-no';
      d.textContent = '读不到';
    } else {
      // 空字典是真·没有线（真机现状就是 `{}`），不是故障
      d.className = 'yh-d';
      d.textContent = '暂无主线';
    }
    框.appendChild(d);
  } else {
    for (const r of 行) {
      const 行盒 = document.createElement('div');
      行盒.className = 'yh-grp';
      const 格们 = [
        好(r.名),                 // 线名 ＝ 字典的键（模型写的自由文本）
        好(r.类),                 // 类型四值：**照变量原样，不翻**
        好(写状态(r.态)),         // 🔴 全页唯一一处翻译就在 写状态() 里
        格文本(r.章),
        格文本(r.节),
        好('已完成 ' + r.完数),
      ];
      格们.forEach((g, i) => {
        // 🔴 分隔符**每一格前面都放**（含线名之后那一格）——flex 的 `column-gap` 只给视觉间隙，
        //    **文本层是连着的**：漏掉就是「主线主线 进行中」，屏幕阅读器照着这么念（同轮 1-4）。
        if (i > 0) {
          const s = document.createElement('span');
          s.className = 'yh-sep';
          s.textContent = '·';
          行盒.appendChild(s);
        }
        const d = document.createElement('span');
        if (g.类 === '坏') d.className = 'yh-no';
        else if (g.类 === '未定') d.className = 'yh-d';
        // 🔴 textContent —— 线名与章节/节点名都是模型写的自由文本
        d.textContent = g.文;
        行盒.appendChild(d);
      });
      框.appendChild(行盒);
    }
  }

  // 页脚 —— 🔴 有读不出来的就报数，**不许静默跳过**（方案 §3 决策⑥）
  if (坏.length) {
    const d = document.createElement('div');
    d.className = 'yh-d';
    d.textContent = '另有 ' + 坏.length + ' 条读不到';
    框.appendChild(d);
  }
  return 框;
}

/* ── 8. 画页签条（轮 1-4 新增）──────────────────────────────────────────
   真 `<button type="button">` ＋ `role="tab"` ＋ `aria-selected`
   —— 组件库 `sillytavern-embedded-ui`：「Use semantic controls: real `button`…」
      「Expose active tabs…through appropriate ARIA state」。
   🔴 **不靠 `data-*` 属性做绑定**：页名是中文，属性名走 `dataset` 要做 ASCII 大小写转换，
      没必要冒这个险 ⇒ **闭包捕获页名**（这里是 6 个静态元素，也用不着事件委托）。
   ⚠ **完整的 roving tabindex（左右方向键换页）不在本轮** —— 归轮 1-10。 */
function 画签() {
  const 条 = document.createElement('div');
  条.className = 'yh-tabs';
  条.setAttribute('role', 'tablist');
  for (const 名 of 页表) {
    const b = document.createElement('button');
    b.type = 'button';                       // ⚠ 不写就是 submit 语义
    b.className = 'yh-tab' + (名 === 当前页 ? ' yh-on' : '') + (已建[名] ? '' : ' yh-off');
    b.textContent = 名;
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', 名 === 当前页 ? 'true' : 'false');
    b.addEventListener('click', () => 切页(名));
    条.appendChild(b);
  }
  return 条;
}

// 切页 —— 🔴 **只重画，不重读快照**（重读等于每点一下就多打一次 MVU 接口）
function 切页(名) {
  if (名 === 当前页) return;
  当前页 = 名;
  if (最后行) 画(最后行);
}

/* ── 9. 画页内容（轮 1-4 新增）──────────────────────────────────────────── */
function 画页(主, 角, 线典) {
  // 🔴 「在场」「主线」两页由各自那个函数建框 —— 先把这两页交出去，别白建一个空 div
  if (当前页 === '在场') return 画在场(角);
  if (当前页 === '主线') return 画主线(线典);

  const 框 = document.createElement('div');
  框.className = 'yh-pane';
  框.setAttribute('role', 'tabpanel');

  if (!已建[当前页]) {
    const d = document.createElement('div');
    d.className = 'yh-d';
    d.textContent = '未开放';       // 🔴 不许静默留白 —— 空着分不清「没做」和「坏了」
    框.appendChild(d);
    return 框;
  }

  // 「状态」页
  if (主 === null || typeof 主 !== 'object') {
    const d = document.createElement('div');
    d.className = 'yh-no';
    d.textContent = '读不到';       // 细节由下面的「错」行给，这儿不重复
    框.appendChild(d);
    return 框;
  }

  const 组们 = [组三值(主), 组五维(主), 组三抗(主), 组心智(主), 组成长(主)];
  for (const g of 组们) {
    const 行 = document.createElement('div');
    行.className = 'yh-grp';
    const 名 = document.createElement('span');
    名.className = 'yh-gn';
    名.textContent = g.标签;
    行.appendChild(名);
    // 🔴 分隔符**每一格前面都放**（含组名之后那一格）——flex 的 `column-gap` 只给视觉间隙，
    //    **文本层是连着的**：漏掉组名后那一格，抽出来就是「三抗读不到心智理智 62/70」，
    //    屏幕阅读器会照着这么念（干跑 438 丁那条诊断里看见的）。
    g.格.forEach((格) => {
      const s = document.createElement('span');
      s.className = 'yh-sep';
      s.textContent = '·';
      行.appendChild(s);
      const d = document.createElement('span');
      if (格.类 === '坏') d.className = 'yh-no';
      d.textContent = 格.文;
      行.appendChild(d);
    });
    框.appendChild(行);
  }
  return 框;
}

/* ── 10. 画（一律 createElement ＋ textContent，不拼字符串）─────────────── */
function 画(行) {
  最后行 = 行;      // 🔴 存下来给 切页() 重画用
  const 框 = document.querySelector('.yh-sb') || document.body;
  while (框.firstChild) 框.removeChild(框.firstChild);

  const 加 = (文, 类) => {
    const d = document.createElement('div');
    if (类) d.className = 类;
    d.textContent = 文;
    框.appendChild(d);
    return d;
  };

  加('月痕之民 · 楼层状态栏', 'yh-t');

  // 顶部常驻条（拿不到那一块时整条不画，由 行.错 说明为什么）
  if (行.格子) {
    const 条 = document.createElement('div');
    条.className = 'yh-bar';
    行.格子.forEach((g, i) => {
      if (i > 0) {
        const 隔 = document.createElement('span');
        隔.className = 'yh-sep';
        隔.textContent = '│';
        条.appendChild(隔);
      }
      const 格 = document.createElement('span');
      // 未定 ＝ 卡里本来就是空的（**不是错**）⇒ 灰；坏 ＝ 类型不对/取不到 ⇒ 红
      格.className = g.类 === '坏' ? 'yh-no' : (g.类 === '未定' ? 'yh-d' : '');
      格.textContent = g.文;
      条.appendChild(格);
    });
    框.appendChild(条);
  }

  // 🔴 快照**根本没读到** ⇒ 页签与页内容都不画（同常驻条：错的时候只留一个说清为什么的字）。
  //    快照读到了、只是缺 `世界` 或 `主角` ⇒ 照画（缺的那一块由 行.错 说明）——
  //    这就是「缺一块不塌另一块」。
  if (行.快照) {
    框.appendChild(画签());
    框.appendChild(画页(行.主角, 行.角色, 行.线典));
  }

  if (行.报) 加(行.报, 行.报好 ? 'yh-ok' : 'yh-no');
  if (行.源) 加(行.源, 'yh-src yh-d');
  if (行.错) 加(行.错, 'yh-err');

  去重();   // 🔴 画完才调 —— 这一刻 .yh-sb 才存在，别处调都是空转
}

/* ── 11. 一轮 ─────────────────────────────────────────────────────────────
   🔴 四条读取链一个字不改（轮 1-2 已定）：楼号必带 · 两条路 · 不降级 latest · 失败画出来。 */
async function 一轮() {
  try {
    await 等Mvu(4000);

    const { 楼, 报: 楼报 } = 取楼号();
    if (楼 === null) {
      画({ 快照: false, 格子: null, 主角: null, 报: '读不到本楼楼号 ✗', 报好: false, 源: '', 错: 楼报 });
      return;
    }

    const { 路, 数据, 报 } = 读快照(楼);
    if (!路) {
      画({ 快照: false, 格子: null, 主角: null, 报: '第 ' + 楼 + ' 楼 · 快照没读到 ✗', 报好: false, 源: '', 错: 报.join('\n') });
      return;
    }

    // 🔴 **只读一次**快照，常驻条与状态页**共用**（轮 1-3 口径 ⑦）
    const 世 = 取(数据, ['stat_data', '世界']);
    const 主 = 取(数据, ['stat_data', '主角']);
    const 角 = 取(数据, ['stat_data', '角色']);      // 轮 1-5：「在场」页的数据根
    const 线 = 取(数据, ['stat_data', '世界', '主线']);   // 轮 1-6：「主线」页的数据根
    const 世好 = 世 !== null && typeof 世 === 'object';
    const 主好 = 主 !== null && typeof 主 === 'object';
    const 角好 = 角 !== null && typeof 角 === 'object';
    // 🔴 线好**多挡一层数组**（角好 没有 —— 那是 1-5 的既有写法，本轮不动它）。
    //    数组也是 object，放过去就会让诊断行缺席、页面只剩一个没头没尾的「读不到」。
    const 线好 = 线 !== null && typeof 线 === 'object' && !Array.isArray(线);

    // 🔴 **缺一块不塌另一块**（轮 1-4 改 1-3 的行为，方案 §5.1）。
    //    「快照拿到了、里面没有 X」和「两条路都没成」是**两回事** ⇒ 分开报，
    //    并把真读到的东西摘要出来 —— 形状没验过（§5），这是唯一能看清真相的窗口。
    const 错 = [];
    if (!世好) 错.push('`stat_data.世界` 不是对象 ⇒ 常驻条不画。读到的 ＝ ' + 摘要(世));
    if (!主好) 错.push('`stat_data.主角` 不是对象 ⇒ 状态页不画。读到的 ＝ ' + 摘要(主));
    if (!角好) 错.push('`stat_data.角色` 不是对象 ⇒ 「在场」页不画。读到的 ＝ ' + 摘要(角));
    if (!线好) 错.push('`stat_data.世界.主线` 不是对象 ⇒ 「主线」页不画。读到的 ＝ ' + 摘要(线));

    画({
      快照: true,
      格子: 世好 ? [格历法(世), 格时刻(世), 格地点(世), 格危机(世)] : null,
      主角: 主好 ? 主 : null,
      角色: 角好 ? 角 : null,
      线典: 线好 ? 线 : null,
      报: '',
      源: '轮 1-6 · 第 ' + 楼 + ' 楼快照 · 走 ' + 路
        + (报.length ? ' · 前一档没成：' + 报.join('；') : ''),
      错: 错.join('\n'),
    });
  } catch (e) {
    // 🔴 失败必须画出来 —— C2 §7.2：分区渲染抛错不隔离 ⇒ 整面板空白且什么都不报
    画({ 快照: false, 格子: null, 主角: null, 报: '骨架自己抛错了 ✗', 报好: false, 源: '', 错: (e && e.stack) ? String(e.stack) : String(e) });
  }
}

/* ── 12. 刷新（轮 1-3 接的，一个字没改）──────────────────────────────────
   照 C2 §5.1 范式 ＋ §335/336 事件表（均 high·运行时源码）：
     🔴 ① `await waitGlobalInitialized('Mvu')` **必须在前** —— 漏 await ⇒ `Mvu is not defined`
     🔴 ② 事件名**一律用枚举，绝不手写字符串**：
           `Mvu.events.VARIABLE_INITIALIZED` 的真值是 `'mag_variable_initiailized'`
           （**双 i** —— 上游拼写错误）。手写一遍就**静默失效**：不报错，只是永远不刷新。
   取不到就**静默跳过** —— 不影响首帧（首帧本来就有 一轮() ＋ 600ms 兜底）。
   ⚠ 重画会保留**当前页**（模块级 `当前页`）—— 否则每次变量更新都把人踢回第一页。 */
let 刷新计时 = 0;
function 排刷新(毫秒) {
  if (刷新计时) clearTimeout(刷新计时);
  // debounce 本身就是 C2 范式的防并发手段（`schedulePopulate(80)`，C2 §496）
  刷新计时 = setTimeout(() => { 刷新计时 = 0; 一轮(); }, 毫秒);
}
async function 接刷新() {
  if (!(await 等Mvu(4000))) return;
  const M = 取全局('Mvu');
  const E = M && M.events;
  const on = 取全局('eventOn');
  if (!E || typeof on !== 'function') return;
  try {
    on(E.VARIABLE_UPDATE_ENDED, () => 排刷新(80));   // ← HUD 刷新主挂点
    on(E.VARIABLE_INITIALIZED, () => 排刷新(80));    // ← 开局变量首次落地
  } catch (_) { /* 接不上就不刷，首帧照画 */ }
}

/* ── 13. 装 ─────────────────────────────────────────────────────────────── */
try { window[单例键] = 版本; } catch (_) {}

一轮();
setTimeout(一轮, 600);    // 二次兜底：照 C2 §5.1，应对酒馆助手延迟注入变量
接刷新();                 // 🔴 在 一轮() 之后接 —— 接刷新自己也要 await 等Mvu，不阻塞首帧
setTimeout(去重, 1500);   // 另一个框可能比我晚画完 —— 那时它的 `画()` 会调，
setTimeout(去重, 3000);   // 但万一它先删了我、自己又没走完，这两下补上
</script>
</body>
</html>
