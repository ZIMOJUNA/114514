  // 没注入（读到 `none`）或形状不认识 ⇒ **摘掉这一层**，首字露出来
  if (!m || !m[1] || m[1].indexOf('User Avatars') < 0) { 层.remove(); return; }
  // 形状对不代表图存在 —— 真去取一次，取不到也摘掉
  const 探 = new Image();
  探.onerror = () => { 层.remove(); };
  探.src = m[1];
}

// ── 7. 重画一格（不整页重画，免得把滚动位置和焦点弄丢）──────────────────
function 头重画(壳, 名, 形, 选项) {
  const 新 = 头画(名, 形, 选项);
  壳.replaceWith(新);
  const 盒 = 新.querySelector('.yh-av');
  if (盒 && 选项 && 选项.人格) 头挂人格(盒);
  return 新;
}

// ── 8. 上传面板 ──────────────────────────────────────────────────────────
/* 🔴 一页**只留一个面板**（`头面板今`）。同时开两个的话：配额那行会显示两个
      不一样的数（一个存前、一个存后），点外面的"关闭"逻辑也会互相打架。
   🔴 面板挂在**外壳**里（`.yh-av-w` 是 `position: relative`）⇒ 跟着内容滚，
      不用处理"父窗口滚了而 `fixed` 面板不动"那类跨 iframe 的麻烦。 */
let 头面板今 = null;
let 头目标今 = '';

function 头关面板() {
  if (头面板今) { 头面板今.remove(); 头面板今 = null; 头目标今 = ''; }
}

/* ── 把面板滚进可视区（2026-09-28 量出来的，不修就是死按钮）──────────────────
   🔴 **病灶**：「在场」页的头像上传入口在**详情层**里，面板挂在头像下面
      （`top: calc(100% + 8px)`）。而详情层正文 `.yh-sh-b` 是 `overflow-y: auto`，
      面板又是 `position: absolute` —— **不参与流 ⇒ 不撑高详情层**。
      900 档实测：正文 178→423、面板 361→486 ⇒ **下半截 63px（正好是两颗按钮）
      落在可滚区外**，不滚根本看不见，滚到了又被页脚 `.yh-src`（423→452，不透明底）
      接着盖。首屏只能看见那个输入框。
   🔴 **为什么之前的探针全绿**：程序化 `.click()` **绕过可见性** ——
      "按钮在不在 DOM 里 / 点了有没有反应"这两条都答"在、有"。
      这一条只有**命中测试**（`elementFromPoint`）答得出来。
   ⇒ 开完面板，把**最近的滚动祖先**滚最小的一截。已经全露出来时**一个像素都不动**，
      主角那侧根本没有滚动祖先，这一句是空转。 */
function 头滚进(盒) {
  for (let p = 盒.parentElement; p && p !== document.body; p = p.parentElement) {
    const 纵 = getComputedStyle(p).overflowY;
    // 'hidden' 也算：它一样裁，而且**照样可以用 scrollTop 推**（只是没有滚动条）
    if (纵 !== 'auto' && 纵 !== 'scroll' && 纵 !== 'hidden') continue;
    const 容 = p.getBoundingClientRect();
    const 我 = 盒.getBoundingClientRect();
    if (我.height >= 容.height) p.scrollTop += 我.top - 容.top - 8;            // 装不下 ⇒ 对齐面板顶
    else if (我.bottom > 容.bottom) p.scrollTop += 我.bottom - 容.bottom + 8;  // 装得下 ⇒ 只补下沿
    return;   // 只认最近的那一个：外层的滚动不是这一句该管的事
  }
}

function 头开面板(壳, 盒, 名, 档, 回画) {
  if (头面板今 && 头目标今 === 名) { 头关面板(); return; }   // 再点一次＝收起
  头关面板();
  头目标今 = 名;

  /* 🔴 **主角这一格没有「粘链接」这条路**（2026-09-28 撤。驾驶员当场点的，
     原话「**让你主角用网站链了吗**」）。
     参照卡 `组件库/道渊` 的做法：它的主角头像 `window.refreshUserAvatar` 是
     **自动跟随玩家在酒馆里选的那个人格头像** —— 先问 `getPersonaAvatarPath("current")`，
     取不到再读父窗口 `#user_avatar_block .avatar-container.selected img` 的 `src`；
     **没有输入框、没有按钮、连面板都没有**。它那个带地址框的弹窗
     （`dy-missing-portrait-modal`）是**给 NPC 缺头像时用的**，不是给主角的。
     ⇒ 主角这边**只留本地图片**：要换脸就去酒馆的人格面板换，卡片不另开口子。
     ⚠ **不是"链接不能存"** —— `头存链` 还在（NPC 用，将来图床也用同一条路），
       是**主角这一格不给这个入口**：网络图存的只是一个字符串，断网 / 图床挂掉，
       那张脸当场变成一个破图 —— 主角的脸不该挂在别人的服务器上。 */
  const 是主角 = 名 === '主角';

  const p = document.createElement('div');
  p.className = 'yh-av-pop';
  p.setAttribute('role', 'dialog');
  p.setAttribute('aria-label', '设置「' + 名 + '」的头像');

  const 题 = document.createElement('div');
  题.className = 'yh-av-pop-t';
  题.textContent = '「' + 名 + '」的头像';
  p.appendChild(题);

  // 主角多一行说明：不写的话玩家不知道该去哪儿换脸（面板里只有一颗按钮）
  if (是主角) {
    const 说 = document.createElement('div');
    说.className = 'yh-av-pop-h';   // 样式与状态行共用，不另开一条规则
    说.textContent = '跟随你在酒馆里选的人格头像；传一张本地图可以盖过它。';
    p.appendChild(说);
  }

  let 链 = null;
  if (!是主角) {
    链 = document.createElement('input');
    链.type = 'url';
    链.className = 'yh-av-pop-in';
    链.placeholder = '粘贴图片链接 https://…';
    链.autocomplete = 'off';
    链.spellcheck = false;
    p.appendChild(链);
  }

  const 行 = document.createElement('div');
  行.className = 'yh-av-pop-r';

  const 钮选 = document.createElement('button');
  钮选.type = 'button';
  钮选.className = 'yh-av-pop-b';
  钮选.appendChild(图标('图', 14));
  const 选文 = document.createElement('span');
  选文.textContent = '选本地图片';
  钮选.appendChild(选文);
  行.appendChild(钮选);

  /* ⚠ `链文` 必须跟 `钮链` 一样**挂在函数作用域**上（`let` 在外面、里面只赋值）——
     它被下面的 click 回调用到，而那个回调在 `if` **外面**。写成 `const 链文`
     塞在 `if` 里 ⇒ 是**块作用域**，回调一跑就 `ReferenceError`；
     ⚠ 而且**语法闸门抓不到**（那是个运行时错误，不是语法错误）——
     表现只是"点了「用这个链接」没反应"。 */
  let 钮链 = null;
  let 链文 = null;
  if (!是主角) {
    钮链 = document.createElement('button');
    钮链.type = 'button';
    钮链.className = 'yh-av-pop-b';
    钮链.appendChild(图标('链', 14));
    链文 = document.createElement('span');
    链文.textContent = '用这个链接';
    钮链.appendChild(链文);
    行.appendChild(钮链);
  }

  p.appendChild(行);

  // ── 移除（没有存过就不画：一个点了没反应的按钮比没有按钮更糟）──
  if (头读(名)) {
    const 钮删 = document.createElement('button');
    钮删.type = 'button';
    钮删.className = 'yh-av-pop-b yh-av-pop-x';
    钮删.appendChild(图标('删', 14));
    const 删文 = document.createElement('span');
    删文.textContent = '恢复默认';
    钮删.appendChild(删文);
    钮删.addEventListener('click', () => { 头删(名); 头关面板(); 回画(); });
    p.appendChild(钮删);
  }

  // ── 状态行：错误 / 配额 / 内存兜底警告**共用一行**（面板窄，不堆三行）──
  const 报 = document.createElement('div');
  报.className = 'yh-av-pop-h';
  const 刷配额 = (前) => {
    报.classList.remove('yh-av-pop-er');
    const 已 = 头已用();
    报.textContent = (前 ? 前 + ' · ' : '') + '已用 ' + 头可读(已) + ' / ' + 头可读(头总配额) +
      (头临时 ? ' · ⚠ 本次会话内有效，刷新会丢' : '');
    if (已 > 头总配额 * 0.9) 报.classList.add('yh-av-pop-er');
  };
  刷配额('');
  p.appendChild(报);

  const 出错 = (文) => { 报.classList.add('yh-av-pop-er'); 报.textContent = 文; };

  // ── 落一张图：先压、再查配额、最后存 ──
  const 收 = (源图) => {
    let 出 = '';
    try { 出 = 头压(源图, 档); } catch (_) { 出 = ''; }
    if (!出) { 出错('压不出来（图可能损坏，或浏览器不给用 canvas）'); return; }
    const 字节 = 头估(出);
    // 🔴 配额**预测式**检查：把"这一张会把总量顶到多少"先算出来再决定。
    //    差额而不是全额 —— 换头像时旧的那张会被顶掉，不该按两张算。
    const 差额 = 字节 - 头估(头读(名));
    if (头已用() + 差额 > 头总配额) {
      出错('放不下：这张 ' + 头可读(字节) + '，已用 ' + 头可读(头已用()) +
        '，上限 ' + 头可读(头总配额) + '。先删几张别的头像。');
      return;
    }
    if (!头存(名, 出)) { 出错('写不进去（浏览器存储被占满或禁用了）'); return; }
    头关面板();
    回画();
  };

  /* ── 本地文件 ──
     🔴 输入框**每次用完清空**（`文.value = ''`）。不清的话选同一个文件第二次
        `change` 不触发 —— 玩家会以为"点了没反应"。 */
  const 文 = document.createElement('input');
  文.type = 'file';
  文.accept = 'image/*';
  文.style.display = 'none';
  钮选.addEventListener('click', () => 文.click());
  文.addEventListener('change', () => {
    const f = 文.files && 文.files[0];
    文.value = '';
    if (!f) return;
    if (String(f.type || '').indexOf('image/') !== 0) { 出错('这不是图片文件（' + (f.type || '未知类型') + '）'); return; }
    if (f.size > 头选图上限) { 出错('图太大了：' + 头可读(f.size) + '，上限 ' + 头可读(头选图上限)); return; }
    const 读 = new FileReader();
    读.onerror = () => 出错('这个文件读不出来');
    读.onload = () => {
      const 图 = new Image();
      图.onerror = () => 出错('这个文件不是能显示的图片');
      图.onload = () => 收(图);
      图.src = String(读.result || '');
    };
    读.readAsDataURL(f);
  });
  p.appendChild(文);

  // ── 网络链接（**只有 NPC 走到这儿** —— `是主角` 为真时上面压根没建这颗钮）──
  /* ⚠ 链接这条路**不走压缩**（跨域图 canvas 会被污染，`toDataURL` 直接抛），
     存的就是**链接本身**。代价：断网 / 图床挂了就没了 —— 这条要在占位符里
     说清楚（写"粘贴图片链接"，不写"上传"），不能让人以为它和本地图一样稳。 */
  /* ⚠ 用 `?.` 而不是 `if (钮链) { … }`：包一层 `if` 就要多一个收尾大括号，
     而这个函数里已经有一堆回调套回调 —— **少一次括号手术少一次错**。
     主角那侧 `钮链` / `链` 都是 null，`?.` 直接短路，一行都不用多。 */
  钮链?.addEventListener('click', () => {
    const u = String(链.value || '').trim();
    if (!u) { 出错('先粘一个链接进来'); return; }
    if (!/^https?:\/\//i.test(u)) { 出错('链接要以 http:// 或 https:// 开头'); return; }
    // 🔴 先探一次再存 —— 存一个打不开的链接＝画一个破图
    链文.textContent = '取图中…';
    const 探 = new Image();
    探.onerror = () => { 链文.textContent = '用这个链接'; 出错('这个链接取不到图'); };
    探.onload = () => {
      链文.textContent = '用这个链接';
      头存链(名, u, 回画, 出错);   // 长度/协议/写入 全在里头，错因它自己写进面板
    };
    探.src = u;
  });

  /* ── 🔴 图床：**位置留在这儿，现在不画**（2026-09-28 驾驶员更正）─────────
     驾驶员原话：「**只是叫你预留位置而已**」。
     ⇒ 这一块**不实现**。图床在规划里明写着「**未定**」：
       · `扩展规划.md` §1.11 整节标【规划】—— 免费图床 / jsDelivr / R2 **三选一没挑**；
       · 同文 §8「待你决定」第 1 条就是「**图床域名**」；
       · `_小手机与楼层状态栏方案.md` §9.2 也记着「CG 里真的放图 —— **图床未定**」。
     ⇒ **位置 ＝ 这一行**。图床定了之后在这儿加**一个入口** —— 点开铺一格一格的
       预设图，点一张 ⇒ 走 `头存链` 存下那个网址，**和 NPC 手粘链接是同一条路**。
     ⚠ **只给 NPC 加**：主角那侧连「用这个链接」都没有（见 `是主角` 那段），
       图床是同一类"存网址"的路子 ⇒ **主角也不该有图床**，别顺手铺过去。
       接的时候写成 `if (!是主角) 画图床(p, 名, 回画, 出错);`。
     🔴 **界面上为什么不画一块空的**：一块永远空的「图床」玩家看着像坏了
       （本项目红线：**不许静默留白** —— 留白分不清「没设」和「坏了」）。
       项目里两处「预留」先例分得很清：`_MVU变量字段总表.md` §12.3
       「**要预留的东西一个都不用现在建**」（那条关掉的空条目现在开 ＝ 增值冗余）
       ↔ `_小手机与楼层状态栏方案.md` §4.6「界面、分类…都做，**图库位置留出来**」
       （那是 UI 骨架 ＋ 空格子）。⚠ **这一处属前者**：图床是**一个入口**、
       不是**一块版面**，画个空壳只是多一个死控件。
     ⚠ 撤下来的那份实现（拉清单 JSON / 24 小时缓存 / 格子墙 / 刷新钮 /
       120 张上限 / 扩展名白名单）已归档在
       `备份与存档/归档/_图床_预留稿/`，图床定了直接拿来接。 */

  壳.appendChild(p);
  头面板今 = p;
  头滚进(p);   // 🔴 必须在 appendChild **之后** —— 挂上去才量得到几何
  // 有链接框就聚焦它，主角没那一格 ⇒ 落到「选本地图片」上（键盘进来就有落点）
  try { (链 || 钮选).focus(); } catch (_) { /* 聚焦不到不拦着 */ }
}

// ── 9. 挂上传：点按钮开面板 ──────────────────────────────────────────────
function 头挂传(壳, 盒, 名, 档, 人格) {
  盒.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();   // 🔴 头像若落在可点的卡里，拦掉"连带打开详情层"
    const 形 = 盒.classList.contains('yh-av-p') ? '立绘' : '圆';
    头开面板(壳, 盒, 名, 档, () => 头重画(壳, 名, 形, { 人格: 人格, 可点: true }));
  });
}

/* ── 10. 存一个**网络网址**当头图（2026-09-28 抽出来）────────────────────────
   ⚠ **现在只有一个调用方**：「用这个链接」（手粘）。
     之所以抽成函数而不是就地写：**图床**要用同一颗（预留位见 `头开面板` 末尾）。
     两个入口各写各的，配额算法 / 长度上限 / 协议校验只要有一份写漏，
     表现就是"手粘的能存、点图床的存不进去"（或者反过来），**两个入口都不会报错**。
   ⚠ **网络图只存一个字符串 ⇒ 不占 4MB 配额**（那 4MB 是给本地图 base64 的）。
   ⚠ 校验放这儿、**探测不放这儿**：
     · 「用这个链接」要探（玩家粘的网址谁也不知道通不通，不探就是画一个破图）；
     · 将来图床格子**不探**（图已经画在那一格上了，能画出来就说明取得到，
       再探一次是白等一个 RTT）。
   ⇒ 返回 true ＝ 存进去了（面板已关、已重画）；false ＝ 没成，**错因已经写进面板**。 */
function 头存链(名, 网址, 回画, 出错) {
  const u = String(网址 == null ? '' : 网址).trim();
  if (!u) { 出错('先粘一个链接进来'); return false; }
  if (!/^https?:\/\//i.test(u)) { 出错('链接要以 http:// 或 https:// 开头'); return false; }
  if (u.length > 2048) { 出错('链接太长了（' + u.length + ' 字符）'); return false; }
  if (!头存(名, u)) { 出错('写不进去（浏览器存储被占满或禁用了）'); return false; }
  头关面板();
  回画();
  return true;
}

/* 全局只装一次：点空白处 / 按 Esc 收面板。
   ⚠ 用**捕获**阶段（第三参 true）：面板自己 `stopPropagation` 之后
     冒泡阶段就收不到外面的点击了，捕获能先一步看到。 */
document.addEventListener('click', (e) => {
  if (!头面板今) return;
  const 壳 = 头面板今.parentNode;
  if (壳 && 壳.contains(e.target)) return;
  头关面板();
}, true);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && 头面板今) 头关面板();
});
function 画在场(角) {
  const 框 = document.createElement('div');
  框.className = 'yh-pane';
  框.setAttribute('role', 'tabpanel');

  if (角 === null || typeof 角 !== 'object') {
    const d = document.createElement('div');
    d.className = 'yh-no';
    d.textContent = '读不到';
    框.appendChild(d);
    return 框;
  }

  const { 名, 坏: 坏们 } = 取在场(角);

  if (名.length === 0) {
    const d = document.createElement('div');
    if (坏们.length) {
      // 🔴 有人读不出来 ⇒ **不许说「暂无人在场」** —— 那句话只在"能读的都读到了"的前提下成立
      d.className = 'yh-no';
      d.textContent = '读不到';
    } else {
      // 空字典与「全员离队」都落这儿 —— 两个都是**真·没人**，不是故障
      d.className = 'yh-d';
      d.textContent = '暂无人在场';
    }
    框.appendChild(d);
  } else {
    // 🔴 好感度走 **chip**：它是一个"一眼看数值"的短值，散在标签值行里不显眼。
    //    在场/离队也走 chip（'在场' 绿、'离队' 中性）—— 那是这一页最要紧的状态词。
    // 🔴 **2026-09-28 修：这一格原来读的是 `r.场`，而 `取在场` 根本不返回 `场`。**
    //    `取在场`（在 `候选乙2.html`，**数据层，本轮一个字没动**）里有一句
    //    `if (取(条, ['在场']) === '离队') continue;` —— 它**只返回在场的人**，
    //    返回的是 `{名, 感}`，**没有 `场` 这个字段**。
    //    ⇒ `r.场` 恒为 `undefined`，于是：
    //      · `r.场 === '在场' ? '好' : ''` 恒为 `''` ⇒ `片` 是假的 ⇒ **chip 一次都没画出来**，
    //        这一格掉进"标签值行"；
    //      · 值取 `格文2` ⇒ `g.文` 是 `undefined` ⇒ `textContent = undefined`
    //        被 WebIDL 的 `[LegacyNullToEmptyString]` 折成**空串**
    //        ⇒ 卡上就是**一个「在场」标签后面跟着一段空白**（390 档实拍：
    //        `_轮110/_分栏_分栏①对齐_在场_窄.png`），看着像"这一格没读出来"。
    //    ⇒ 取值改成**写死 '在场'**：这一页的语义就是"这些人现在在"，那个值来自
    //      **数据层的筛选**，不是来自某条数据。🔴 **改 `取在场` 必须同时改这里**。
    //    ⚠ 也**不给它设 `签`** —— 设了详情层就会画成「在场 在场」两遍
    //      （`造格` 是"有签画签、再画值"）。不设签 ⇒ 卡上是绿 chip「在场」，
    //      详情层是一颗胶囊「在场」，两边都不重字。
    /* 🔴 头像分两处（2026-09-28 加），**这不是重复，是分工**（理由见 `_分栏_头像.js` 文件头）：
         · 卡里那颗是**纯展示**（`可点:false`）—— 让人**看得见**"这个人有没有立绘"；
         · 详情层那颗才是**上传入口**（`可点:true`）—— 那儿有整幅宽度，立绘画得大，
           而且详情层是独立视图，不存在"按钮套按钮"那个非法结构。
       ⚠ 详情层那颗走 `传头` **函数**、点开才建 —— 在场页可能有十几个人，
         十几棵 3:4 的子树白建着不用是纯浪费。 */
    框.appendChild(网格(名.map((r) => {
      /* 🔴 **原始条目**（2026-09-29 加）—— `取在场` 只回 `{名, 感}` 两格，而
         `stat_data.角色.<名>` 每项 **77 格**（`_MVU变量字段总表.md` §3）。
         `角` 就在手上 ⇒ `角[r.名]` 拿得到全条目：**数据层一个字不用动、`取在场` 也不用改**
         （§9B.7：本轮只动**画法**）。
         ⚠ 取不到就退回空对象 —— 这一条照样画得出来（名 ＋ 在场片 ＋ 好感度轴），
           只是属性那五张卡会是「读不到」。**比整条不画强，也比抛异常强。**
         ⚠ `取在场` 只返回**在场的人**（它内部 `continue` 掉离队的），所以这里的 `条`
           一定是"现在在"的那一条，跟 `格片卡('在场')` 那个写死的词是同一件事的两种取法。 */
      const 条 = (角[r.名] && typeof 角[r.名] === 'object') ? 角[r.名] : {};
      const 文 = (k) => { const v = 取(条, [k]); return (是串(v) && v.trim()) ? v.trim() : ''; };
      return 组卡(r.名, [
        格文(r.名),
        // ⚠ `格片卡` 不是 `格片` —— 这个「在场」**详情层里由头盒负责**（`.yh-sh-t` 底下
        //   那行身份就是它），不标 `只卡` 的话同一个词会在 60px 内出现两次。
        格片卡('好', 格文('在场')),
        格轴(r.感),
        // 「关系」——**数字管「多深」、文本管「是什么」，两格不互相推导**
        // （`_MVU变量字段总表.md` §3 那句硬话）。⇒ 它跟好感度轴**分开画、不合并**：
        // 轴留在原地（全幅那把尺），文本挪进头盒（跟人走）。**"不合并"是内容判据，
        // "画在哪一行"是画法** —— 两者不冲突。见 `画在场头` 里那段。
        // 属性 —— **直接复用状态页那五张卡**（`画组`，2026-09-29 从 `画状态` 挪出来的）。
        // `角色` 项的形状 ＝ `主角` 减 `金钱` 加 `在场/好感度/关系` ⇒ `组三值(条)` 与
        // `组三值(主)` 是**同一支函数**，一个字都不用改（同表 §3）。
        // ⚠ **不给签**：五张卡各自带着组抬头（'三值'/'五维'/…），再套一层「属性」标签
        //   就是同一个词画两遍；而且它**落在「概览」那一签里**（签为空 ⇒ `长` 为假），
        //   这正是要的 —— 点开一个人，第一屏就得是满的，不能只有一个轴。
        // ⚠ 外面套 `网格()`：`.yh-body` 是**竖排 flex**，五张卡直接塞进去是五块通长砖；
        //   套一层网格才跟状态页一样两栏铺开（窄档由 CSS 塌成一栏）。
        格块(网格(画组([组三值(条), 组五维(条), 组攻(条), 组三抗(条), 组心智(条), 组精神(条), 组质点(条), 组成长(条)]))),
        // 🔴 **2026-09-30：三个长字段从"光秃秃一段散文"改成"一段散文 ＋ 它那一行的同伴"**
        //    —— 驾驶员原话「人物这三个里面内容我记得还是太少了，再加」。
        //    同伴全部取自卡文 `1108` 三、面板十二行，**每一签就是那一行**：
        //      · 相貌（行二）＝ 散文 ＋ **在装装备** —— 行二自己写着「外貌与着装…穿什么」；
        //      · 来历（行三）＝ 散文 ＋ **质点** —— 行五那句「源质·节点名」是**他力量的来处**，
        //        跟行三「从哪来、怎么走到今天」同一条轴；且质点**先前整块没画**；
        //      · 性格（行四）＝ 散文 ＋ **性格码 ＋ 特质** —— 行四写行为、特质写"他身上带什么"，
        //        两者是同一件事的两面（`玩法设计_技能与特质.md` §1.8 那条分界管的是"别混"，不是"别并排"）。
        //    ⚠ **同伴为空时整块同伴不画**，散文照旧独占一签 —— 与改前逐字节相同，不制造空壳。
        //    ⚠ `头盒` 里已经画过的（称号/种族/性别/阶级/归属/身份/职业/关系）**一个都不重复**，
        //      它在每一签上方常驻 ⇒ 再画一遍就是同一屏里同一个值画两遍。
        ...节('相貌', 相貌节(条)),
        ...节('来历', 来历节(条)),
        ...节('性格', 性格节(条)),
        // 🔴 卡文 `1108` 三、**十二 持有** —— 面板十二行的最后一行，前端先前整行没画。
        //    `持有` 这一签**恒出**（哪怕四本全是空的）：它报的是"这个人手上有什么"，
        //    空手本身是信息；「没这一签」和「这一签是空的」在界面上必须分得开。
        格块(持有节(条), '持有'),
      ], true, '人',
        头画(r.名, '圆', { 可点: false }),
         () => 画在场头(条, r.名)
      );
    })));
  }

  // 页脚 —— 🔴 有读不出来的就报数，**不许静默跳过**（方案 §3 决策⑥）
  if (坏们.length) {
    const d = document.createElement('div');
    d.className = 'yh-d';
    d.textContent = '另有 ' + 坏们.length + ' 个读不到';
    框.appendChild(d);
  }
  return 框;
}

/* 「在场」详情层的头盒 —— **裸的一行**：左立绘、右身份（2026-09-29 加）。
   🔴 起因：驾驶员点开秦无咎，「**没有任何东西**」。原头盒只有一颗 126×176 的立绘，
      它在 900 档下面**右边 1400px 全空**（实拍 `_分栏_分栏①对齐_在场详情_宽.png`）
      —— **立绘不是问题，"立绘旁边什么都没有"才是问题**，身份行挪到它右边就治好了。
   🔴 为什么不复用 `画主角头`：**四处不一样**，硬合要给四个开关 ——
      · **不画名字**：详情层的标题行（`.yh-sh-t`）已经写着名字，再画一遍就是同一个词
        在 60px 内出现两次；
      · **不挂 `人格`**：立绘第 ② 层是 ST 人格头像，NPC 挂上去就是"每个 NPC 都长玩家的脸"
        （见 `_分栏_头像.js` 文件头）；
      · **不画相貌**：相貌在卡里是整段自由文本，它是这一层**自己的一节**（`段('相貌')`），
        在这儿再截两行等于同一份文本画两遍；
      · **不套卡底**：详情层自己已经是一块有边有底的板子，**板子里再套一张卡就是盒中盒**
        （`.yh-hero-flat` 把底色/边框/圆角全抹掉，只留底下一道发丝线，与数据行同一支）。
   ⚠ `条` 是 `stat_data.角色.<名>` 的**原始条目**（77 格），**不是** `取在场` 给的
      `{名, 感}` —— 后者只有两格，画不出这一行。 */
function 画在场头(条, 名) {
  const c = (条 && typeof 条 === 'object') ? 条 : {};
  const 文 = (k) => { const v = 取(c, [k]); return (是串(v) && v.trim()) ? v.trim() : ''; };

  const 盒 = document.createElement('div');
  盒.className = 'yh-hero yh-hero-flat';
  // 🔴 **可点** —— 这一颗是上传入口（第 ① 层，卡自己的立绘）。卡上那颗是 `可点:false`
  //    的纯展示（见 `_分栏_头像.js` 文件头那段分工）。
  盒.appendChild(头画(名, '立绘', { 可点: true }));

  const 身 = document.createElement('div');
  身.className = 'yh-hero-id';

  // ── 称号。⚠ 空着就**整段不画** —— 画一对空「」比不画更难看（同 `画主角头`）。
  //    名字不在这儿：它在标题行上，见上面那条。
  const 称号 = 文('称号');
  if (称号) {
    const t = document.createElement('div');
    t.className = 'yh-hero-title';
    t.textContent = '「' + 称号 + '」';
    身.appendChild(t);
  }

  // ── 元数据行：种族 · 性别 · 阶级 · 归属 ──
  // ⚠ 逐项判空**再拼**，不是先拼再 trim —— 中间那个 `·` 会跟着空项留下来，
  //   出现「人族 ·  · 爪牙」这种中间空一格的串（`归属` 是模型自由写的，常为空）。
  const 元 = ['种族', '性别', '阶级', '归属'].map(文).filter(Boolean);
  if (元.length) {
    const m = document.createElement('div');
    m.className = 'yh-hero-meta';
    m.textContent = 元.join(' · ');
    身.appendChild(m);
  }

  // ── 身份 / 职业 —— chip 行 ──
  // 🔴 **每片自带标签**（`身份 灰烬会` / `职业 剑士`），不裸放值：这两个字段**值域重叠**
  //    （都可能是"XX会"这种组织名），裸放一串之后分不出哪个是身份、哪个是职业。
  // ⚠ 数组里非字符串的项**跳过**，不 `String()` 强转 —— 强转会画出 `[object Object]`。
  const 片 = [];
  const 收片 = (arr, 签) => {
    if (!Array.isArray(arr)) return;
    for (const s of arr) if (是串(s) && s.trim()) 片.push({ 签, 值: s.trim() });
  };
  收片(取(c, ['身份']), '身份');
  收片(取(c, ['职业']), '职业');
  if (片.length) {
    const 带 = document.createElement('div');
    带.className = 'yh-hero-tags';
    for (const p of 片) {
      const t = document.createElement('span');
      t.className = 'yh-hero-tag';
      const a = document.createElement('span');
      a.className = 'yh-hero-tag-k';
      a.textContent = p.签;
      const b = document.createElement('strong');
      b.textContent = p.值;
      t.append(a, b);
      带.appendChild(t);
    }
    身.appendChild(带);
  }

  // 「关系」—— 画进头盒（原来在轴底下单占一行）
  const 关 = 文('关系');
  if (关) {
    const r = document.createElement('div');
    r.className = 'yh-hero-rel';
    const rk = document.createElement('span');
    rk.className = 'yh-hero-rel-k';
    rk.textContent = '关系';
    const rv = document.createElement('span');
    rv.className = 'yh-hero-rel-v';
    rv.textContent = 关;
    r.append(rk, rv);
    身.appendChild(r);
  }

  // 🔴 身份列**整列空着**是可能的（NPC 刚生成时 种族/性别/阶级/归属/身份/职业 全空）。
  //    那时候**不留一条空的右列** —— 不 append 就是，立绘退回"独自一行"。
  if (身.childElementCount) 盒.appendChild(身);
  return 盒;
}

/* ══ 状态筛（「主线」/「任务」两页共用）══════════════════════════════════════
   🔴 **默认恒为「全部」** —— 这一页是**账本**：默认视图一条都不许藏。
      筛是驾驶员**自己按下去**的，而且每一档旁边挂着条数 ⇒ 藏没藏、藏了几条，
      抬眼就看得见。（1-7「四档都要」/ 1-8「你就画啊」连着两轮的口径照旧：
      **不是"要不要筛掉某一档"，是"谁按的、按完还看不看得见账"。**）
   🔴 **档位从数据现推，不写死** —— 状态的取值是**模型写的自由串**（`取线`/`取务` 只验
      "是非空串"，见那两处注释）。写死一张四值表 ⇒ 模型写个「搁置」，
      那一条就**永远点不出来** ＝ 静默吞数据。现推的表里，「搁置」自成一项。
   🔴 记号沿用页签条那支竖刻度（`.yh-tab::before`）**小一号**（15px → 11px）——
      同一个「你在这」手势低一层换尺寸就够；**另造一套记号才是"常见 AI 设计"的来源**。
      底下**没有任何实心块**（页签条那条 '--psunk' 凹槽这一层刻意不画）。
   ⚠ 跨页不重置是**刻意的**：他选了「进行中」，翻去任务页再回来还是它 ——
     中途自己跳回「全部」才是真丢数据。 */
let 主线筛 = null;      // 'null' ＝ 全部；否则存**变量里的原值**（'未启'，不是 '未开始'）
let 任务筛 = null;
/* 🔴 重画后把焦点落回选中那一档（键盘用户；同 '详情要聚焦' / '签要聚焦' 那两条的教训）。
   ⚠ **必须在骨架挂载那一步消费**（`_分栏_骨架.js` 的 `if (行.快照)` 块），**不能在本文件里 .focus()** ——
     本文件造整棵 `.yh-pane` 时它**还没进文档**，而**游离节点上的 `.focus()` 是静默空操作**
     （不报错、不抛异常、`document.activeElement` 照旧是 `<body>`）。
     第一版就写在这儿：探针量出来「焦点落在 (BODY)」，而肉眼在截图上**永远看不出来**。 */
let 筛要聚焦 = false;

/* 造筛选条。`行` ＝ 已解析的行数组 · `取值` ＝ 从一行里取状态原值 · `现选` ＝ 当前选中。
   `设选` 是写回**模块级那个变量**的 setter（`画筛` 自己够不着调用方的变量）。
   返回 `{条, 选, 行}` —— `选` 是**归一后的**选中值，调用方必须把它写回去。 */
function 画筛(行, 取值, 现选, 设选) {
  const 数 = new Map();
  for (const r of 行) { const v = 取值(r); 数.set(v, (数.get(v) || 0) + 1); }

  // 🔴 选中的那一档**这一帧已经没了** ⇒ 退回「全部」。不退回的话：这一页画成空网格，
  //    而空网格上**没有任何一档可点** ⇒ 卡死在"筛出零条"上，只能刷新页面才出得来。
  //    ⚠ 这不是假想故障 —— 条目是模型写的，上一轮有「进行中」这一轮可能一条都没有。
  if (现选 !== null && !数.has(现选)) 现选 = null;

  // 档序：对上的走枚举序（同 `取线`/`取务` 的 `序[..] ?? 9` 那套），对不上的按码点序吊在后面。
  const 序 = { 未启: 0, 进行中: 1, 已完成: 2, 已结算: 3, 已失败: 4 };
  const 档们 = [...数.keys()].sort((a, b) => (序[a] ?? 9) - (序[b] ?? 9)
                                || (a < b ? -1 : a > b ? 1 : 0));

  const 条 = document.createElement('div');
  条.className = 'yh-flt';
  条.setAttribute('role', 'group');
  条.setAttribute('aria-label', '按状态筛选');

  const 造 = (值, 签, 个) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'yh-fl' + (现选 === 值 ? ' yh-fl-on' : '');
    b.setAttribute('aria-pressed', 现选 === 值 ? 'true' : 'false');
    b.appendChild(document.createTextNode(签));
    const n = document.createElement('span');
    n.className = 'yh-fl-n';
    n.textContent = String(个);
    b.appendChild(n);
    b.addEventListener('click', () => {
      if (现选 === 值) return;        // 点已经选中的那一档＝什么都不做（不重画、不闪一下）
      设选(值);
      筛要聚焦 = true;                 // ⚠ 消费在骨架挂载那一步，理由见 `筛要聚焦` 的声明处
      if (最后行) 画(最后行);          // 🔴 只重画、**不重读快照**（同 `切页()`）
    });
    return b;
  };

  // 「全部」挂在最前，条数 ＝ 总条数 ⇒ 各档的条数加起来必须对得上它（自洽，一眼能核）
  条.appendChild(造(null, '全部', 行.length));
  for (const v of 档们) 条.appendChild(造(v, 写状态(v), 数.get(v)));

  // ⚠ 焦点**不在这儿落**（`筛要聚焦` 由骨架挂载那一步消费）—— 此刻整棵 pane 还是游离的。
  //   落点用 `.yh-fl-on` 找（唯一一颗）⇒ 不必拿 `CSS.escape` 拼属性选择器
  //   （状态值是模型写的任意串，带引号就炸）。
  return { 条, 选: 现选, 行: 现选 === null ? 行 : 行.filter((r) => 取值(r) === 现选) };
}

/* ── 主线 · 类型图标 ──────────────────────────────────────────────────────
   四类型各有对得上的**已有**形状，不新画：主线＝旗 · 支线＝卷 · 地域＝图 · 个人＝人。
   对不上的（模型写了第五个词）⇒ 回落到 `图`，**不空着** —— 这一格是装饰，不是判据。 */
const 线图标 = { 主线: '旗', 支线: '卷', 地域: '图', 个人: '人' };
const 类图标 = (类) => 线图标[类] || '图';

/* ── 主线 · 节点树（2026-09-30 加）────────────────────────────────────────
   `已完成节点` 是 `z.array(z.string())`，先前 `取线` 只把 `.length` 带出来 ⇒
   **节点名字一个都没到过渲染层**，画面上只剩「已完成 4」。这条链把它画出来。

   · 走完的 ⇒ 实心点；当前节点 ⇒ 圆环 ＋ 一枚尾签（词随 `状态` 走）。
   · 竖轨在**当前节点之后淡出** —— 底下是还没走的路，没画出来的东西不假装有。
   · `分支` 是岔口，画在轨尾；空串就不出这一行（不写「分支：无」）。
   ⚠ 一个节点都没有 ⇒ 返回 `null`，由调用方跳过（别画一个空壳）。 */
function 节点树(完, 节, 分, 态) {
  const 走完 = (Array.isArray(完) ? 完 : []).filter((s) => 是串(s) && s.trim());
  const 当前 = (是串(节) && 节.trim()) ? 节.trim() : '';
  const 岔 = (是串(分) && 分.trim()) ? 分.trim() : '';
  if (!走完.length && !当前) return null;

  const 尾签 = { 进行中: '当前', 未启: '起点', 已完成: '已结', 已失败: '已断' }[态] || '当前';

  const 盒 = document.createElement('div');
  盒.className = 'yh-tree';
  // 🔴 **这条路到不到头** —— `已完成` / `已失败` ⇒ 到头（CSS 把尾巴那条虚线掐掉）；
  //    `进行中` / `未启` ⇒ 没到头，末尾留一段虚线，意思是「前面还有路」。
  //    ⚠ 这条**是从 `态` 读出来的事实**，不是装饰：断掉的路还画着"路还在"就是假读数。
  if (态 === '已完成' || 态 === '已失败') 盒.classList.add('is-end');

  const 头 = document.createElement('div');
  头.className = 'yh-tr-h';
  const 名 = document.createElement('span');
  名.className = 'yh-tr-hk';
  名.textContent = '节点';
  const 数 = document.createElement('span');
  数.className = 'yh-tr-hv';
  数.textContent = 走完.length + (当前 ? ' ＋ 当前' : '');
  头.append(名, 数);
  盒.appendChild(头);

  const 列 = document.createElement('ol');
  列.className = 'yh-tr';
  const 造 = (文, 记号, 签) => {
    const li = document.createElement('li');
    li.className = 'yh-tr-n' + (记号 === 'done' ? ' is-done' : ' is-now');
    const m = document.createElement('span');
    m.className = 'yh-tr-m';                   // 记号是纯 CSS 画的（点／环／钩）
    m.setAttribute('aria-hidden', 'true');
    const t = document.createElement('span');
    t.className = 'yh-tr-t';
    t.textContent = 文;                        // 🔴 textContent —— 节点名是模型写的自由文本
    li.append(m, t);
    if (签) {
      const g = document.createElement('span');
      g.className = 'yh-tr-g';
      g.textContent = 签;
      li.appendChild(g);
    }
    列.appendChild(li);
  };
  走完.forEach((s) => 造(s.trim(), 'done'));
  if (当前) 造(当前, 'now', 尾签);
  盒.appendChild(列);

  if (岔) {
    const f = document.createElement('div');
    f.className = 'yh-tr-f';
    const k = document.createElement('span');
    k.className = 'yh-tr-fk';
    k.textContent = '分支';
    const v = document.createElement('span');
    v.className = 'yh-tr-fv';
    v.textContent = 岔;                        // 🔴 自由文本
    f.append(k, v);
    盒.appendChild(f);
  }
  return 盒;
}

/* ── 主线 · 卡面小节轨 ────────────────────────────────────────────────────
   卡上不铺节点名（那是详情层的事），只把**走到哪了**画成一串记号：
   走完的＝实心点，当前＝圆环。多于 `上限` 个时**报余数**，不静默截断。 */
function 节点轨(完, 节, 态) {
  const 走完 = (Array.isArray(完) ? 完 : []).filter((s) => 是串(s) && s.trim());
  const 当前 = (是串(节) && 节.trim()) ? 1 : 0;
  if (!走完.length && !当前) return null;

  const 轨 = document.createElement('span');
  轨.className = 'yh-rail';
  轨.setAttribute('aria-hidden', 'true');       // 纯记号 —— 旁边的「已完成 N」已经把话说清了
  const 上限 = 8;
  const 显 = 走完.slice(0, 上限);
  显.forEach(() => {
    const i = document.createElement('i');
    i.className = 'is-done';
    轨.appendChild(i);
  });
  if (走完.length > 上限) {
    const i = document.createElement('i');
    i.className = 'is-more';
    i.textContent = '＋' + (走完.length - 上限);
    轨.appendChild(i);
  }
  if (当前) {
    const i = document.createElement('i');
    i.className = 'is-now';
    轨.appendChild(i);
  }
  return 轨;
}

/* ── 7.6 「主线」页 —— 线名 ＋ 五项（轮 1-6 新增）─────────────────────────
   数据根 ＝ `stat_data.世界.主线`，**一个字典：键就是线名**，值是那条线的七格。
   本页只取六样：键（线名）＋ `类型` / `状态` / `章节` / `节点` / `已完成节点`（取长度）。
   🔴 `分支` / `配乐` **本轮不画** —— §3.6 这页的表里没有这两项（同 1-4 决策③「一个不多一个不少」）。
   🔴 数据侧三条卡文（`9900044` 252–266 / `9900050` 二、四、六、）：
      · **`主线` 是保留线名，同时只允许一条**；其余三类可并行、条数不限。
      · **「当前节点」＝ `节点` 格** —— 它写的是**正在做的那一个**，不是列表。
      · **「已完成数」＝ `已完成节点` 列表的长度** —— 不是字典里的某一格。
   ⚠ 颜色、间距、六档 —— 全是审美，归轮 1-10（本轮只到看得见）。 */

// 🔴 **全页唯一一处翻译**（驾驶员 2026-09-26 拍）—— 屏幕上画 `未开始`，变量里是 `未启`。
//    边界是**闭集**：只翻这一个词。`类型` 四值、`状态` 另外三值一律照变量原样。
//    **要翻下一个词，得驾驶员点名** —— 这条防的是「翻译层自己长大」（方案 §4.3 不变量 7）。
const 写状态 = (态) => (态 === '未启' ? '未开始' : 态);

// 一格文本：空串画「未定」（灰）—— schema 里 `章节`/`节点` 的默认**就是空串** ⇒ 空是**合法状态**，不是故障。
// 🔴 不许静默留白（轮 1-3 口径④）：留白分不清「没设」和「坏了」。
function 格文本(文) {
  const s = (是串(文) ? 文 : '').trim();
  return s ? 好(s) : { 类: '未定', 文: '未定' };
}

// 挑线。返回 { 行: [{名, 类, 态, 章, 节, 完数}], 坏: [键] }。
// 🔴 `条` 除了 `null`/非对象，**还要挡数组** —— `typeof [] === 'object'`，
//    漏了就会把 `[]` 当合法条目、逐格读出 undefined ⇒ 静默变「读不到」，看不出是坏数据。
//    ⚠ 名字取自 `Object.keys()`：整数-like 的键会被 V8 强制重排到最前（项目踩过这个坑）。
//      线名是中文，正常不触发；而且下面按类型**重排**过，这一层不影响最终顺序。
function 取线(线典) {
  const 行 = [], 坏 = [];
  for (const k of Object.keys(线典)) {
    const 条 = 线典[k];
    if (条 === null || typeof 条 !== 'object' || Array.isArray(条)) { 坏.push(k); continue; }
    const 类 = 取(条, ['类型']), 态 = 取(条, ['状态']);
    const 章 = 取(条, ['章节']), 节 = 取(条, ['节点']), 完 = 取(条, ['已完成节点']);
    const 分 = 取(条, ['分支']), 乐 = 取(条, ['配乐']);
    // 🔴 枚举**只验「是非空串」**，不验取值在不在四值里
    //    —— 先例：轮 1-4 `组心智` 对 `理智上限`（字符串枚举）与 `月蚀度阶段` 就是这么判的。
    //    理由：不知道怎么读的值，**画出来比吞掉强**（画出来才看得见、才诊断得了）。
    if (!是串(类) || !类) { 坏.push(k); continue; }
    if (!是串(态) || !态) { 坏.push(k); continue; }
    if (!是串(章) || !是串(节)) { 坏.push(k); continue; }   // 空串合法（＝未定），类型不对才坏
    if (!Array.isArray(完)) { 坏.push(k); continue; }        // 🔴 不是数组 ⇒ 不猜 0，整条算坏
    行.push({
      名: k, 类, 态, 章, 节,
      完,                       // 🔴 节点名**原样带出去** —— 渲染层要画那条链，不是只数个数
      完数: 完.length,          // 卡面摘要沿用（不动既有消费者）
      分: 是串(分) ? 分 : '',   // 不是串 ⇒ 当空（不猜），不因此判整条坏
      乐: 是串(乐) ? 乐 : '',
    });
  }
  // 类型序：主线 → 支线 → 地域 → 个人（＝卡文 `9900050` 一、的列举顺序）；同类内按键名。
  // ⚠ `sort` 在 V8 里是**稳定**的 ⇒ 同类型的几条保持字典序，位置可复现。
  // ⚠ 键名比较走 **UTF-16 码点序、不是拼音序** —— 稳定可复现，但别当成中文习惯序（方案 §3 决策③）。
  const 序 = { 主线: 0, 支线: 1, 地域: 2, 个人: 3 };
  行.sort((a, b) => (序[a.类] ?? 9) - (序[b.类] ?? 9) || (a.名 < b.名 ? -1 : a.名 > b.名 ? 1 : 0));
  return { 行, 坏 };
}

// 主线页。`线典` 是 `stat_data.世界.主线`；**不是对象 ⇒ 故障态**（与「空」分开画）。
function 画主线(线典) {
  const 框 = document.createElement('div');
  框.className = 'yh-pane';
  框.setAttribute('role', 'tabpanel');

  // 🔴 数组也是 object —— 必须单独挡掉，否则 'Object.keys([])' 得 '[]'，
  //    会**静默画成「暂无主线」**，看着完全正常（方案 §4.3 不变量 3）。
  if (线典 === null || typeof 线典 !== 'object' || Array.isArray(线典)) {
    const d = document.createElement('div');
    d.className = 'yh-no';
    d.textContent = '读不到';
    框.appendChild(d);
    return 框;
  }

  const { 行, 坏: 坏们 } = 取线(线典);

  if (行.length === 0) {
    const d = document.createElement('div');
    if (坏们.length) {
      d.className = 'yh-no';
      d.textContent = '读不到';
    } else {
      d.className = 'yh-d';
      d.textContent = '暂无主线';
    }
    框.appendChild(d);
  } else {
    // 🔴 筛选条**在行一条都没有时不画**（那种情况走上面那支，画「暂无」/「读不到」）——
    //    只有「全部 0」一颗的筛选条没有可筛的东西，是纯噪声。
    const 筛 = 画筛(行, (r) => r.态, 主线筛, (v) => { 主线筛 = v; });
    主线筛 = 筛.选;
    框.appendChild(筛.条);
    框.appendChild(网格(筛.行.map((r) => {
      // 树**只建一次** —— 建两次会得到两棵不同的子树（DOM 节点不能被 append 到两处），而且白跑
      const 树 = 节点树(r.完, r.节, r.分, r.态);
      const 格们 = [
        格文(r.名),                 // 线名 ＝ 字典的键（模型写的自由文本）
        // ⚠ '类型' **不进 chip** —— 「主线」两个字在胶囊里跟标题重了，且它不是状态。
        格签('类型', 格文(r.类)),   // 类型四值：**照变量原样，不翻**
        // 🔴 '状态' 进 chip：**不带标签**（1-7 方案：原词直出，中文词自明），色走 `态色` 表
        //    ⚠ 查表用**变量里的原值**（可能是 '未启'）、画出来的是 `写状态()` 译过的词 ——
        //      表是照 schema 的枚举建的，两边别串。
        格片(片色(r.态), 格文(写状态(r.态))),
        // 🆕 记号轨（只卡）—— 走的节点串成一串点，答「走到哪了」
        格轨(r.完, r.节, r.态),
        // ⚠ '章节' **不进摘要** —— 它是标题（「第三章·沉钟之下」），clamp 两行是浪费。
        格签('章节', 格文本(r.章)),
        // 🔴 '节点' **进摘要** —— 它是**半散文**（「补封印——把那口钟从潮线底下起出来…」），
        //    驾驶员 2026-09-27 点名的那类值。
        // 🔴 **空值不进摘要**：`格文本('')` 兜出「未定」，摘要块把它画成一整条灰底实心 ——
        //    既是大面积实心填充，又把「这格空着」装成「待定」。空串照画（轮 1-3 口径④
        //    不许静默留白），但**退成标签值行**：一行「当前节点　未定」，没有底。
        格签('当前节点', r.节 ? 格长(格文本(r.节)) : 格文本(r.节)),
        好对('已完成', String(r.完数)),
        // 🆕 '配乐' / '分支' —— 这两格一直在变量里，先前**连读都没读**（`取线` 没往外带）
        ...(r.乐 ? [格签('配乐', 格文(r.乐))] : []),
        // 🔴 '分支' **不进摘要**（2026-09-30 改）—— 摘要块**画不出标签**（`组卡` 只取 `格文2(g)`），
        //    而 `节点` 已经是摘要了 ⇒ 一张卡上两条灰块、**谁也分不清哪条是分支**。
        //    `分支` 是自由文本但通常一句话（`zod` 只写 `串('')`，不封长度），走标签值行 ⇒
        //    有「分支」两个字撑着、**不 clamp、全文看得见**（摘要反倒只出两行）。
        //    ⚠ **建出树时改标「只卡」** —— 详情层里这条值由树尾那个岔口画，
        //      同一屏画两遍是这个面板的禁忌；卡面上没有树 ⇒ 卡面照画。
        ...(r.分 ? [(树 ? 格签卡 : 格签)('分支', 格文本(r.分))] : []),
      ];
      // 🆕 节点树进「概览」（`签: null` ⇒ 不占一个子页签）—— 打开一条线**第一眼就是那条链**
      if (树) 格们.push(格块(树, null));
      return 组卡(r.名, 格们, true, 类图标(r.类));
    })));
  }

  if (坏们.length) {
    const d = document.createElement('div');
    d.className = 'yh-d';
    d.textContent = '另有 ' + 坏们.length + ' 条读不到';
    框.appendChild(d);
  }
  return 框;
}

/* ── 7.7 「任务」页 —— 任务名 ＋ 五项（轮 1-7 新增）───────────────────────
   数据根 ＝ `stat_data.任务`，**一个顶层字典：键就是任务名**，值是那条委托的七格。
   🔴 **是顶层，不是 `世界.任务`** —— 主线在 `世界` 底下，任务不在（别照 1-6 抄路径）。
   本页取六样：键（任务名）＋ `级别` / `状态` / `委托方` / `目标` / `期限`。
   🔴 `来源` / `奖励` **不画** —— §3.6 这页的表里没有（同 1-4 决策③「一个不多一个不少」）。
   🔴 **四档状态全画、什么都不筛**（驾驶员 2026-09-27「四挡都要」）—— §3.6 任务行那个
      「进行中的」限定词**本轮不照做**（推翻的是我的读法，见方案 §3 决策②）。
   🔴 数据侧三条卡文（`9900044` 一、/「### 任务」/ 五、）：
      · **键 = 任务名**（七格里**没有名字格**）。
      · **`状态` 走四档**（`进行中`/`已完成`/`已结算`/`已失败`）—— 委托是**接了才进变量**
        （「只装玩家接了的委托」）⇒ **没有「未启」这一档**（与主线不同）。
      · **`期限` 是 `{年,月,日}` 三个整数**（schema 默认值**都是 0**）——
        这是本项目**第一次处理嵌套对象**。
   ⚠ 颜色、间距、排版 —— 全是审美，归轮 1-10（本轮只到看得见）。 */

// 期限 → 一格。
// 🔴 **三种返回，两条不同的路**（方案 §6 辛 vs 壬 要求分开处置）：
//    · `null` ＝ **这一格读不出来**（不是对象 / 三格有非整数）⇒ 调用方**整条跳过**
//      —— 与 1-6 `取线` 对 `已完成节点` 非数组同构：**数据坏了就不敢用**。
//    · `坏()` ＝ **半填**（有的 0 有的不是）⇒ **那一格画红「读不到」，但整条照画**
//      —— 数据读得出来、只是内容说不清 ⇒ **逐格降级**（1-3 ④「一格坏不塌整条」的成法）。
//    · `好` / `未定` ＝ 正常两态。
// 🔴 只验「是不是整数」，不验范围（同顶部条 格历法()：只验 是整）。
function 格期限(限) {
  if (限 === null || typeof 限 !== 'object' || Array.isArray(限)) return null;
  const 年 = 取(限, ['年']), 月 = 取(限, ['月']), 日 = 取(限, ['日']);
  if (!是整(年) || !是整(月) || !是整(日)) return null;
  const 零 = (n) => n === 0;
  // 三格全 0 ＝ schema 的默认值 ⇒ **合法空态**（画灰「未定」，不是故障）
  if (零(年) && 零(月) && 零(日)) return { 类: '未定', 文: '未定', 键: Infinity };
  // 🔴 半填 ⇒ **不猜**：`1916年0月` 说不清是 1 月还是没定（方案 §4.3 不变量 5）
  if (零(年) || 零(月) || 零(日)) return 坏();
  // 写法照 格历法()：`年 + '年' + 月 + '月' + 日 + '日'`（同一屏两处日期必须一种写法）
  return { 类: '好', 文: 年 + '年' + 月 + '月' + 日 + '日', 键: 年 * 10000 + 月 * 100 + 日 };
}

// 挑委托。返回 { 行: [{名, 级, 态, 方, 标, 限}], 坏: [键] }。
// 🔴 `条` 除了 `null`/非对象，**还要挡数组** —— `typeof [] === 'object'`，
//    漏了就会把 `[]` 当合法条目、逐格读出 undefined ⇒ 静默画成「暂无任务」，看着完全正常。
//    ⚠ 名字取自 `Object.keys()`：整数-like 的键会被 V8 强制重排到最前（项目踩过这个坑）。
//      任务名是中文，正常不触发；而且下面按级别**重排**过，这一层不影响最终顺序。
function 取务(务典) {
  const 行 = [], 坏 = [];
  for (const k of Object.keys(务典)) {
    const 条 = 务典[k];
    if (条 === null || typeof 条 !== 'object' || Array.isArray(条)) { 坏.push(k); continue; }
    const 级 = 取(条, ['级别']), 态 = 取(条, ['状态']);
    const 方 = 取(条, ['委托方']), 标 = 取(条, ['目标']), 限 = 取(条, ['期限']);
    // 🔴 枚举**只验「是非空串」**，不验取值在不在四值里
    //    —— 先例：轮 1-4 `组心智` 对字符串枚举、轮 1-6 `取线` 对 `类型`/`状态` 都是这么判的。
    //    理由：不知道怎么读的值，**画出来比吞掉强**（画出来才看得见、才诊断得了）。
    if (!是串(级) || !级) { 坏.push(k); continue; }    // 排序主键，缺了这行排不了
    if (!是串(态) || !态) { 坏.push(k); continue; }    // 要画的一格，读不出来就算坏
    if (!是串(方) || !是串(标)) { 坏.push(k); continue; }   // 空串合法（＝未定），类型不对才坏
    // 🔴 `格期限` 返回 `null` ＝ **这一格读不出来** ⇒ **整条跳过**（与 `已完成节点` 非数组同构）。
    //    ⚠ 与「半填返回 `坏()`」分开：半填那格画红「读不到」但**整条照画**（方案 §6 辛 vs 壬）。
    const 限格 = 格期限(限);
    if (限格 === null) { 坏.push(k); continue; }
    // 🔴 **这里不筛任何状态** —— 四档 ＋ 不认得的**全进 行**（驾驶员 2026-09-27「四挡都要」）
    行.push({ 名: k, 级, 态, 方, 标, 限: 限格 });
  }
  // 级别序 S→D（🔴 `U60`：2026-09-27 驾驶员拍「改」，把原来的 D→S 倒过来 ——
  //    卡文 `9900044`「### `任务`」列的是 D/C/B/A/S，但**排序键本来就是我拟的**、卡文没规定过，
  //    见 `D144` ⑦ / `D145`）；同级按期限近的在前
  // （`键` 小 ＝ 近；未定 ＝ Infinity ⇒ 同级里排最后）；再按任务名。
  // ⚠ **状态不参与排序**（方案 §3 决策⑤）· 键名比较走 UTF-16 码点序、不是拼音序。
  // ⚠ `sort` 在 V8 里是**稳定**的 ⇒ 三个键全平时保持字典序，位置可复现。
  const 序 = { S: 0, A: 1, B: 2, C: 3, D: 4 };
  行.sort((a, b) => (序[a.级] ?? 9) - (序[b.级] ?? 9)
                 || (a.限.键 - b.限.键)
                 || (a.名 < b.名 ? -1 : a.名 > b.名 ? 1 : 0));
  return { 行, 坏 };
}

// 任务页。`务典` 是 `stat_data.任务`；**不是对象 ⇒ 故障态**（与「空」分开画）。
function 画任务(务典) {
  const 框 = document.createElement('div');
  框.className = 'yh-pane';
  框.setAttribute('role', 'tabpanel');

  if (务典 === null || typeof 务典 !== 'object' || Array.isArray(务典)) {
    const d = document.createElement('div');
    d.className = 'yh-no';
    d.textContent = '读不到';
    框.appendChild(d);
    return 框;
  }

  const { 行, 坏: 坏们 } = 取务(务典);

  if (行.length === 0) {
    const d = document.createElement('div');
    if (坏们.length) {
      d.className = 'yh-no';
      d.textContent = '读不到';
    } else {
      d.className = 'yh-d';
      d.textContent = '暂无任务';
    }
    框.appendChild(d);
  } else {
    // 🔴 筛选条**在行一条都没有时不画**（同上：只有「全部 0」一颗的条是纯噪声）。
    //    ⚠ 委托的状态是四档（**没有 '未启'**）—— 档位照样现推，不写死。
    const 筛 = 画筛(行, (r) => r.态, 任务筛, (v) => { 任务筛 = v; });
    任务筛 = 筛.选;
    框.appendChild(筛.条);
    框.appendChild(网格(筛.行.map((r) => 组卡(r.名, [
      格文(r.名),                       // 任务名 ＝ 字典的键（模型写的自由文本）
      // 🔴 '级别' **不进 chip** —— 光一个拉丁字母在胶囊里读不出是什么
      //    （方案 §3 决策④那条照旧）；它进标签值行，那里有「级别」两个字撑着。
      好对('级别', String(r.级)),
      // 🔴 '状态' 进 chip：**不带标签**（1-7 方案：原词直出），色走 `态色` 表
      //    ⚠ 委托这四档是「进行中 / 已完成 / 已结算 / 已失败」—— **没有 '未启'**（见 `态色` 表）
      格片(片色(r.态), 格文(r.态)),
      格签('委托方', 格文本(r.方)),
      // 🔴 '目标' **进摘要** —— 驾驶员 2026-09-27 原话点的就是它（「把沉钟运出灰港」那种）。
      格签('目标', 格长(格文本(r.标))),
      格签('期限', r.限),
    ], true, '旗'))));
  }

  // 页脚 —— 🔴 有读不出来的就报数，**不许静默跳过**（方案 §3 决策⑦）
  //    ⚠ 只报**坏条目**；四档都已画出来，没有"另有 N 条已了结"这回事
  if (坏们.length) {
    const d = document.createElement('div');
    d.className = 'yh-d';
    d.textContent = '另有 ' + 坏们.length + ' 条读不到';
    框.appendChild(d);
  }
  return 框;
}

/* ── 7.8 「连携」页 —— 连携名 ＋ 四格（轮 1-8 新增）─────────────────────
   数据根 ＝ `stat_data.连携`，**一个顶层字典：键就是连携名**，值是那条连携的四格。
   🔴 **是顶层，不是 `世界.连携`** —— 同 1-7 的 `任务`。卡文 `9900044` 一、那张表列的就是
      `主角` / `角色` / `世界` / `资产` / `任务` / `连携` 六个顶层容器。
   本页取五样：键（连携名）＋ `参与者` / `已解锁` / `冷却计数` / `效果`。
   🔴 **什么都不筛**（驾驶员 2026-09-27）—— `已解锁: false` 的条目**照样画**。
   🔴 **不下「能不能放」的结论**（卡文判据一）—— 见下面 格冷却() 那段注释。
   ⚠ 颜色、间距、排版 —— 全是审美，归轮 1-10（本轮只到看得见）。 */

// 冷却计数 → 一格。
// 🔴 **`0` 写「就绪」是对卡文判据一的知情偏离**（驾驶员 2026-09-27 点名要的，记 `D145`）——
//    卡文 `9900044`「### `连携`」原话：「**能不能放，不看你这一格**……
//    **账本只管他会不会这一招、还有几轮好。**」⇒ 本页**没有资格**下「能放」的结论。
//    「就绪」严格说只覆盖「冷却这一项」：集合条件（读检定记录现判）、参与者是否全在场、
//    技能是否还在 —— **三样都不在这本账上**。
// 🔴 「就绪」**只在 `冷 === 0` 时出现**，不许因为别的条件写它（方案 §4.3 不变量 10）。
function 格冷却(冷) {
  return 冷 === 0 ? { 类: '好', 文: '就绪' } : { 类: '好', 文: '冷却 ' + 冷 + ' 轮' };
}

// 挑连携。返回 { 行: [{名, 参, 效, 锁, 冷}], 坏: [键] }。
// 🔴 `条` 除了 `null`/非对象，**还要挡数组** —— `typeof [] === 'object'`，
//    漏了就会把 `[]` 当合法条目、逐格读出 undefined ⇒ 静默画成「暂无连携」，看着完全正常。
function 取连(连典) {
  const 行 = [], 坏 = [];
  for (const k of Object.keys(连典)) {
    const 条 = 连典[k];
    if (条 === null || typeof 条 !== 'object' || Array.isArray(条)) { 坏.push(k); continue; }
    const 参 = 取(条, ['参与者']), 效 = 取(条, ['效果']);
    const 锁 = 取(条, ['已解锁']), 冷 = 取(条, ['冷却计数']);
    // 🔴 `参与者` **只验「是不是数组、里面是不是全是串」**。
    //    卡文三、1 那句「至少两个名字」是**生成侧对模型的要求**，不是本页的校验 ——
    //    状态栏不是校验器（见记忆「账本不筛」）⇒ 空数组 / 一人 / 三人 / 五人都照画。
    //    ⚠ schema 的默认值就是 `[]`（`.prefault([])`）⇒ 空数组是**合法状态**，不是坏数据。
    if (!Array.isArray(参) || 参.some((x) => !是串(x))) { 坏.push(k); continue; }
    if (!是串(效)) { 坏.push(k); continue; }   // 空串**合法**（＝没写效果）⇒ 只是不画那个按钮
    // 🔴 `已解锁` 只验「是不是布尔」—— `false` **不是坏**（判据二：那是「还没学会、先占位」）。
    if (typeof 锁 !== 'boolean') { 坏.push(k); continue; }
    // 🔴 冷却计数：**「是整数」不是「是数」**（同 1-7 的 期限）。卡文六、2 定了取 1~4、
    //    schema 是 `整数(0, 4, 0)` ⇒ **越界（模型写了 7）按坏条目处理、不夹到 4**：
    //    夹了就是替卡文改数，画出来的又不是变量里那个值了。
    if (!是整(冷) || 冷 < 0 || 冷 > 4) { 坏.push(k); continue; }
    行.push({ 名: k, 参, 效, 锁, 冷 });
  }
  // 冷却升序（`就绪` 最前）—— 判据 ＝ §3.6 说这页「**战斗当回合要用**」；
  // 同级按连携名。⚠ 键名比较走 UTF-16 码点序、不是拼音序（同 1-6 / 1-7）。
  // ⚠ `sort` 在 V8 里是**稳定**的 ⇒ 两个键全平时保持字典序，位置可复现。
  行.sort((a, b) => (a.冷 - b.冷) || (a.名 < b.名 ? -1 : a.名 > b.名 ? 1 : 0));
  return { 行, 坏 };
}

// 连携页。`连典` 是 `stat_data.连携`；**不是对象 ⇒ 故障态**（与「空」分开画）。
function 画连携(连典) {
  const 框 = document.createElement('div');
  框.className = 'yh-pane';
  框.setAttribute('role', 'tabpanel');

  if (连典 === null || typeof 连典 !== 'object' || Array.isArray(连典)) {
    const d = document.createElement('div');
    d.className = 'yh-no';
    d.textContent = '读不到';
    框.appendChild(d);
    return 框;
  }

  const { 行, 坏: 坏们 } = 取连(连典);

  if (行.length === 0) {
    const d = document.createElement('div');
    if (坏们.length) {
      d.className = 'yh-no';
      d.textContent = '读不到';
    } else {
      d.className = 'yh-d';
      d.textContent = '暂无连携';
    }
    框.appendChild(d);
  } else {
    框.appendChild(网格(行.map((r) => 组卡(r.名, [
      格文(r.名),                                                  // 连携名 ＝ 字典的键
      // ⚠ '参与者' **不进摘要** —— 它是名单（「主角、秦无咎」），折行即可（同 '委托方'）。
      格签('参与者', 格文本(r.参.join('、'))),                      // 🔴 只列名字；空数组 ⇒ 灰「未定」
      // 🔴 '状态' 进 chip：**不带标签**；色按 `r.锁` 这个**数据**分（不是按词面）——
      //    已解锁（绿）/ 未解锁（中性）。
      //    ⚠ 原写法给未解锁那档传**空串** ⇒ `组卡` 判 `if (g.片)` 为假、掉进**带标签**那一支，
      //      画成「状态 | 未解锁」—— **这次修的就是它**（哨兵值撞车，不是有意改决策④）。
      格片(r.锁 ? '好' : '中性', r.锁 ? 格文('已解锁') : { 类: '未定', 文: '未解锁' }),
      // 🔴 '冷却' 进 chip：'就绪' / '冷却 2 轮' 都是短词，散在标签值行里看不出来
      格片(r.冷 > 0 ? '特殊' : '好', 格签('冷却', 格冷却(r.冷))),
      // 🔴 '效果' 是空串（或只有空白）就**整格不出** —— 详情层里画一个空字段比不画更糟
      //    （轮 1-8 不变量 7 那条「不画一个点开是空的控件」，这里同一条理）。
      ...(r.效.trim() ? [格签('效果', 格长(格文本(r.效)))] : []),
    ], true, '链'))));
  }

  if (坏们.length) {
    const d = document.createElement('div');
    d.className = 'yh-d';
    d.textContent = '另有 ' + 坏们.length + ' 条读不到';
    框.appendChild(d);
  }
  return 框;
}

/* ── 8. 画页签条（轮 1-4 新增）──────────────────────────────────────────
   真 `<button type="button">` ＋ `role="tab"` ＋ `aria-selected`
   —— 组件库 `sillytavern-embedded-ui`：「Use semantic controls: real `button`…」
      「Expose active tabs…through appropriate ARIA state」。
   🔴 **不靠 `data-*` 属性做绑定**：页名是中文，属性名走 `dataset` 要做 ASCII 大小写转换，
      没必要冒这个险 ⇒ **闭包捕获页名**（这里是 6 个静态元素，也用不着事件委托）。
   ⚠ **完整的 roving tabindex（左右方向键换页）不在本轮** —— 归轮 1-10。 */
/* ── 徽记 ────────────────────────────────────────────────────────────────
   页眉那条冷灰带并掉之后，「月痕之民」四个字只剩这一个记号。
   一弯**残月**，外缘被挖掉一道**刻痕** —— 「月痕」二字直译。

   🔴 刻痕是**从路径里挖掉的**（第二个子路径 ＋ `fill-rule="evenodd"` 变成洞），
      不是在上面画一根底色线 —— 画线的话**换个底色就穿帮**，而这块底是会换的。
   🔴 单色走 `currentColor` ⇒ 换肤自动跟随，不写死颜色。
   🔴 纯几何、零光效。禁的是仿电路/仿 PCB/CRT 扫描线/霓虹渐变那一类，不是禁几何。 */
function 徽记() {
  const NS = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('class', 'yh-crest');
  s.setAttribute('viewBox', '0 0 24 24');
  s.setAttribute('aria-hidden', 'true');   // 纯装饰 —— 读屏别念它
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('fill', 'currentColor');
  // 🔴 `evenodd` 是**刻痕成立的前提**，不是可选装饰 —— 少了它，刻痕四边形不是被"挖掉"，
  //    而是按 nonzero 规则跟残月**并集**（叠加）。本轮第一版就漏了这一行，出图后形状不对。
  p.setAttribute('fill-rule', 'evenodd');
  // 外缘走大圆（心 13.3,12 半径 10）的长弧，内缘走小圆（心 18.8,12 半径 7）的长弧 ⇒ 残月朝右开
  // 🔴 半径差是**算过的**：最厚处 11.8-3.3 = 8.5 单位，16px 渲染 ≈ 5.7px。
  //    第一版取 9/8，最厚处只有 5 单位 ≈ 3.3px，刻痕再切掉一半 ⇒ 剩 1.7px 细弧，
  //    出图后**读成左括号**（特写图实测）。残月本来就吃亏在小尺寸，宁可肥。
  // 刻痕：一条斜割的四边形，右端停在 x=7.5 —— **没切穿**（切穿了变两段碎弧），
  //    只咬掉外缘约 1/3，留一道 5.5 单位的桥。
  // 🔴 **斜 28°** 是 18px 下能不能认出来的分水岭。
  //    竖直残月出图后读成"肥左括号"（特写图实测）；转 28° 之后同一张形状立刻读成月亮。
  //    依据：`.tokenicode\tmp\_徽记选样.html` 七个候选 × 18px/48px 一次出图对比，
  //    A 竖直 / C 瘦 / D 凸月(读成字母 D) / E 咬口圆盘(读成被咬的饼) /
  //    F 加一点(最易读，但变"星月夜"，冲淡「月痕」) / G 贯通缝(读成土星环) 全败给 B。
  p.setAttribute('d',
    'M20.69 5.26A10 10 0 1 0 20.69 18.74A7 7 0 1 1 20.69 5.26Z' +
    'M2 7.0 7.5 5.9 7.5 8.9 2 10.0Z');
  p.setAttribute('transform', 'rotate(-28 12 12)');
  s.appendChild(p);
  return s;
}

/* ── 页签图标 ────────────────────────────────────────────────────────────
   🔴 **命定之诗每个页签前面都有图标**，我这条从第一版起就一直漏着。
      2026-09-27 驾驶员第十张图摆出来时点破：「也没有把各种分开」——
      六个纯文字页签排成一条，扫读时只能一个一个读字；
      图标给的是一条**不用读字的识别通道**（形 → 位置 → 义）。
      命定 `TabBar.module.scss` 的成法：
        `.item { gap: 6px }` ＋ `i { opacity: .72 }` ＋ `.itemActive i { opacity: 1 }`
      ⇒ **未激活时图标压到 72%**，激活才满 —— 图标也参与"你在这格"的表达，
        不是只跟着文字变色。这条照抄。

   ⚠ 为什么在这儿**重写一份**而不是调 `.yh-i` 那套 `图标()`：
     `图标()` 定义在 `_分栏_内容区.js`，它是在**下一个构建阶段**才拼进 HTML 的，
     而 `画签()` 在这个阶段就已经定型 —— 这个函数调不到那个函数。
     两份 path 是**同源的**（都是从 `图标源` 抄的同一个形状），改一处要改两处，
     所以在这里点名记一笔：**`图标源` 里对应键改了，这里也得改。**
   ⚠ 手法与 `.yh-i` 完全一致：data-URI ＋ `mask`，颜色走 `currentColor`
     （mask 取 alpha 通道，所以 SVG 里 `stroke="black"` 只是为了 alpha=1）。 */
const 签图标源 = {
  // 🔴 **页签「状态」原来用的是 ‹脉›，和同一屏「三值」卡头撞了**（2026-09-28 改）。
  //    全卡图标分三集，各集内部不重复：页签集（状态/在场/主线/任务/连携/地图）·
  //    卡头集（三值/五维/三抗/心智/成长）· 行内集（心/滴/叶）。**跨集撞车只有这一处。**
  //    裁定：‹脉›（生命体征）**留给「三值」** —— 它罩的是 HP/MP/SP 三条资源，语义更贴；
  //    页签「状态」是**整页读数**（三值 ＋ 五维 ＋ 三抗 ＋ 心智 ＋ 成长 五组汇总），
  //    走**仪表盘**（gauge）才准 —— 一个表盘读数，不是一个波形。
  //    ⚠ 别拿「都是状态类」当理由留着撞 —— 用户在同一屏里同时看到页签条和卡头，
  //      两个一模一样的形状会读成"同一个东西出现两次"。
  状态: '<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
  在场: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>', // 同 '人'
  主线: '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/>', // 同 '卷'
  任务: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>', // 同 '旗'
  连携: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>', // 同 '链'
  地图: '<path d="M14.1 5.55a2 2 0 0 0 1.79 0l3.66-1.83A1 1 0 0 1 21 4.62v12.76a1 1 0 0 1-.55.9l-4.56 2.27a2 2 0 0 1-1.78 0l-4.22-2.1a2 2 0 0 0-1.78 0l-3.66 1.83A1 1 0 0 1 3 19.38V6.62a1 1 0 0 1 .55-.9l4.56-2.27a2 2 0 0 1 1.78 0z"/><path d="M15 5.76v15"/><path d="M9 3.24v15"/>', // 同 '图'
};
function 签图(名) {
  const el = document.createElement('span');
  el.className = 'yh-ti';
  el.setAttribute('aria-hidden', 'true');   // 纯装饰 —— 旁边的文字已经说清了
  const p = 签图标源[名];
  if (p) {
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" ' +
      'stroke="black" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
    el.style.setProperty('--i', 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")');
  }
  return el;
}

function 画签() {
  const 条 = document.createElement('div');
  条.className = 'yh-tabs';
  条.setAttribute('role', 'tablist');
  条.appendChild(徽记());   // 左端一个记号，顶替原页眉
  for (const 名 of 页表) {
    const b = document.createElement('button');
    b.type = 'button';                       // ⚠ 不写就是 submit 语义
    b.className = 'yh-tab' + (名 === 当前页 ? ' yh-on' : '') + (已建[名] ? '' : ' yh-off');
    // 🔴 图标 ＋ 文字两个节点（不是 textContent）—— 命定 `.item > i + 文字`。
    //    图标走 `aria-hidden`，无障碍名仍由文字给，不会变成「图标名＋文字」念两遍。
    b.appendChild(签图(名));
    const 字 = document.createElement('span');
    字.textContent = 名;
    b.appendChild(字);
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', 名 === 当前页 ? 'true' : 'false');
    b.addEventListener('click', () => 切页(名));
    条.appendChild(b);
  }
  return 条;
}

// 切页 —— 🔴 **只重画，不重读快照**（重读等于每点一下就多打一次 MVU 接口）
function 切页(名) {
  if (名 === 当前页) return;
  当前页 = 名;
  // 🔴 **切页要关详情层** —— 详情记的是上一个页签里点开的那一条，页都换了它就不该还在。
  //    ⚠ 鼠标路径够不着（遮罩铺满内容区、把下面的卡盖住了），但**键盘够得着**：
  //      tab 焦点不受 z-index 阻拦 —— Tab 走到页签、回车，就会带着详情层切页。
  //      探针是程序化 .click()，一测就露出来了。
  详情 = null;
  if (最后行) 画(最后行);
}

/* ── 9. 画页内容（轮 1-4 新增）──────────────────────────────────────────── */
/* ── 「状态」页 ────────────────────────────────────────────────────────────
   五个组：**三值画池子条**（驾驶员 2026-09-27 点名要的彩色渐变）、
   其余四组（五维/三抗/心智/成长）画**统计小格**。
   ⚠ 这五组**不挂详情层** —— 一组最多 4 对短值，一次就看得完。 */

/* ── 主角头（2026-09-28 加）───────────────────────────────────────────────
   🔴 **它是「状态」页的第一块，也是这张卡里主角第一次有脸。**
      起因见 `_分栏_头像.js` 文件头 —— 驾驶员问「给主角、给头像留下来余地没有」，
      而当时的答案是"一点都没有"：全页没有名字、没有称号、没有相貌，没有图片。
   🔴 **只画短字段**，长字段（`来历` / `性格`）**这一版不画**：
      它们是一整段叙事，塞进一块"头"里会把身份行挤没，而它们该去的地方是
      详情层 —— 可详情层这一版**还没给主角开**（`开详情` 是格卡专用的）。
      ⇒ 宁可空着，**不许把没地方放的东西先挤进来**（`D135` ③）。
   🔴 **`阶位` / `晋升进度` 不在这儿画** —— 它们在下面「成长」卡里已经有了。
      同一屏画两遍＝读者会以为那是两个不同的数（`CLAUDE.md` §0 那条"不增值冗余"）。

   版式（照命定 `StatusTab.module.scss` 的 `.heroRow` 成法，左图右身份）：
     ┌────────┐  凌霜 「月蚀的余烬」
     │        │  人族 · 女 · 爪牙 · 灰烬会
     │  立绘   │  身份 灰烬会   职业 剑士
     │  3:4   │  相貌的两行摘要……
     └────────┘
   ⚠ 命定那边头像是 **128px 正圆**，月痕这儿是 **3:4 竖幅** —— 驾驶员要的是
     「**真立绘**」，正圆会把一张竖构图的画裁掉两头。这是**有意不照抄**的一处。 */
function 画主角头(主) {
  const c = (主 && typeof 主 === 'object') ? 主 : {};

  const 盒 = document.createElement('div');
  盒.className = 'yh-hero';
  // 🔴 立绘 **只给主角挂 `人格`**（第 ② 层，ST 人格头像）——
  //    NPC 挂上去就是"每个 NPC 都长玩家的脸"（见 `_分栏_头像.js` 文件头）。
  盒.appendChild(头画('主角', '立绘', { 人格: true }));

  const 身 = document.createElement('div');
  身.className = 'yh-hero-id';

  // ── 名 ＋ 称号 ──
  const 名行 = document.createElement('div');
  名行.className = 'yh-hero-n';
  const 全名 = 取(c, ['全名']);
  const 名文 = document.createElement('span');
  名文.className = 'yh-hero-name';
  /* 🔴 **三种情况分开报，不合并**：
       · 不是字符串  ⇒ 「读不到」（形状不对，是真故障）
       · 空串        ⇒ 「（未命名）」（**不是故障**：卡开局时全名本来就是空的，
                        要跑起来才由模型生成 —— 说成"读不到"是在冤枉数据层）
       · 有内容      ⇒ 照实出 */
  if (!是串(全名)) {
    名文.classList.add('yh-no');
    名文.textContent = '读不到';
  } else if (!全名.trim()) {
    名文.classList.add('yh-hero-blank');
    名文.textContent = '（未命名）';
  } else {
    名文.textContent = 全名.trim();
  }
  名行.appendChild(名文);

  const 称号 = 取(c, ['称号']);
  // 称号空着就**整段不画** —— 画一对空「」比不画更难看，而且"没有称号"不需要占位
  if (是串(称号) && 称号.trim()) {
    const t = document.createElement('span');
    t.className = 'yh-hero-title';
    t.textContent = '「' + 称号.trim() + '」';
    名行.appendChild(t);
  }
  身.appendChild(名行);

  // ── 元数据行：种族 · 性别 · 阶级 · 归属 ──
  // ⚠ 逐项判空**再拼**，不是先拼再 trim —— 中间那个 `·` 会跟着空项留下来，
  //   出现「人族 ·  · 爪牙」这种中间空一格的串（`归属` 是模型自由写的，常为空）。
  const 元 = [];
  for (const k of ['种族', '性别', '阶级', '归属']) {
    const v = 取(c, [k]);
    if (是串(v) && v.trim()) 元.push(v.trim());
  }
  if (元.length) {
    const m = document.createElement('div');
    m.className = 'yh-hero-meta';
    m.textContent = 元.join(' · ');
    身.appendChild(m);
  }

  // ── 身份 / 职业 —— chip 行 ──
  /* 🔴 **每个 chip 自带标签**（`身份 灰烬会` / `职业 剑士`），不裸放值。
       依据 ＝ 命定 `.ascensionPreviewTag` 的结构就是 `<span>标签</span><strong>值</strong>`
       两段。月痕这两个字段**值域重叠**（都可能是"XX会"这种组织名），
       裸放一串 chip 之后**分不出哪个是身份、哪个是职业**。
     ⚠ 数组里非字符串的项**跳过**，不 `String()` 强转 —— 强转会画出 `[object Object]`。 */
  const 片 = [];
  const 收片 = (arr, 签) => {
    if (!Array.isArray(arr)) return;
    for (const s of arr) if (是串(s) && s.trim()) 片.push({ 签, 值: s.trim() });
  };
  收片(取(c, ['身份']), '身份');
  收片(取(c, ['职业']), '职业');
  if (片.length) {
    const 带 = document.createElement('div');
    带.className = 'yh-hero-tags';
    for (const p of 片) {
      const t = document.createElement('span');
      t.className = 'yh-hero-tag';
      const a = document.createElement('span');
      a.className = 'yh-hero-tag-k';
      a.textContent = p.签;
      const b = document.createElement('strong');
      b.textContent = p.值;
      t.append(a, b);
      带.appendChild(t);
    }
    身.appendChild(带);
  }

  // ── 相貌：两行摘要，超出截断 ──
  // ⚠ 它在卡里是**整段自由文本**，不是短值。clamp 在 CSS 里（`.yh-hero-desc`）。
  const 相貌 = 取(c, ['相貌']);
  if (是串(相貌) && 相貌.trim()) {
    const d = document.createElement('div');
    d.className = 'yh-hero-desc';
    d.textContent = 相貌.trim();
    身.appendChild(d);
  }

  盒.appendChild(身);
  return 盒;
}

// 池子条 —— '签' 是 HP/MP/SP，'值' 是 '当前/上限' 形状的串。
// 🔴 拆不出两个数就**照实报**（灰条 ＋ 写「读不到」），不猜、不画半根条。
const 池子 = {
  HP: { 图: '心', 类: 'yh-hp' },
  MP: { 图: '滴', 类: 'yh-mp' },
  SP: { 图: '叶', 类: 'yh-sp' },
};
/* 🔴 **2026-09-28 五改：数值做进条里。**
   四改是「上行 = 图标＋名（左）／大数字（右），下行 = 通长轨道」，数值在条**外面**。
   驾驶员看了参考图（创世回廊 信息页：`[图标 名] [通长胶囊，数值白字居中压在条里]`）
   之后下令「**做进条里**」。⇒ 一行就是一根条，结构回到：

     [图标 名]  [ 轨道 ▓▓▓▓▓▓▓░░░░   412 / 500 ]

   ⚠ 这条**不是把四改推翻**：四改治的是"标签列吃掉 46px、条只有 300px 宽、
     数值只有 10px"那三个毛病。五改之后标签仍是**独立一列**（宽度有下限、不压轨道），
     条仍然通长，数值从 10px 升到 `--fs-2`(13.5px)，那三个毛病一个都没回来。

   🔴 **条内字为什么要画两遍**（这是这一版唯一有点绕的地方，改之前先读完）：
      · 白字压在**填充色**上够看（`_算对比度.mjs`：SP 4.75 ✓ / HP 3.78 / EXP 3.31 / MP 3.20）
      · 白字压在**轨道**上是 **1.29:1** —— 等于看不见。
      · 而"填充有没有盖住中间那个字"取决于**条有多宽**和**字有多宽**，两个都要
        **排版之后**才知道，可这个函数返回时元素还没进 DOM ⇒ 量不到。
      ⇒ 不估阈值，改**裁切换色**：
        底层墨色字永远在（6.17:1，怎么都看得见），上层再画一份白字，
        用 `clip-path: inset(0 右 0 0)` 按填充宽度裁 —— 填充盖到哪儿白字露到哪儿。
        **裁切线永远与填充右边缘重合，一步都不用量。**
        数值高（常见）时整串是白的，跟参考图一样；低的时候自动变墨色；
        中间状态是"填充到哪、白到哪"，不会出现半截看不见。
      ⚠ 两份必须**像素级重合**（同一个 `inset:0`、同一套字号/字重/字距，见样式表），
        改一份就得改另一份，否则会看出双影。
      ⚠ 上层那份挂 `aria-hidden` —— 不挂的话读屏会把同一个数字念两遍。 */
function 造条(签, 值文, 坏) {
  const 盒 = document.createElement('div');
  const 定 = 池子[签];
  const row = document.createElement('div');
  row.className = 'yh-pool ' + (定 ? 定.类 : '');

  // 标签列（图标 ＋ 名）—— 固定在左，`.yh-pool-l` 有下限宽度，三根条的轨道因此起点对齐。
  const l = document.createElement('span');
  l.className = 'yh-pool-l';
  if (定) l.appendChild(图标(定.图, 16));
  const nm = document.createElement('span');
  nm.className = 'yh-pool-k';
  nm.textContent = 签;
  l.appendChild(nm);

  const t = document.createElement('span');
  t.className = 'yh-pool-t';
  const f = document.createElement('span');
  f.className = 'yh-pool-f';
  const num = document.createElement('span');        // 底层：墨色，永远在
  num.className = 'yh-pool-num';
  const numW = document.createElement('span');       // 上层：白色，被填充宽度裁
  numW.className = 'yh-pool-num yh-pool-num-w';
  numW.setAttribute('aria-hidden', 'true');
  t.append(f, num, numW);

  // '412/500' / '168/200' —— 只认这一种形状（数据层给的就是它）。
  const m = /^\s*(-?[\d.]+)\s*\/\s*(-?[\d.]+)\s*$/.exec(String(值文));
  if (坏 || !m || Number(m[2]) <= 0) {
    // 🔴 读不出来 ⇒ **轨道照画、不填**，条里写「读不到」（'.yh-pool-na'）。
    //    画一根 0% 的条会被读成"真的一点都没有了"—— 那是**另一个意思**。
    //    ⚠ 只写底层那份；上层留空（空节点裁不裁都看不见），不必再设一次 clip-path。
    row.classList.add('yh-pool-na');
    num.textContent = '读不到';
  } else {
    const 当前 = Number(m[1]), 上限 = Number(m[2]);
    // 🔴 百分比夹在 0~100：模型可能写超额（'600/500'）⇒ 不夹的话条会捅出轨道。
    //    条画满是 100%，但**文字照实报原值**（不粉饰数据）。
    const 百 = Math.max(0, Math.min(100, (当前 / 上限) * 100));
    const 一位 = Math.round(百 * 10) / 10;          // 一位小数 —— 少一位就少一次无谓重排
    f.style.width = 一位 + '%';
    // ⚠ 照抄原串，**不重排数字** —— '0412' 这种前导零是数据原样，不是我该"修"的。
    //    四改那版分 '<b>'/'<i>' 两个字号（读数 vs 量程），条内是一整串，那层区分撤了。
    num.textContent = m[1] + ' / ' + m[2];
    numW.textContent = num.textContent;
    numW.style.clipPath = 'inset(0 ' + (100 - 一位) + '% 0 0)';
  }
  row.append(l, t);
  盒.appendChild(row);
  return 盒;
}

function 画状态(主) {
  const 框 = document.createElement('div');
  框.className = 'yh-pane';
  框.setAttribute('role', 'tabpanel');

  if (主 === null || typeof 主 !== 'object') {
    const d = document.createElement('div');
    d.className = 'yh-no';
    d.textContent = '读不到';       // 细节由下面的「错」行给，这儿不重复
    框.appendChild(d);
    return 框;
  }

  // 🔴 主角头 —— **在网格之前**，横贯整幅，不参与 2×2 的排布。
  //    它是这一页的"是谁"，下面五张卡是"什么状态"；先有人、再有数。
  框.appendChild(画主角头(主));
  // 🔴 **2026-09-30 从五组加到七组** —— 补的「攻」与「质点」是卡文 `1108` 三、面板十二行里
  //    的**第八行与第五行**，前端先前一个字都没画。次序照卡文那张表：
  //    质点(五) → 五维(六) → 三值(七) → 攻(八) → 三抗(十) → 心智(十一)，
  //    只把 `三值` 提到最前（它 `grid-column: 1/-1` 横贯整幅，放哪儿都是单独一行），
  //    再把卡文里没有的 `成长` 收在末尾（它出自 `9900037` 四、，是另一处规格）。
  框.appendChild(网格(画组([组三值(主), 组五维(主), 组攻(主), 组三抗(主), 组心智(主), 组精神(主), 组质点(主), 组成长(主)])));
  return 框;
}

/* 五张分组卡（'.yh-gcard'）—— 状态页与「在场」详情层**共用这一支**（2026-09-29 挪出来的）。
   🔴 为什么提到外面：在场详情层要画同一个人的属性，而正确做法**不是照抄那 60 行**，
      是**把那段挪出来、两边都调它**。抄一份的代价不是"多 60 行"，是**从此两处各自长**：
      今天给组卡加一条横杠、明天改一处字号，改哪一处都只改了一半，而且**不报错**。
   ⚠ 它吃的 `组们` 是 `组*()` 造的标准结构（`{标签, 格}`）—— **喂谁进去都行**：
      `组三值(主)` 与 `组三值(条)` 是**同一支函数**，因为 `角色` 项的形状就是
      `主角` 减 `金钱` 加 `在场/好感度/关系` 三格（`_MVU变量字段总表.md` §3）。
   ⚠ 返回的是**节点数组**、不是网格：状态页整个交给 `网格()` 铺两栏；
      在场详情层把它当一棵"进 '.yh-body' 的整行块"，五张卡竖着排。 */
// 折叠开关的 id 序号 —— 状态页和详情层都会调 `画组`，**必须全局递增**：
// 每调一次从 0 重数，两处的 id 就会撞，'for' 指到隔壁那张卡的开关上去。
let 折序号 = 0;
function 画组(组们) {
  // 🔴 池子条：只有「三值」这一组走条。判据是**这组的标签**（'组三值' 给的固定串），
  //    不是"看起来像数字"—— 五维也是数字，但它没有上限、画不出条。
  const 是三值 = (g) => g.标签 === '三值';
  return 组们.map((g) => {
    const el = document.createElement('div');
    // 🔴 **'.yh-gcard' ＋ '--g' 组色**（2026-09-28 加）——
    //    起因：五张卡全是「米底 ＋ 1px 线」，扫一屏分不出哪张是哪张，
    //    而分组抬头那 11.5px 的小字**太轻**，扛不起"分组"这件事。
    //    改法：每张卡**顶上压一条 3px 组色横杠**，抬头图标同色，抬头右侧再引一条
    //    组色渐隐的细线通到卡右缘。三处同一个色源，读起来是**一套编码**，不是装饰。
    //    ⚠ 色走**矿物色**（朱砂/赭金/石青/月靛/苔绿），全部在暖米纸上降过饱和 ——
    //      荧光色是屏幕色，压在纸上就是"贴上去的"。
    //    ⚠ 组色**只上横杠／图标／细线**，**不上文字、不上卡底** ——
    //      文字一上色就开始跟告急色（'--p-urgent'）抢"这是不是危险"的语义。
    el.className = 'yh-card yh-gcard yh-g-' + (组色[g.标签] || 'dim');
    // 组名走 '.yh-gn'（小字＋图标），**不是** '.yh-c-n' 的抬头发字号 ——
    // 分组抬头不该跟条目名一样重，否则一片卡扫下来分不清哪层是哪层。
    // 🔴 **窄屏折叠**（2026-10-01 驾驶员工单）—— 窄屏下分组卡塌成一列，一页拖成一根长条。
    //    改法：抬头可点、组内容默认收起，抬头自己就是那张索引。**零 JS** ——
    //    开关是一个视觉隐藏的复选框，显隐全交给 CSS 的 ':has(> .yh-cl:not(:checked))'。
    //    ⚠ **只在同级有兄弟时才挂** —— 整组就一张卡时收起它＝把整页藏了。
    const 可折 = 组们.length > 1;
    const 名 = document.createElement(可折 ? 'label' : 'span');
    名.className = 'yh-gn';
    if (可折) {
      折序号 += 1;
      const id = 'yh-cl' + 折序号;
      const 开 = document.createElement('input');
      开.type = 'checkbox';
      开.className = 'yh-sr yh-cl';
      开.id = id;
      名.setAttribute('for', id);
      el.appendChild(开);
    }
    const 图名 = 组图标[g.标签];
    if (图名) 名.appendChild(图标(图名, 18));
    const 名文 = document.createElement('span');
    名文.textContent = g.标签;
    名.appendChild(名文);
    // 🔴 **组的副题**（2026-09-30 加）—— 见 `组攻`：`主手段` 是"这一行叫什么"，
    //    走抬头右边的小字，**不跟「攻值」并排抢那 86px**（抢的结果是压字 12px、
    //    两串字叠在一起）。不带副题的组**一个字节都不变**。
    if (g.副) {
      const 副名 = document.createElement('span');
      副名.className = 'yh-gn-sub';
      副名.textContent = String(g.副);
      名.appendChild(副名);
    }
    // 折叠箭头：左右两条边透明、顶边有色的三角；收起时转 −90° 朝右（手风琴老规矩）。
    // ⚠ 抬头右侧那条组色渐隐细线是 '.yh-gn::after' 且 'flex:1 1 auto'
    //   ⇒ 箭自然被推到卡右缘，不用另做定位。
    if (可折) {
      const 箭 = document.createElement('i');
      箭.className = 'yh-ar';
      箭.setAttribute('aria-hidden', 'true');
      名.appendChild(箭);
    }
    el.appendChild(名);

    if (是三值(g)) {
      // 池子条 —— 三根竖着排
      const 条们 = document.createElement('div');
      条们.className = 'yh-pools';
      g.格.forEach((格) => {
        条们.appendChild(造条(格.签, 格.值 != null ? 格.值 : 格.文, 格.类 === '坏'));
      });
      el.appendChild(条们);
    } else {
      // 统计小格 —— 列宽见 `_分栏_样式.css` 的 `.yh-stats`（`auto-fit` ＋ 下限 120px）。
      // ⚠ 这儿原来写死着 `78px`，那是压字的元凶、早改了 —— **别把值抄进注释**，抄了就会过期。
      const 格们 = document.createElement('div');
      格们.className = 'yh-stats';
      g.格.forEach((格) => {
        const 值文 = String(格.值 != null ? 格.值 : 格.文);
        const s = document.createElement('div');
        // 有标签（'好对' 造的）⇒ 一行两列：标签左、值右（命定 '.attributeItem'）
        s.className = 'yh-stat' + (格.签 != null ? ' yh-stat-row' : '');
        if (格.签 != null) {
          const k = document.createElement('span');
          k.className = 'yh-stat-k';
          k.textContent = 格.签;
          s.appendChild(k);
        }
        const v = document.createElement('span');
        v.className = 格.类 === '坏' ? 'yh-stat-v yh-no' : 'yh-stat-v';
        v.textContent = 值文;
        // 🔴 `副`（品阶/状态）走**值的下一行**，不挤进值串（2026-09-28，驾驶员裁定「用命定」）。
        //    依据 ＝ 命定 `StatusTab.module.scss` `.heroTitleRow`：`heroLevel` 在上、
        //    `heroTier` 在下一行 —— **数值和它的品阶是上下两行**。
        //    为什么必须拆：全角括号在 18px 下每个都是 18px 满宽，`（蚀刻）` 四个字符
        //    吃掉 72px ＝ 900 档那格 104px 内宽的 **69%**，而真正的数字只占 20px
        //    ⇒ 整串折行、格高一倍、右半边三分之二全空（实拍见 `_量分栏` 的图）。
        //    `.yh-stat-vg` 竖排组：值在上、副在下、**都贴右**（与同组其它格同一条右边缘，
        //    这样"值右对齐"那条判据在拆开之后仍然成立）。
        //    ⚠ `副` 为空时**一个字节都不变** —— 只有「月蚀度」这一格带副，其余照旧。
        if (格.副 != null) {
          const 值组 = document.createElement('span');
          值组.className = 'yh-stat-vg';
          值组.appendChild(v);
          const vs = document.createElement('span');
          vs.className = 'yh-stat-vs';
          vs.textContent = String(格.副);
          值组.appendChild(vs);
          s.appendChild(值组);
        } else {
          s.appendChild(v);
        }
        格们.appendChild(s);
      });
      // `--格数` ＝ 这一组真发了几格，列数按它均分（现推不写死）
      格们.style.setProperty('--格数', String(格们.childElementCount));
      el.appendChild(格们);
    }
    return el;
  });
}

// 分组抬头图标 —— 键是 '组*()' 给的固定标签串（不是模型数据，所以可以直接查表）
// ⚠ 「三值」**不能**用 `心` —— 那会和池子条行内的 HP 图标撞成同一个形状（见 `图标源` 里 `脉` 的说明）。
const 组图标 = { 三值: '脉', 五维: '星', 三抗: '盾', 心智: '眼', 精神类: '心', 成长: '升', 攻: '剑', 质点: '质' };

// 分组 → 组色记号（'yh-g-*' 五个类在 `_分栏_样式.css` 里，色值也只在那边）
// ⚠ **只在这五个组之间**分配，不跟 '--p-urgent' / '--c-hp-*' 那套池子色共用 ——
//    池子色说的是"这条资源是什么"，组色说的是"这是哪一组"，两套语义别混。
// ⚠ 「心智」与「精神类」**故意同色**（`mind`）—— 它们是同一条轴的两截
//    （`心智` 是月蚀那一路的侵蚀读数，`精神类` 是装备词条能改的那两个点）。
//    **不新造第七个色**：矿物色就那么多，硬凑一个就会跟 `--g-res` / `--g-mind` 撞成近色，
//    而那比"两组同色"更难读 —— 同色至少读得出"这是一家"。
const 组色 = { 三值: 'life', 五维: 'dim', 三抗: 'res', 心智: 'mind', 精神类: 'mind', 成长: 'grow', 攻: 'atk', 质点: 'node' };

function 画页(主, 角, 线典, 务典, 连典) {
  // 🔴 「在场」「主线」「任务」「连携」四页由各自那个函数建框 —— 先交出去，别白建一个空 div
  if (当前页 === '在场') return 画在场(角);
  if (当前页 === '主线') return 画主线(线典);
  if (当前页 === '任务') return 画任务(务典);
  if (当前页 === '连携') return 画连携(连典);

  if (!已建[当前页]) {
    const 框 = document.createElement('div');
    框.className = 'yh-pane';
    框.setAttribute('role', 'tabpanel');
    // 🔴 **空得体面，不是一行灰字**（方案 §9B.3 乙）——
    //    但加的**只是画法**：一枚空态图标 ＋ 那三个字 ＋ CSS 画的一圈角刻线，
    //    **一个字的新文案都没有**，也**不碰数据**（§9B.7）。
    //    ⚠ 单独给一个类而不是改 `.yh-d`：那一个是**共用的「未定的值」色**
    //      （`_分栏_内容区.js` 里 11 处在用），动它会连带改掉那 11 处。
    const 空 = document.createElement('div');
    空.className = 'yh-空';
    空.appendChild(图标('空态'));
    const d = document.createElement('div');
    d.className = 'yh-d';
    d.textContent = '未开放';       // 🔴 不许静默留白 —— 空着分不清「没做」和「坏了」
    空.appendChild(d);
    框.appendChild(空);
    return 框;
  }

  // 「状态」页 —— 五个组铺两栏（⚠ 组**不挂详情层**：一组最多 4 对短值，一次看得完）
  return 画状态(主);
}
/* ── 10. 画（一律 createElement ＋ textContent，不拼字符串）─────────────── */
function 画(行) {
  最后行 = 行;      // 🔴 存下来给 切页() 重画用
  const 框 = document.querySelector('.yh-sb') || document.body;
  while (框.firstChild) 框.removeChild(框.firstChild);

  const 加 = (文, 类) => {
    const d = document.createElement('div');
    if (类) d.className = 类;
    d.textContent = 文;
    框.appendChild(d);
    return d;
  };

  // 🔴 页眉那条冷灰带**并掉了**（驾驶员 2026-09-27 拍板）：
  //    标题文字整条删除，身份只剩页签条左端那一个 SVG 徽记。
  //    省下来的是一整行高度（原页眉 5+15+6 = 26px），且 390 档常驻条能少折一次行。

  // 顶部常驻条（拿不到那一块时整条不画，由 行.错 说明为什么）
  if (行.格子) {
    const 条 = document.createElement('div');
    条.className = 'yh-bar';
    行.格子.forEach((g, i) => {
      if (i > 0) {
        const 隔 = document.createElement('span');
        隔.className = 'yh-sep';
        隔.textContent = '│';
        条.appendChild(隔);
      }
      const 格 = document.createElement('span');
      // 未定 ＝ 卡里本来就是空的（**不是错**）⇒ 灰；坏 ＝ 类型不对/取不到 ⇒ 红
      格.className = g.类 === '坏' ? 'yh-no' : (g.类 === '未定' ? 'yh-d' : '');
      装格(格, g);
      条.appendChild(格);
    });
    框.appendChild(条);
  }

  // 🔴 快照**根本没读到** ⇒ 页签与页内容都不画（同常驻条：错的时候只留一个说清为什么的字）。
  //    快照读到了、只是缺 `世界` 或 `主角` ⇒ 照画（缺的那一块由 行.错 说明）——
  //    这就是「缺一块不塌另一块」。
  if (行.快照) {
    // 🔴 内容区先造出来、拿住引用 —— 详情层要挂**它**身上（见下）
    const 内容 = 画页(行.主角, 行.角色, 行.线典, 行.务典, 行.连典);
    框.appendChild(画签());
    框.appendChild(内容);
    // 🔴 详情层挂在**内容区**（'.yh-pane'）里，**取代**列表 —— 不是挂在面板上盖住它。
    //    挂面板时顶部留一条 26.25px 遮罩带，带里是**页眉带被切掉下半截的字**
    //    （900 档任务页实拍，看着像渲染坏了）；改挂内容区后遮罩带 0，但详情被压进
    //    110px 的内容区里**内部滚动**（"长文本一次看全"又丢了）。
    //    ⇒ 详情层参与正常流、撑开内容区，'.yh-grid' 由 CSS 抽走（见 '_分栏_样式.css'）。
    //    ⚠ '.yh-pane' 得 'position: relative'（在 '_分栏_样式.css' 里给了）。
    if (详情) {
      const 层 = 画详情(详情);
      内容.appendChild(层);
      // 🔴 只在**刚打开**那一帧聚焦，重画不抢焦点（否则切页/刷新会把焦点硬拽回来）
      if (详情要聚焦) { 详情要聚焦 = false; 层.querySelector('.yh-sheet').focus(); }
      // 🔴 **点页签换节之后，焦点落回新选中的那一签**（2026-09-28 加 · 任务 #14）。
      //    页签的 click 是"重画整层"（`画详情` 每次造新的 DOM），旧的那个 <button> 已经
      //    不在文档里了 ⇒ **焦点会掉到 <body>**，键盘用户按一下 Tab 就从页面开头重来。
      //    ⚠ 这一支是 `if (详情要聚焦)` 的 **else if**（＝"刚打开"和"换了节"二选一，两者
      //      本来就互斥：`开详情()` 把 `详情要聚焦` 置 true 的同时把 `详情签` 归 0）。
      //      **但它必须留在 `if (详情)` 这一层里面** —— 挪出去写就够不着 `层` 了。
      //    ⚠ 只在**有签条**时才找得到；节数 = 1 时没有 `.yh-sh-tab-on`，`?.` 兜住。
      else if (签要聚焦) { 签要聚焦 = false; 层.querySelector('.yh-sh-tab-on')?.focus(); }
    }
    // 🔴 **状态筛换档之后，焦点落回新选中那一颗**（2026-09-29 加）。
    //    理由同上面签条那条（点一下 <button> 就重画整层，旧的已经不在文档里 ⇒ 焦点掉 body）。
    //    ⚠ **必须在这儿、不能在 `画筛()` 里** —— `画筛` 跑的时候整棵 `.yh-pane` **还没进文档**，
    //      游离节点上的 `.focus()` 是**静默空操作**：不报错、不抛异常、`activeElement` 照旧 body。
    //      截图上永远看不出来，只有探针量 `document.activeElement` 才露 —— 第一版就是这么栽的。
    //    ⚠ 它**不在** `if (详情)` 里面（筛选条和详情层互斥，详情层一开筛选条就抽走了），
    //      所以跟上面那两枝是**并列**关系，不是 else if。
    if (筛要聚焦) { 筛要聚焦 = false; 内容.querySelector('.yh-fl-on')?.focus(); }
  }

  // 🔴 **「末行留洞」不在这儿治**（2026-09-28 改）——
  //    原来这儿调 `标长格()`（挂载后实测、给放不下的格挂跨行类）。**整套撤了**：
  //    它靠"挂载那一刻的宽度"当判据，宽度一变就过期；而且那个类本来就多余，
  //    `.yh-stat-row` 自己会把长值折到第二行（判据：「宁可整格折行，不许压字」）。
  //    列宽/末行由 CSS 负责，不需要任何 JS —— `.yh-stats` 是 `auto-fit` 等宽网格，
  //    空轨道自动塌缩、末行不满就左对齐空着（**这是正常网格行为，不是洞**）。
  //    完整经过（`grid-column-end` 语义用错 → 换 flex 过度修正 → 撤回）见
  //    `_分栏_样式.css` 的墓碑，那里记了两种错法各自的样子。

  if (行.报) 加(行.报, 行.报好 ? 'yh-ok' : 'yh-no');
  if (行.源) 加(行.源, 'yh-src yh-d');
  if (行.错) 加(行.错, 'yh-err');

  去重();   // 🔴 画完才调 —— 这一刻 .yh-sb 才存在，别处调都是空转
}

/* ── 11. 一轮 ─────────────────────────────────────────────────────────────
   🔴 四条读取链一个字不改（轮 1-2 已定）：楼号必带 · 两条路 · 不降级 latest · 失败画出来。 */
async function 一轮() {
  try {
    await 等Mvu(4000);

    const { 楼, 报: 楼报 } = 取楼号();
    if (楼 === null) {
      画({ 快照: false, 格子: null, 主角: null, 报: '读不到本楼楼号 ✗', 报好: false, 源: '', 错: 楼报 });
      return;
    }

    const { 路, 数据, 报 } = 读快照(楼);
    if (!路) {
      画({ 快照: false, 格子: null, 主角: null, 报: '第 ' + 楼 + ' 楼 · 快照没读到 ✗', 报好: false, 源: '', 错: 报.join('\n') });
      return;
    }

    // 🔴 **只读一次**快照，常驻条与状态页**共用**（轮 1-3 口径 ⑦）
    const 世 = 取(数据, ['stat_data', '世界']);
    const 主 = 取(数据, ['stat_data', '主角']);
    const 角 = 取(数据, ['stat_data', '角色']);      // 轮 1-5：「在场」页的数据根
    const 线 = 取(数据, ['stat_data', '世界', '主线']);   // 轮 1-6：「主线」页的数据根
    const 务 = 取(数据, ['stat_data', '任务']);        // 轮 1-7：「任务」页的数据根（🔴 顶层，不在 世界 底下）
    const 连 = 取(数据, ['stat_data', '连携']);        // 轮 1-8：「连携」页的数据根（🔴 顶层，同一个道理）
    const 世好 = 世 !== null && typeof 世 === 'object';
    const 主好 = 主 !== null && typeof 主 === 'object';
    const 角好 = 角 !== null && typeof 角 === 'object';
    // 🔴 线好**多挡一层数组**（角好 没有 —— 那是 1-5 的既有写法，本轮不动它）。
    //    数组也是 object，放过去就会让诊断行缺席、页面只剩一个没头没尾的「读不到」。
    const 线好 = 线 !== null && typeof 线 === 'object' && !Array.isArray(线);
    // 🔴 务好 同 线好，也多挡一层数组（理由同上：数组放过去会让诊断行缺席、页面只剩「读不到」）
    const 务好 = 务 !== null && typeof 务 === 'object' && !Array.isArray(务);
    // 🔴 连好 同 务好，也多挡一层数组（理由同上：数组放过去会让诊断行缺席、页面只剩「读不到」）
    const 连好 = 连 !== null && typeof 连 === 'object' && !Array.isArray(连);

    // 🔴 **缺一块不塌另一块**（轮 1-4 改 1-3 的行为，方案 §5.1）。
    //    「快照拿到了、里面没有 X」和「两条路都没成」是**两回事** ⇒ 分开报，
    //    并把真读到的东西摘要出来 —— 形状没验过（§5），这是唯一能看清真相的窗口。
    const 错 = [];
    if (!世好) 错.push('`stat_data.世界` 不是对象 ⇒ 常驻条不画。读到的 ＝ ' + 摘要(世));
    if (!主好) 错.push('`stat_data.主角` 不是对象 ⇒ 状态页不画。读到的 ＝ ' + 摘要(主));
    if (!角好) 错.push('`stat_data.角色` 不是对象 ⇒ 「在场」页不画。读到的 ＝ ' + 摘要(角));
    if (!线好) 错.push('`stat_data.世界.主线` 不是对象 ⇒ 「主线」页不画。读到的 ＝ ' + 摘要(线));
    if (!务好) 错.push('`stat_data.任务` 不是对象 ⇒ 「任务」页不画。读到的 ＝ ' + 摘要(务));
    if (!连好) 错.push('`stat_data.连携` 不是对象 ⇒ 「连携」页不画。读到的 ＝ ' + 摘要(连));

    画({
      快照: true,
      格子: 世好 ? [格历法(世), 格时刻(世), 格地点(世), 格危机(世)] : null,
      主角: 主好 ? 主 : null,
      角色: 角好 ? 角 : null,
      线典: 线好 ? 线 : null,
      务典: 务好 ? 务 : null,
      连典: 连好 ? 连 : null,
      报: '',
      源: '轮 1-10 · 第 ' + 楼 + ' 楼快照 · 走 ' + 路
        + (报.length ? ' · 前一档没成：' + 报.join('；') : ''),
      错: 错.join('\n'),
    });
  } catch (e) {
    // 🔴 失败必须画出来 —— C2 §7.2：分区渲染抛错不隔离 ⇒ 整面板空白且什么都不报
    画({ 快照: false, 格子: null, 主角: null, 报: '骨架自己抛错了 ✗', 报好: false, 源: '', 错: (e && e.stack) ? String(e.stack) : String(e) });
  }
}

/* ── 12. 刷新（轮 1-3 接的，一个字没改）──────────────────────────────────
   照 C2 §5.1 范式 ＋ §335/336 事件表（均 high·运行时源码）：
     🔴 ① `await waitGlobalInitialized('Mvu')` **必须在前** —— 漏 await ⇒ `Mvu is not defined`
     🔴 ② 事件名**一律用枚举，绝不手写字符串**：
           `Mvu.events.VARIABLE_INITIALIZED` 的真值是 `'mag_variable_initiailized'`
           （**双 i** —— 上游拼写错误）。手写一遍就**静默失效**：不报错，只是永远不刷新。
   取不到就**静默跳过** —— 不影响首帧（首帧本来就有 一轮() ＋ 600ms 兜底）。
   ⚠ 重画会保留**当前页**（模块级 `当前页`）—— 否则每次变量更新都把人踢回第一页。 */
let 刷新计时 = 0;
